# Collector profiles (DIS-02): classification and collection data.
- name: juniper-junos-snmp
  vendor: Juniper
  model: JunOS
  protocol: snmp
  ciType: switch
  plugin: snmp
  systemTemplate: network-switch
  sysObjectIds:
  - 1.3.6.1.4.1.2636.1.1.1.2
  ouiPrefixes:
  - '00:05:85'
  - '00:12:1E'
  - '28:C0:DA'
  - '3C:61:04'
  - '54:1E:56'
  - '78:FE:3D'
  - '84:18:88'
  - 'B0:C6:9A'
  - 'D4:04:FF'
  snmpOids:
    sysDescr: 1.3.6.1.2.1.1.1.0
    sysName: 1.3.6.1.2.1.1.5.0
    sysUpTime: 1.3.6.1.2.1.1.3.0
    jnxBoxSerialNo: 1.3.6.1.4.1.2636.3.1.3.0
    jnxBoxDescr: 1.3.6.1.4.1.2636.3.1.2.0
    jnxBoxRevision: 1.3.6.1.4.1.2636.3.1.4.0
    ifDescr: 1.3.6.1.2.1.2.2.1.2
    ifOperStatus: 1.3.6.1.2.1.2.2.1.8
    ifHighSpeed: 1.3.6.1.2.1.31.1.1.1.15
  attributes:
    category: network_device
    device_type: switch
  # Optics (DOM/DDM, WP-1005): JUNIPER-DOM-MIB, jnxDomCurrentTable
  # 1.3.6.1.4.1.2636.3.60.1.1.1, entry jnxDomCurrentEntry .1, index ifIndex
  # (IF-MIB), one row per transceiver. Units of the MIB: Rx/Tx power and
  # their thresholds 0.01 dBm, bias 0.001 mA, temperature Celsius, voltage
  # 0.001 V; one table per unit, merged per interface. Columns
  # 1.3.6.1.4.1.2636.3.60.1.1.1.1.<n>: jnxDomCurrentRxLaserPower (5),
  # jnxDomCurrentTxLaserBiasCurrent (6), jnxDomCurrentTxLaserOutputPower
  # (7), jnxDomCurrentModuleTemperature (8), Rx power high/low alarm and
  # high/low warning thresholds (9–12), bias (13–16), Tx power (17–20),
  # temperature (21–24), jnxDomCurrentModuleVoltage (25) and its
  # thresholds (26–29).
  monitor:
    # Subscriber sessions (PRT-10, WP-1006; preliminary platform Juniper
    # MX): JUNIPER-SUBSCRIBER-MIB (1.3.6.1.4.1.2636.3.64).
    # jnxSubscriberTotalCount 1.3.6.1.4.1.2636.3.64.1.1.1.2 (scalar) and
    # jnxSubscriberClientTypeCount of jnxSubscriberClientTypeTable
    # (1.3.6.1.4.1.2636.3.64.1.1.1.5.1.3, index jnxSubscriberClientType:
    # dhcp(1), l2tp(2), ppp(3), pppoe(4), vlan(5), generic(6), mobileIp(7),
    # vplsPw(8), mnh(9), static(10)); DHCP, VLAN and static subscribers
    # count as IPoE.
    bng:
      tables:
        sessions:
          index: int
          columns:
            total: 1.3.6.1.4.1.2636.3.64.1.1.1.2
        by_type:
          index: int
          columns:
            sessions: 1.3.6.1.4.1.2636.3.64.1.1.1.5.1.3
          enums:
            sessions:
              '1': ipoe
              '4': pppoe
              '5': ipoe
              '10': ipoe
    # BGP (PRT-07, WP-1001): BGP4-V2-MIB-JUNIPER (jnxBgpM2,
    # 1.3.6.1.4.1.2636.5.1.1). jnxBgpM2PeerEntry 1.3.6.1.4.1.2636.5.1.1.2.1.1.1,
    # index routing instance + local and remote InetAddress:
    # jnxBgpM2PeerState (2), jnxBgpM2PeerStatus (3, halted(1),
    # running(2)), jnxBgpM2PeerRemoteAddrType (10), jnxBgpM2PeerRemoteAddr
    # (11), jnxBgpM2PeerRemoteAs (13), jnxBgpM2PeerIndex (14, key of the
    # other tables). jnxBgpM2PeerCountersEntry 1.3.6.1.4.1.2636.5.1.1.2.6.1.1:
    # InUpdates (1), FsmEstablishedTransitions (5);
    # jnxBgpM2PeerEventTimesEntry 1.3.6.1.4.1.2636.5.1.1.2.4.1.1:
    # FsmEstablishedTime (1); jnxBgpM2PrefixCountersEntry
    # 1.3.6.1.4.1.2636.5.1.1.2.6.2.1: InPrefixesAccepted (4), index
    # jnxBgpM2PeerIndex + AFI + SAFI.
    bgp:
      tables:
        peers:
          index: composite:[int,inet,inet]
          columns:
            state: 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.2
            admin_status: 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.3
            remote_addr_type: 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.10
            remote_addr: 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.11
            remote_as: 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.13
            peer_index: 1.3.6.1.4.1.2636.5.1.1.2.1.1.1.14
          enums:
            state:
              '1': idle
              '2': connect
              '3': active
              '4': openSent
              '5': openConfirm
              '6': established
            admin_status:
              '1': down
              '2': up
        counters:
          index: int
          columns:
            in_updates: 1.3.6.1.4.1.2636.5.1.1.2.6.1.1.1
            established_transitions: 1.3.6.1.4.1.2636.5.1.1.2.6.1.1.5
        event_times:
          index: int
          columns:
            established_time: 1.3.6.1.4.1.2636.5.1.1.2.4.1.1.1
        prefixes:
          index: composite:[int,int,int]
          columns:
            prefixes: 1.3.6.1.4.1.2636.5.1.1.2.6.2.1.4
    optical:
      tables:
        interface_power:
          index: int
          scale: 0.01
          unit: dBm
          columns:
            rx: 1.3.6.1.4.1.2636.3.60.1.1.1.1.5
            tx: 1.3.6.1.4.1.2636.3.60.1.1.1.1.7
            rx_high_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.9
            rx_low_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.10
            rx_high_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.11
            rx_low_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.12
            tx_high_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.17
            tx_low_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.18
            tx_high_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.19
            tx_low_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.20
          threshold_columns:
            rx_high_alarm: rx_high_alarm
            rx_low_alarm: rx_low_alarm
            rx_high_warn: rx_high_warn
            rx_low_warn: rx_low_warn
            tx_high_alarm: tx_high_alarm
            tx_low_alarm: tx_low_alarm
            tx_high_warn: tx_high_warn
            tx_low_warn: tx_low_warn
        interface_bias:
          index: int
          scale: 0.001
          unit: mA
          columns:
            bias: 1.3.6.1.4.1.2636.3.60.1.1.1.1.6
            bias_high_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.13
            bias_low_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.14
            bias_high_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.15
            bias_low_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.16
          threshold_columns:
            bias_high_alarm: bias_high_alarm
            bias_low_alarm: bias_low_alarm
            bias_high_warn: bias_high_warn
            bias_low_warn: bias_low_warn
        interface_temperature:
          index: int
          unit: Celsius
          columns:
            temperature: 1.3.6.1.4.1.2636.3.60.1.1.1.1.8
            temperature_high_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.21
            temperature_low_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.22
            temperature_high_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.23
            temperature_low_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.24
          threshold_columns:
            temperature_high_alarm: temperature_high_alarm
            temperature_low_alarm: temperature_low_alarm
            temperature_high_warn: temperature_high_warn
            temperature_low_warn: temperature_low_warn
        interface_voltage:
          index: int
          scale: 0.001
          unit: V
          columns:
            voltage: 1.3.6.1.4.1.2636.3.60.1.1.1.1.25
            voltage_high_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.26
            voltage_low_alarm: 1.3.6.1.4.1.2636.3.60.1.1.1.1.27
            voltage_high_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.28
            voltage_low_warn: 1.3.6.1.4.1.2636.3.60.1.1.1.1.29
          threshold_columns:
            voltage_high_alarm: voltage_high_alarm
            voltage_low_alarm: voltage_low_alarm
            voltage_high_warn: voltage_high_warn
            voltage_low_warn: voltage_low_warn
