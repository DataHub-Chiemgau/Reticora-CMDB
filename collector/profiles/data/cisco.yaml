# Collector profiles (DIS-02): classification and collection data.
- name: cisco-ios-snmp
  vendor: Cisco
  model: IOS
  protocol: snmp
  ciType: switch
  plugin: snmp
  systemTemplate: network-switch
  sysObjectIds:
  - 1.3.6.1.4.1.9.1
  ouiPrefixes:
  - '00:1B:0D'
  - '00:1E:F6'
  - '28:6F:7F'
  - '4C:4E:35'
  - '70:81:05'
  - '84:78:AC'
  - 'A4:4C:11'
  - 'CC:EF:48'
  - 'F4:CF:E2'
  snmpOids:
    sysDescr: 1.3.6.1.2.1.1.1.0
    sysName: 1.3.6.1.2.1.1.5.0
    sysUpTime: 1.3.6.1.2.1.1.3.0
    entPhysicalSerialNum: 1.3.6.1.2.1.47.1.1.1.1.11.1
    entPhysicalModelName: 1.3.6.1.2.1.47.1.1.1.1.13.1
    entPhysicalSoftwareRev: 1.3.6.1.2.1.47.1.1.1.1.10.1
    ifDescr: 1.3.6.1.2.1.2.2.1.2
    ifOperStatus: 1.3.6.1.2.1.2.2.1.8
    ifHighSpeed: 1.3.6.1.2.1.31.1.1.1.15
    lldpRemSysName: 1.0.8802.1.1.2.1.4.1.1.9
    cdpCacheDeviceId: 1.3.6.1.4.1.9.9.23.1.2.1.1.6
  attributes:
    category: network_device
    device_type: switch
  # Monitoring (PRT-20, WP-1000): Cisco IOS/IOS-XE lead BFD in
  # CISCO-IETF-BFD-MIB (1.3.6.1.4.1.9.10.137, draft of RFC 7331), not in
  # BFD-STD-MIB (bfd, WP-1003), and the optical levels in
  # CISCO-ENTITY-SENSOR-MIB (optical, WP-1004).
  monitor:
    # BGP (PRT-07, WP-1001): CISCO-BGP4-MIB (1.3.6.1.4.1.9.9.187) with
    # IPv4 and IPv6 peers. cbgpPeer2Entry 1.3.6.1.4.1.9.9.187.1.2.5.1,
    # index cbgpPeer2Type + cbgpPeer2RemoteAddr (InetAddress):
    # cbgpPeer2State (3), cbgpPeer2AdminStatus (4, stop(1), start(2)),
    # cbgpPeer2RemoteAs (11), cbgpPeer2InUpdates (13),
    # cbgpPeer2FsmEstablishedTransitions (18),
    # cbgpPeer2FsmEstablishedTime (19). Prefixes:
    # cbgpPeer2AddrFamilyPrefixEntry 1.3.6.1.4.1.9.9.187.1.2.8.1,
    # cbgpPeer2AcceptedPrefixes (1), index peer + AFI + SAFI.
    bgp:
      tables:
        peers:
          index: inet
          columns:
            state: 1.3.6.1.4.1.9.9.187.1.2.5.1.3
            admin_status: 1.3.6.1.4.1.9.9.187.1.2.5.1.4
            remote_as: 1.3.6.1.4.1.9.9.187.1.2.5.1.11
            in_updates: 1.3.6.1.4.1.9.9.187.1.2.5.1.13
            established_transitions: 1.3.6.1.4.1.9.9.187.1.2.5.1.18
            established_time: 1.3.6.1.4.1.9.9.187.1.2.5.1.19
          enums:
            state:
              '1': idle
              '2': connect
              '3': active
              '4': openSent
              '5': openConfirm
              '6': established
            admin_status:
              '1': down
              '2': up
        prefixes:
          index: composite:[inet,int,int]
          columns:
            prefixes: 1.3.6.1.4.1.9.9.187.1.2.8.1.1
    bfd:
      tables:
        sessions:
          index: int
          columns:
            # ciscoBfdSessEntry 1.3.6.1.4.1.9.10.137.1.2.1: ciscoBfdSessState
            # (6), ciscoBfdSessDiag (8), ciscoBfdSessAddrType (13),
            # ciscoBfdSessAddr (14).
            state: 1.3.6.1.4.1.9.10.137.1.2.1.6
            diag: 1.3.6.1.4.1.9.10.137.1.2.1.8
            addr_type: 1.3.6.1.4.1.9.10.137.1.2.1.13
            addr: 1.3.6.1.4.1.9.10.137.1.2.1.14
          enums:
            state:
              '1': adminDown
              '2': down
              '3': init
              '4': up
            diag:
              '1': noDiagnostic
              '2': controlDetectionTimeExpired
              '3': echoFunctionFailed
              '4': neighborSignaledSessionDown
              '5': forwardingPlaneReset
              '6': pathDown
              '7': concatenatedPathDown
              '8': administrativelyDown
              '9': reverseConcatenatedPathDown
    # Optics (DOM/DDM, WP-1004): CISCO-ENTITY-SENSOR-MIB
    # (1.3.6.1.4.1.9.9.91) leads the transceiver levels in dBm with the
    # device thresholds in entSensorThresholdTable.
    optical:
      tables:
        sensors:
          index: int
          columns:
            # entSensorValueEntry 1.3.6.1.4.1.9.9.91.1.1.1.1: entSensorType
            # (1, SensorDataType with dBm(14)), entSensorScale (2),
            # entSensorPrecision (3), entSensorValue (4), entSensorStatus
            # (5: ok(1), unavailable(2), nonoperational(3)).
            type: 1.3.6.1.4.1.9.9.91.1.1.1.1.1
            scale: 1.3.6.1.4.1.9.9.91.1.1.1.1.2
            precision: 1.3.6.1.4.1.9.9.91.1.1.1.1.3
            value: 1.3.6.1.4.1.9.9.91.1.1.1.1.4
            status: 1.3.6.1.4.1.9.9.91.1.1.1.1.5
          enums:
            type:
              '4': voltsDC
              '5': amperes
              '6': watts
              '8': celsius
              '14': dBm
            status:
              '1': up
              '2': down
              '3': down
          patterns:
            rx: '(?i)(\b|_)(rx|receive)'
            tx: '(?i)(\b|_)(tx|transmit)'
        thresholds:
          index: composite:[int,int]
          columns:
            # entSensorThresholdEntry 1.3.6.1.4.1.9.9.91.1.2.1.1, index
            # entPhysicalIndex.entSensorThresholdIndex:
            # entSensorThresholdSeverity (2: other(1), minor(10),
            # major(20), critical(30)), entSensorThresholdRelation (3),
            # entSensorThresholdValue (4, scaled like the sensor).
            severity: 1.3.6.1.4.1.9.9.91.1.2.1.1.2
            relation: 1.3.6.1.4.1.9.9.91.1.2.1.1.3
            value: 1.3.6.1.4.1.9.9.91.1.2.1.1.4
          enums:
            severity:
              '1': other
              '10': degraded
              '20': down
              '30': down
            relation:
              '1': lessThan
              '2': lessOrEqual
              '3': greaterThan
              '4': greaterOrEqual
              '5': equalTo
              '6': notEqualTo
- name: cisco-ios-ssh
  vendor: Cisco
  model: IOS
  protocol: ssh
  sysObjectIds:
  - 1.3.6.1.4.1.9.1
  sshCommands:
    version: show version
    inventory: show inventory
    interfaces: show interfaces status
    neighbors: show cdp neighbors detail
    mac_table: show mac address-table
  attributes:
    category: network_device
    device_type: switch
- name: cisco-catalyst-9000-snmp
  vendor: Cisco
  model: Catalyst 9200/9300
  protocol: snmp
  catalog: Cisco Catalyst 9200/9300
  ciType: switch
  plugin: snmp
  systemTemplate: network-switch
  sysObjectIds:
  - 1.3.6.1.4.1.9.1
  sysDescrPattern: '(?i)\bC9[23]00|cat9k|catalyst 9[23]00'
- name: cisco-isr-asr-snmp
  vendor: Cisco
  model: ISR/ASR
  protocol: snmp
  catalog: Cisco ISR/ASR
  ciType: router
  plugin: snmp
  systemTemplate: router
  sysObjectIds:
  - 1.3.6.1.4.1.9.1
  sysDescrPattern: '(?i)\bISR|\bASR ?[0-9]|\bC1[01][0-9]{2}\b|\bC8[0-9]{3}'
  # Subscriber sessions (PRT-10, WP-1006; preliminary platform Cisco ASR
  # 9000): CISCO-SUBSCRIBER-SESSION-MIB (1.3.6.1.4.1.9.9.786).
  # csubAggStatsEntry 1.3.6.1.4.1.9.9.786.1.2.1.1, index
  # csubAggStatsPointType + csubAggStatsPoint + csubAggStatsSessionType
  # (SubSessionType of CISCO-SUBSCRIBER-SESSION-TC: all(1), other(2),
  # pppSubscriber(3), pppoeSubscriber(4), l2tpSubscriber(5),
  # l2fSubscriber(6), ipInterfaceSubscriber(7), ipPktSubscriber(8),
  # ipDhcpv4Subscriber(9), ipRadiusSubscriber(10), l2MacSubscriber(11),
  # l2Dhcpv4Subscriber(12), l2RadiusSubscriber(13)); csubAggStatsUpSessions
  # (4). Only the first aggregation point in walk order counts (physical
  # before interface: the chassis), never a sum across points; the enum
  # maps the session type to pppoe, ipoe or the total row.
  monitor:
    bng:
      tables:
        by_type:
          index: composite:[int,int,int]
          columns:
            sessions: 1.3.6.1.4.1.9.9.786.1.2.1.1.4
          enums:
            sessions:
              '1': total
              '4': pppoe
              '7': ipoe
              '8': ipoe
              '9': ipoe
              '10': ipoe
- name: cisco-asa-firepower-snmp
  vendor: Cisco
  model: ASA/Firepower
  protocol: snmp
  catalog: Cisco ASA/Firepower
  ciType: firewall
  plugin: snmp
  systemTemplate: firewall
  sysObjectIds:
  - 1.3.6.1.4.1.9.1
  sysDescrPattern: '(?i)adaptive security appliance|firepower|\bFTD\b'
