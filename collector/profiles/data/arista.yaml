# Collector profiles (DIS-02): classification and collection data.
- name: arista-eos-snmp
  vendor: Arista
  model: EOS
  protocol: snmp
  ciType: switch
  plugin: snmp
  systemTemplate: network-switch
  sysObjectIds:
  - 1.3.6.1.4.1.30065.1
  ouiPrefixes:
  - '00:1C:73'
  - '44:4C:A8'
  - '74:83:EF'
  - '98:5D:82'
  - 'D4:AF:F7'
  snmpOids:
    sysDescr: 1.3.6.1.2.1.1.1.0
    sysName: 1.3.6.1.2.1.1.5.0
    sysUpTime: 1.3.6.1.2.1.1.3.0
    entPhysicalSerialNum: 1.3.6.1.2.1.47.1.1.1.1.11.1
    entPhysicalModelName: 1.3.6.1.2.1.47.1.1.1.1.13.1
    ifDescr: 1.3.6.1.2.1.2.2.1.2
    ifOperStatus: 1.3.6.1.2.1.2.2.1.8
    ifHighSpeed: 1.3.6.1.2.1.31.1.1.1.15
    lldpRemSysName: 1.0.8802.1.1.2.1.4.1.1.9
  attributes:
    category: network_device
    device_type: switch
  # Optics (DOM/DDM, WP-1005): EOS reports the transceiver levels in
  # entPhySensorTable of ENTITY-SENSOR-MIB (the core of the optical type:
  # Rx/Tx power in watts, converted to dBm) and the device thresholds in
  # aristaEntSensorThresholdTable of ARISTA-ENTITY-SENSOR-MIB
  # (1.3.6.1.4.1.30065.3.12.1.1, entry .1, index entPhysicalIndex of the
  # sensor; syntax EntitySensorValue, scaled like entPhySensorValue of the
  # same sensor): aristaEntSensorThresholdLowWarning (1),
  # aristaEntSensorThresholdLowCritical (2),
  # aristaEntSensorThresholdHighWarning (3),
  # aristaEntSensorThresholdHighCritical (4).
  monitor:
    # BGP (PRT-07, WP-1001): ARISTA-BGP4V2-MIB (aristaBgp4V2,
    # 1.3.6.1.4.1.30065.4.1). aristaBgp4V2PeerEntry
    # 1.3.6.1.4.1.30065.4.1.1.2.1, index instance + remote InetAddress:
    # RemoteAs (10), AdminStatus (12, halted(1), running(2)), State (13).
    # aristaBgp4V2PeerEventTimesEntry 1.3.6.1.4.1.30065.4.1.1.4.1:
    # FsmEstablishedTime (1); aristaBgp4V2PeerCountersEntry
    # 1.3.6.1.4.1.30065.4.1.1.7.1: InUpdates (1),
    # FsmEstablishedTransitions (5); aristaBgp4V2PrefixGaugesEntry
    # 1.3.6.1.4.1.30065.4.1.1.8.1: PrefixInPrefixesAccepted (4), index
    # peer + AFI + SAFI.
    bgp:
      tables:
        peers:
          index: composite:[int,inet]
          columns:
            remote_as: 1.3.6.1.4.1.30065.4.1.1.2.1.10
            admin_status: 1.3.6.1.4.1.30065.4.1.1.2.1.12
            state: 1.3.6.1.4.1.30065.4.1.1.2.1.13
          enums:
            state:
              '1': idle
              '2': connect
              '3': active
              '4': openSent
              '5': openConfirm
              '6': established
            admin_status:
              '1': down
              '2': up
        counters:
          index: composite:[int,inet]
          columns:
            in_updates: 1.3.6.1.4.1.30065.4.1.1.7.1.1
            established_transitions: 1.3.6.1.4.1.30065.4.1.1.7.1.5
        event_times:
          index: composite:[int,inet]
          columns:
            established_time: 1.3.6.1.4.1.30065.4.1.1.4.1.1
        prefixes:
          index: composite:[int,inet,int,int]
          columns:
            prefixes: 1.3.6.1.4.1.30065.4.1.1.8.1.4
    optical:
      tables:
        sensor_thresholds:
          index: int
          columns:
            low_warning: 1.3.6.1.4.1.30065.3.12.1.1.1.1
            low_critical: 1.3.6.1.4.1.30065.3.12.1.1.1.2
            high_warning: 1.3.6.1.4.1.30065.3.12.1.1.1.3
            high_critical: 1.3.6.1.4.1.30065.3.12.1.1.1.4
          threshold_columns:
            low_warn: low_warning
            low_alarm: low_critical
            high_warn: high_warning
            high_alarm: high_critical
