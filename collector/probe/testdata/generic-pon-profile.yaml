# Test profile of the pon core (WP-1007): an OLT of a fictitious vendor
# (enterprise 99997) with the logical PON model in monitor.pon. The tests
# load it with profiles.LoadDir. ONU table 1.3.6.1.4.1.99997.2.1.1, index
# port ifIndex + ONU id; levels in hundredths of dBm.
- name: test-generic-olt
  vendor: Test
  model: OLT
  protocol: snmp
  ciType: switch
  sysObjectIds:
  - 1.3.6.1.4.1.99997.1
  monitor:
    pon:
      tables:
        onus:
          index: composite:[int,int]
          scale: 0.01
          unit: dBm
          columns:
            status: 1.3.6.1.4.1.99997.2.1.1.2
            sn: 1.3.6.1.4.1.99997.2.1.1.3
            rx_onu: 1.3.6.1.4.1.99997.2.1.1.4
            rx_olt: 1.3.6.1.4.1.99997.2.1.1.5
            last_down_cause: 1.3.6.1.4.1.99997.2.1.1.6
            distance: 1.3.6.1.4.1.99997.2.1.1.7
          enums:
            status:
              '1': online
              '2': offline
            last_down_cause:
              '1': los
              '2': dying_gasp
              '3': other
        ports:
          index: int
          columns:
            name: 1.3.6.1.2.1.31.1.1.1.1
