version: "2"

run:
  modules-download-mode: readonly

# v1 → v2 migration notes (WP-001):
#   - gosimple is part of staticcheck in v2.
#   - typecheck is no longer a linter; type errors are always reported.
#   - gofmt and goimports moved to the formatters section.
#   - exportloopref is removed upstream (obsolete since Go 1.22 loop
#     semantics); copyloopvar is its successor.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - unconvert
    - gocritic
    - revive
    - copyloopvar
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: unexported-return
          disabled: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
  exclusions:
    generated: lax
    # Reproduce the v1 default exclusions so the rule set is unchanged.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
      - path: cmd/
        linters:
          - gocritic

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Baseline (WP-001): only findings in code changed since this commit (main
  # at the time of the v2 migration) fail the build. Requires full git
  # history (fetch-depth: 0 in CI). The backlog behind it (WP-499, F-123) is
  # counted per module by scripts/ci/lint-debt.sh in the job lint and may
  # not rise above tests/lint-debt-baseline.txt ("make lint-debt"). It is
  # cleared by the follow-up work packages WP-613 to WP-629 (milestone
  # M2.11 Lint-Altlast in docs/plan/phase2/implementierungsplan.md); the
  # last of them, WP-629, removes this line.
  new-from-rev: 257e6fa0b74fd0a789490b48436b6cecf5cb3d24

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
