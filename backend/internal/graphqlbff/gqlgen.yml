# gqlgen configuration of the GraphQL BFF (GQL-01). Regenerate with
#   cd backend/internal/graphqlbff && go run github.com/99designs/gqlgen generate
schema:
  - schema.graphqls
exec:
  filename: generated/generated.go
  package: generated
model:
  filename: generated/models_gen.go
  package: generated
skip_mod_tidy: true
omit_getters: true
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
  CI:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/ci.Item
    # The fields under field permissions (RBA-07, WP-727): resolver.go
    # projects them with the policy of the request; an unreadable one is
    # null, an unreadable attribute key is left out.
    fields:
      hostname:
        resolver: true
      fqdn:
        resolver: true
      serialNumber:
        resolver: true
      manufacturer:
        resolver: true
      model:
        resolver: true
      managementIp:
        resolver: true
      attributes:
        resolver: true
  Relationship:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/relationship.Relationship
  TopologyGraph:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/topology.Graph
  TopologyNode:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/topology.Node
  TopologyEdge:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/topology.Edge
  Rack:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/rack.Rack
  RackMount:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/rack.RackMount
  SearchHit:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/search.Hit
  ReviewItem:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/reviews.Item
  Job:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/jobs.Job
    fields:
      status:
        resolver: true
  # The asset detail aggregate (GQL-03, WP-311). The fields under field
  # permissions (RBA-07) resolve in resolvers_assets.go with the asset
  # policy of the request.
  Asset:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/asset.Asset
    fields:
      inventoryNo:
        resolver: true
      category:
        resolver: true
      status:
        resolver: true
      manufacturer:
        resolver: true
      model:
        resolver: true
      serialNumber:
        resolver: true
      purchaseDate:
        resolver: true
      purchasePrice:
        resolver: true
      currency:
        resolver: true
      warrantyUntil:
        resolver: true
      costCenter:
        resolver: true
      supplierId:
        resolver: true
      contractId:
        resolver: true
      ownerUserId:
        resolver: true
      ownerTeamId:
        resolver: true
      invoiceNumber:
        resolver: true
      rfidTag:
        resolver: true
      barcode:
        resolver: true
      locationId:
        resolver: true
      lifecycleState:
        resolver: true
      primaryCiId:
        resolver: true
      notes:
        resolver: true
      customFields:
        resolver: true
      tags:
        resolver: true
  Movement:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/movement.Movement
  Document:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/document.Document
  # The CI aggregates (GQL-03, WP-792): the resolved form of WP-719, the
  # unified history of the CI with its relationship changes, its metric
  # series. The optional strings of a history entry and the JSON members of
  # the form resolve in resolvers_form.go and resolvers_history.go.
  CIForm:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/citype.ResolvedForm
    fields:
      templateId:
        resolver: true
      roleId:
        resolver: true
      layoutId:
        resolver: true
      requiredFields:
        resolver: true
  FormSection:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/citype.FormSection
    fields:
      title:
        resolver: true
  FormField:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/citype.FormField
    fields:
      definition:
        resolver: true
  FieldState:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/fieldmeta.FieldState
  FormRule:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/citype.FormRule
    fields:
      condition:
        resolver: true
      ast:
        resolver: true
      message:
        resolver: true
  HistoryEntry:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/history.Change
    fields:
      siteId:
        resolver: true
      actorId:
        resolver: true
      actorUserId:
        resolver: true
      changeKind:
        resolver: true
      changeSetId:
        resolver: true
      fieldName:
        resolver: true
      fieldChanges:
        resolver: true
      comment:
        resolver: true
      changeSource:
        resolver: true
      requestId:
        resolver: true
      correlationId:
        resolver: true
  HistoryFieldChange:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/history.FieldChange
  CISeries:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/monitoring.CISeries
  MetricPoint:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/monitoring.MetricPoint
