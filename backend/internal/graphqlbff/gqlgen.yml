# gqlgen configuration of the GraphQL BFF (GQL-01). Regenerate with
#   cd backend/internal/graphqlbff && go run github.com/99designs/gqlgen generate
schema:
  - schema.graphqls
exec:
  filename: generated/generated.go
  package: generated
model:
  filename: generated/models_gen.go
  package: generated
skip_mod_tidy: true
omit_getters: true
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
  CI:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/ci.Item
    # The fields under field permissions (RBA-07, WP-727): resolver.go
    # projects them with the policy of the request; an unreadable one is
    # null, an unreadable attribute key is left out.
    fields:
      hostname:
        resolver: true
      fqdn:
        resolver: true
      serialNumber:
        resolver: true
      manufacturer:
        resolver: true
      model:
        resolver: true
      managementIp:
        resolver: true
      attributes:
        resolver: true
  Relationship:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/relationship.Relationship
  TopologyGraph:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/topology.Graph
  TopologyNode:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/topology.Node
  TopologyEdge:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/topology.Edge
  Rack:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/rack.Rack
  RackMount:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/rack.RackMount
  SearchHit:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/search.Hit
  ReviewItem:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/reviews.Item
  Job:
    model: github.com/DataHub-Chiemgau/Reticora-CMDB/backend/internal/jobs.Job
    fields:
      status:
        resolver: true
