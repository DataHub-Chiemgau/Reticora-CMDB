# The secrets the operator provides for the server (deploy/README.md,
# section 3), with test-only values of the kind smoke. kind-smoke.sh removes
# or empties master-key for its negative cases and applies this file again to
# restore it.
apiVersion: v1
kind: Secret
metadata:
  name: reticora-secrets
type: Opaque
stringData:
  # 32 bytes, base64 ("kind-smoke-test-master-key-00000"): a valid key for
  # the start check, known to everybody, so never use it outside this test.
  master-key: a2luZC1zbW9rZS10ZXN0LW1hc3Rlci1rZXktMDAwMDA=
  oidc-client-secret: kind-smoke-oidc-client-secret
---
# Runtime login (TEN-03): NOSUPERUSER NOBYPASSRLS, member of reticora_app
# only; kind-smoke.sh setup creates it with these credentials after the
# migrations.
apiVersion: v1
kind: Secret
metadata:
  name: reticora-db-runtime
type: Opaque
stringData:
  database-url: postgres://reticora_runtime:kind-smoke-runtime@postgres:5432/reticora?sslmode=disable&application_name=reticora-server
