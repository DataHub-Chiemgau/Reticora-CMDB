# MinIO of the kind smoke, the image of the compose stack (pinned by release
# tag and digest). The staging overlay sets no RETICORA_S3_*, so the server
# runs without object storage. The case wal_archive (WP-444) uses it as the
# pgBackRest repository, which speaks S3 over TLS only: kind-smoke.sh setup
# creates the secret kind-smoke-minio-tls (certificate for minio and
# localhost of the test CA, generated per run) and the bucket
# reticora-backup with versioning.
apiVersion: v1
kind: Secret
metadata:
  name: kind-smoke-minio
type: Opaque
stringData:
  root-user: kind-smoke
  root-password: kind-smoke-minio-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          args: ["server", "/data", "--certs-dir", "/certs"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: kind-smoke-minio
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kind-smoke-minio
                  key: root-password
          ports:
            - containerPort: 9000
              name: s3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
              scheme: HTTPS
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: tls
          secret:
            secretName: kind-smoke-minio-tls
            items:
              - key: tls.crt
                path: public.crt
              - key: tls.key
                path: private.key
              - key: ca.crt
                path: CAs/ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
