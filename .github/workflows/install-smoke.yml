name: Install Smoke Test

# Validates that the installer scripts bring the full stack up in a fresh
# environment and that every container becomes healthy. This prevents
# regressions like the ones fixed in PR #11–#29 (install failures, unhealthy
# containers, broken Keycloak realm import, TLS issues).

on:
  push:
    branches: [main]
    # Release tags run the full matrix regardless of the changed paths
    # (GitHub does not apply path filters to tag pushes).
    tags: ['v*']
    paths:
      - 'install*.sh'
      - 'deploy/docker-compose/**'
      - 'deploy/keycloak/**'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'tests/install-*.sh'
      - 'tests/backup-*.sh'
      - 'tests/nats-mtls.test.sh'
      - 'frontend/e2e/onboarding.spec.ts'
      - 'frontend/e2e/fixtures/**'
      - '.github/workflows/install-smoke.yml'
      # WP-338: the real-stack suite runs against the installation, so every
      # change it can observe starts the workflow.
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/e2e-real/**'
      - 'frontend/e2e/support/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'deploy/**'
      - 'collector/**'
      - 'edgecore/**'
      - 'tests/audit/**'
  pull_request:
    branches: [main]
    paths:
      - 'install*.sh'
      - 'deploy/docker-compose/**'
      - 'deploy/keycloak/**'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'tests/install-*.sh'
      - 'tests/backup-*.sh'
      - 'tests/nats-mtls.test.sh'
      - 'frontend/e2e/onboarding.spec.ts'
      - 'frontend/e2e/fixtures/**'
      - '.github/workflows/install-smoke.yml'
      # WP-338: the real-stack suite runs against the installation, so every
      # change it can observe starts the workflow.
      - 'backend/**'
      - 'frontend/src/**'
      - 'frontend/e2e-real/**'
      - 'frontend/e2e/support/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'deploy/**'
      - 'collector/**'
      - 'edgecore/**'
      - 'tests/audit/**'
  # Manual runs (e.g. the G1 evidence for GATE-03) are not path filtered.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests of the installer helpers and the health check, no Docker needed.
  installer-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install-cloud.sh helpers
        run: ./tests/install-cloud-helpers.test.sh

      # INS-02 (WP-385, F-035): strict issuer checks only after the server
      # and the frontend (/realms/ proxy of a domain issuer) are up.
      - name: install-cloud.sh issuer checks after the frontend start
        run: ./tests/install-cloud-issuer-order.test.sh

      - name: install-smoke-health.sh
        run: ./tests/install-smoke-health.test.sh

      - name: install-preflight.sh (platform, Docker, Compose, sizing)
        run: ./tests/install-preflight.test.sh

      - name: Backup chain configuration (pgBackRest, retention, versioning)
        run: ./tests/backup-config.test.sh

      - name: Collector NATS endpoint accepts only collector certificates (COL-08)
        run: ./tests/nats-mtls.test.sh

  # INS-01/TEC-09/GATE-03 (WP-092): the cloud installer on every platform of
  # CH22. Ubuntu runs natively on the GitHub runners; Debian 12 runs the
  # installer in a debian:12 container that drives the runner's Docker daemon
  # (E-27). The workspace is mounted at the same path so the compose bind
  # mounts resolve identically on the host.
  install-cloud-smoke:
    needs: installer-script-tests
    runs-on: ${{ matrix.runner }}
    # The real-stack suite (ubuntu-24.04) takes about 20 minutes: D08 of
    # discovery-override.spec.ts watches a disabled, still running collector
    # over two discovery cycles of 5 minutes (WP-381).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
          - platform: debian-12
            runner: ubuntu-24.04
            container: debian:12
    steps:
      - uses: actions/checkout@v4

      - name: Make installer scripts executable
        run: chmod +x install.sh install-cloud.sh install-vm.sh tests/*.sh

      - name: Run the cloud installer non-interactively (${{ matrix.platform }})
        if: matrix.container == ''
        run: ./install.sh --cloud --non-interactive
        env:
          RETICORA_SOURCE_DIR: ${{ github.workspace }}

      - name: Run the cloud installer non-interactively (${{ matrix.platform }} container)
        if: matrix.container != ''
        run: |
          set -euo pipefail
          plugins=()
          for dir in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins; do
            [ -d "$dir" ] && plugins+=(-v "$dir:$dir:ro")
          done
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(command -v docker):/usr/local/bin/docker:ro" \
            "${plugins[@]}" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e RETICORA_SOURCE_DIR="$GITHUB_WORKSPACE" \
            "${{ matrix.container }}" \
            bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates git jq openssl >/dev/null && ./install.sh --cloud --non-interactive'
          # The installer ran as root in the container; hand the generated
          # .env back to the runner user for the checks below. The session key
          # keeps the ownership the installer chose for the server container.
          sudo chown "$(id -u):$(id -g)" deploy/docker-compose/.env

      # Strict: compose/JSON errors, missing or exited containers and every
      # health state other than "healthy" fail the job. WP-348 (TEN-03): the
      # script also asserts via psql (pg_stat_activity, application_name
      # reticora-server) that the server logs in only as reticora_runtime with
      # rolsuper = false and rolbypassrls = false.
      - name: Verify all expected services are running and healthy, server without superuser login
        run: |
          sleep 5
          ./tests/install-smoke-health.sh deploy/docker-compose .env

      # WP-100 (OPS-04): WAL archiving works and a base backup exists.
      - name: Verify the backup chain
        run: |
          cd deploy/docker-compose
          docker compose --env-file .env exec -T backup reticora-pgbackrest-env.sh pgbackrest --stanza=reticora check
          docker compose --env-file .env exec -T backup reticora-pgbackrest-env.sh reticora-backup.sh health

      - name: Verify backend health endpoint
        run: |
          port=$(grep -E '^RETICORA_SERVER_PORT=' deploy/docker-compose/.env | cut -d= -f2)
          port="${port:-8080}"
          curl -fsS "http://localhost:${port}/healthz" || {
            echo "Backend health check failed"
            cd deploy/docker-compose && docker compose --env-file .env logs --tail 50 server
            exit 1
          }

      - name: Verify frontend serves the SPA
        run: |
          port=$(grep -E '^RETICORA_FRONTEND_PORT=' deploy/docker-compose/.env | cut -d= -f2)
          port="${port:-3000}"
          curl -fsS "http://localhost:${port}/" | grep -qi 'reticora\|<div id="root"' || {
            echo "Frontend did not serve the SPA"
            exit 1
          }

      - name: Verify Keycloak is reachable
        run: |
          port=$(grep -E '^RETICORA_KEYCLOAK_PORT=' deploy/docker-compose/.env | cut -d= -f2)
          port="${port:-8180}"
          curl -fsS "http://localhost:${port}/realms/reticora/.well-known/openid-configuration" | \
            grep -q '"issuer"' || {
            echo "Keycloak realm not reachable"
            exit 1
          }

      # WP-200 (INS-04, TST-03, ABN-01 d): the onboarding suite against the
      # installation just made: self-signup with verification e-mail, login,
      # dashboard, collector enrollment with the simulated fleet, review,
      # impact, export, and the install error images. One native platform
      # suffices; the installation itself is covered by every platform.
      - uses: actions/setup-go@v5
        if: matrix.platform == 'ubuntu-24.04'
        with:
          go-version: "1.26.9"
          cache-dependency-path: collector/go.sum

      - uses: actions/setup-node@v4
        if: matrix.platform == 'ubuntu-24.04'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare the onboarding suite (signup configuration, mail catcher, collector)
        if: matrix.platform == 'ubuntu-24.04'
        run: ./frontend/e2e/fixtures/setup-onboarding.sh deploy/docker-compose .env

      - name: Run the onboarding E2E suite
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c e2e/fixtures/playwright.install.config.ts

      # WP-338 (TST-03, TST-04): the real-stack suite frontend/e2e-real/ against
      # the same installation, compared with the e2e-real lines of
      # tests/audit/expected-failures.txt: a listed test that turned green, an
      # unlisted red test, a skipped or missing test fail the job.
      - name: Prepare the real-stack suite (X-Real-IP passthrough, database, Keycloak admin)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          ./frontend/e2e-real/fixtures/setup-real-stack.sh deploy/docker-compose .env

      - name: Run the real-stack E2E suite against the expected-failure list
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-real.json
        run: |
          npx playwright test -c e2e-real/playwright.real.config.ts --reporter=list,json || true
          ../tests/audit/run-auditdefect.sh playwright --report "$RUNNER_TEMP/e2e-real.json" --results "$RUNNER_TEMP/e2e-real-results.txt"
          ../tests/audit/run-auditdefect.sh compare --kinds e2e-real --results "$RUNNER_TEMP/e2e-real-results.txt"

      - name: Upload the real-stack report
        if: always() && matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-real
          path: |
            frontend/test-results/
            ${{ runner.temp }}/e2e-real.json
            ${{ runner.temp }}/e2e-real-results.txt
          retention-days: 14

      - name: Upload the onboarding report
        if: failure() && matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-e2e
          path: frontend/test-results/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        run: |
          cd deploy/docker-compose
          echo "=== docker compose ps ==="
          docker compose --env-file .env ps || true
          echo "=== server logs ==="
          docker compose --env-file .env logs --tail 80 server || true
          echo "=== keycloak logs ==="
          docker compose --env-file .env logs --tail 80 keycloak || true
          echo "=== frontend logs ==="
          docker compose --env-file .env logs --tail 80 frontend || true
          echo "=== mailpit logs ==="
          docker ps -aq --filter name=mailpit | xargs -r docker logs --tail 40 || true

      - name: Cleanup
        if: always()
        run: |
          cd deploy/docker-compose
          docker compose --env-file .env down -v --remove-orphans || true

  # INS-05 (WP-386, F-125): a re-run of the installer applies rotated
  # passwords and Keycloak values to the existing installation (persisted
  # volumes) and keeps settings it does not write itself; a run without a
  # change rotates nothing.
  reinstall:
    needs: installer-script-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RETICORA_SOURCE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Make installer scripts executable
        run: chmod +x install.sh install-cloud.sh install-vm.sh tests/*.sh

      # Keycloak 24 on its own: admin password, client secret and redirect URL
      # rotated between the installer's Keycloak steps.
      - name: Keycloak rotation of the installer (Keycloak 24)
        run: ./tests/install-reinstall.test.sh

      - name: First installation
        run: ./install.sh --cloud --non-interactive

      - name: Rotate the database passwords and Keycloak values, add RETICORA_HTTP_BIND
        run: |
          set -euo pipefail
          env_file=deploy/docker-compose/.env
          cp "$env_file" "$RUNNER_TEMP/env.first"
          set_env() {
            sed -i "s|^$1=.*|$1=$2|" "$env_file"
            grep -qx "$1=$2" "$env_file"
          }
          set_env RETICORA_DB_PASSWORD "$(openssl rand -hex 16)"
          set_env RETICORA_DB_APP_PASSWORD "$(openssl rand -hex 24)"
          set_env KEYCLOAK_DB_PASSWORD "$(openssl rand -hex 16)"
          set_env KEYCLOAK_ADMIN_PASSWORD "$(openssl rand -hex 16)"
          set_env RETICORA_OIDC_CLIENT_SECRET "$(openssl rand -hex 24)"
          set_env RETICORA_OIDC_REDIRECT_URL "http://127.0.0.1:3000/auth/callback"
          printf 'RETICORA_HTTP_BIND=127.0.0.1\n' >> "$env_file"

      - name: Second run applies the rotation
        run: |
          set -o pipefail
          ./install.sh --cloud --non-interactive 2>&1 | tee "$RUNNER_TEMP/second-run.log"
          grep -q 'Keycloak rotation: password of the administrator' "$RUNNER_TEMP/second-run.log"
          grep -q 'Keycloak rotation: client reticora-app secret set' "$RUNNER_TEMP/second-run.log"
          grep -q 'Keycloak rotation: client reticora-app redirectUris set' "$RUNNER_TEMP/second-run.log"

      - name: Verify the stack after the rotation (health, OIDC login, /readyz, RETICORA_HTTP_BIND)
        run: |
          set -euo pipefail
          ./tests/install-smoke-health.sh deploy/docker-compose .env
          env_file=deploy/docker-compose/.env
          value() { sed -n "s/^$1=//p" "$2" | tail -n 1; }
          kc="http://localhost:$(value RETICORA_KEYCLOAK_PORT "$env_file")"
          admin="$(value KEYCLOAK_ADMIN "$env_file")"
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          admin_token() {
            curl -fsS "$kc/realms/master/protocol/openid-connect/token" -d grant_type=password -d client_id=admin-cli \
              --data-urlencode "username=$admin" --data-urlencode "password=$1" | jq -r .access_token
          }
          # The rotated admin password works, the old one no longer.
          token="$(admin_token "$(value KEYCLOAK_ADMIN_PASSWORD "$env_file")")"
          [ "$(status "$kc/realms/master/protocol/openid-connect/token" -d grant_type=password -d client_id=admin-cli \
            --data-urlencode "username=$admin" --data-urlencode "password=$(value KEYCLOAK_ADMIN_PASSWORD "$RUNNER_TEMP/env.first")")" = 401 ]
          api() { curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$@"; }
          client="$(api "$kc/admin/realms/reticora/clients?clientId=reticora-app" | jq '.[0]')"
          jq -e '.redirectUris | index("http://127.0.0.1:3000/auth/callback")' <<<"$client" >/dev/null
          # OIDC login over the token endpoint with a smoke user: the rotated
          # client secret 200, the old one 401.
          api -X POST "$kc/admin/realms/reticora/users" -d '{"username":"reinstall-smoke@reticora.test",
            "email":"reinstall-smoke@reticora.test","emailVerified":true,"enabled":true,"firstName":"Reinstall","lastName":"Smoke"}'
          user="$(api "$kc/admin/realms/reticora/users?username=reinstall-smoke@reticora.test&exact=true" | jq -r '.[0].id')"
          password="Rs-$(openssl rand -hex 16)"
          api -X PUT "$kc/admin/realms/reticora/users/$user/reset-password" \
            -d "$(jq -n --arg p "$password" '{type: "password", value: $p, temporary: false}')"
          login() {
            status "$kc/realms/reticora/protocol/openid-connect/token" -d grant_type=password -d client_id=reticora-app \
              --data-urlencode "client_secret=$1" --data-urlencode "username=reinstall-smoke@reticora.test" \
              --data-urlencode "password=$password"
          }
          [ "$(login "$(value RETICORA_OIDC_CLIENT_SECRET "$env_file")")" = 200 ]
          [ "$(login "$(value RETICORA_OIDC_CLIENT_SECRET "$RUNNER_TEMP/env.first")")" = 401 ]
          # The server is ready with the rotated runtime login.
          [ "$(status "http://localhost:$(value RETICORA_SERVER_PORT "$env_file")/readyz")" = 200 ]
          # Both database roles and Keycloak's database accept the new passwords over TCP.
          cd deploy/docker-compose
          docker compose --env-file .env exec -T -e PGPASSWORD="$(value RETICORA_DB_PASSWORD .env)" postgres \
            psql -h postgres -U reticora -d reticora -tAc 'SELECT 1' | grep -qx 1
          docker compose --env-file .env exec -T -e PGPASSWORD="$(value RETICORA_DB_APP_PASSWORD .env)" postgres \
            psql -h postgres -U reticora_runtime -d reticora -tAc 'SELECT 1' | grep -qx 1
          docker compose --env-file .env exec -T -e PGPASSWORD="$(value KEYCLOAK_DB_PASSWORD .env)" keycloak-db \
            psql -h keycloak-db -U keycloak -d keycloak -tAc 'SELECT 1' | grep -qx 1
          # RETICORA_HTTP_BIND is kept and in effect; .env.previous is private.
          grep -qx 'RETICORA_HTTP_BIND=127.0.0.1' .env
          docker compose --env-file .env port frontend 80 | grep -qx '127.0.0.1:3000'
          [ "$(stat -c %a .env.previous)" = 600 ]

      - name: Third run without a change rotates nothing
        run: |
          set -o pipefail
          ./install.sh --cloud --non-interactive 2>&1 | tee "$RUNNER_TEMP/third-run.log"
          if grep -E 'Keycloak rotation:|Changed since the last run|Updating the password of database role' "$RUNNER_TEMP/third-run.log"; then
            echo "FAIL: the third run rotated something"
            exit 1
          fi
          ./tests/install-smoke-health.sh deploy/docker-compose .env

      - name: Show logs on failure
        if: failure()
        run: |
          cd deploy/docker-compose
          docker compose --env-file .env ps || true
          docker compose --env-file .env logs --tail 80 server keycloak || true

      - name: Cleanup
        if: always()
        run: |
          cd deploy/docker-compose
          docker compose --env-file .env down -v --remove-orphans || true
