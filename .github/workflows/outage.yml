# Outage and backpressure suite (WP-104, WP-449, OPS-06): installs the
# Compose stack with Mailpit as its central SMTP server and simulates the
# outage of PostgreSQL, NATS, Redis, object storage and SMTP, each under
# load (tests/outage/load.sh: every answer accepted or visibly refused, then
# accepted == persisted counted in the database, ingest queue empty, event
# outbox published), the collector scenario (WP-587: an enrolled collector
# container with the simulated fleet while server and nats-edge are down;
# spool, backpressure, every record ingested, loss counter 0), the
# component scenarios (collector with the server unreachable, spool limits,
# webhook target down) and the negative self-tests (one record dropped on
# purpose, a collector spool of one record: both must fail). Runs nightly, before
# every release (called by release.yml), on changes to the suite and by
# hand (workflow_dispatch).
name: Outage Suite

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "tests/outage/**"
      - ".github/workflows/outage.yml"

permissions:
  contents: read

jobs:
  outage:
    runs-on: ubuntu-24.04
    # The collector scenario waits for a discovery pass of the collector
    # (every 5 min) in the suite and in its self-test.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      # SMTP scenario (WP-449, F-135): Mailpit and RETICORA_SMTP_HOST go
      # into the override that the installer merges for its source build,
      # so the installation already waits for /readyz with the smtp check.
      - name: Mailpit as the central SMTP server (before the installation)
        run: |
          python3 -c 'import yaml' || (sudo apt-get update && sudo apt-get install -y python3-yaml)
          ./tests/outage/smtp.sh overlay deploy/docker-compose/docker-compose.override.yml

      # The checked-out state is not published yet (nightly on main, before
      # release.yml publishes a tag): local build, not signature-verified
      # (E-69; the default path runs in install-smoke.yml, job release-mode).
      - name: Install the stack
        run: ./install.sh --cloud --non-interactive --build-from-source
        env:
          RETICORA_SOURCE_DIR: ${{ github.workspace }}

      # The organization and API key of the load (cmd/seed, as load.yml).
      - name: Build the seed of the load
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/seed" ./cmd/seed

      # The collector container of the collector scenario (WP-587), the
      # image release.yml publishes.
      - name: Build the collector image
        run: docker build -t reticora-collector:outage -f collector/Dockerfile .

      - name: Run the outage scenarios
        run: ./tests/outage/run.sh
        env:
          OUTAGE_REPORT: ${{ github.workspace }}/outage-report.md
          OUTAGE_SEED_BIN: ${{ runner.temp }}/seed
          COLLECTOR_IMAGE: reticora-collector:outage

      # F-136: the accounting must catch a lost record. The self-test drops
      # the last ingest record of the load on purpose; the run has to fail
      # with exactly that record lost and nothing else.
      - name: Negative self-test (one ingest record dropped on purpose)
        if: ${{ !cancelled() }}
        run: |
          set +e
          ./tests/outage/run.sh minio
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::the self-test passed although a record was dropped"
            exit 1
          fi
          grep -qE '^\| minio outage \| FAIL \| ingest: accepted [0-9]+ != persisted [0-9]+ \(lost 1: OUTAGE-[0-9]+-minio-I50, late 0\) \|$' outage-selftest-report.md || {
            echo "::error::the self-test did not fail with exactly the dropped record lost"
            exit 1
          }
        env:
          OUTAGE_SELFTEST_DROP: "1"
          OUTAGE_REPORT: ${{ github.workspace }}/outage-selftest-report.md
          OUTAGE_SEED_BIN: ${{ runner.temp }}/seed

      # WP-587: the collector's spool takes one record, so a pass of 30 does
      # not fit and is lost. The scenario has to fail with the records lost
      # and the loss counter above 0, reported by the collector's heartbeats
      # and logged by the collector.
      - name: Negative self-test of the collector scenario (spool limit of one record)
        if: ${{ !cancelled() }}
        run: |
          set +e
          ./tests/outage/run.sh collector
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::the collector self-test passed although its spool takes one record"
            exit 1
          fi
          grep -qE '^\| collector outage \| FAIL \| records: sent [0-9]+ in [0-9]+ passes != ingested [0-9]+ \(lost [1-9][0-9]*\); loss counter: [1-9][0-9]* reported by the heartbeats, [1-9][0-9]* logged by the collector' outage-collector-selftest-report.md || {
            echo "::error::the collector self-test did not fail with the records lost and the loss counter above 0"
            exit 1
          }
        env:
          COLLECTOR_SPOOL_RECORDS: "1"
          COLLECTOR_IMAGE: reticora-collector:outage
          OUTAGE_REPORT: ${{ github.workspace }}/outage-collector-selftest-report.md
          OUTAGE_SEED_BIN: ${{ runner.temp }}/seed

      - name: Publish the protocol
        if: always()
        run: |
          for f in outage-report.md outage-selftest-report.md outage-collector-selftest-report.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Upload the protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outage-report
          path: |
            outage-report.md
            outage-selftest-report.md
            outage-collector-selftest-report.md
          retention-days: 90

      - name: Show logs on failure
        if: failure()
        run: |
          cd deploy/docker-compose
          docker compose --env-file .env ps || true
          docker compose --env-file .env logs --tail 100 server || true
          docker compose --env-file .env logs --tail 40 mailpit || true
          docker compose --env-file .env logs --tail 40 nats-edge || true

      - name: Cleanup
        if: always()
        run: |
          cd deploy/docker-compose
          docker compose --env-file .env down -v --remove-orphans || true
