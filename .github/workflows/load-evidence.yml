# WP-612 (E-58, NFR-10): evaluates the load-test evidence of three
# load.yml runs by the median rule of E-58 (supplement of 2026-10-26). The
# job downloads the archives load-archive-<run id> that the job archive of
# load.yml uploads, runs tests/load/evaluate-runs.sh on them and writes its
# report to the job log, the job summary and the artifact
# load-evidence-<run id of this run>. It exits like the script: 0 when the
# three runs are evaluable, every threshold of every job is held in the
# median and no job is red in two runs, 1 when not, 2 on a run ID that is no
# number or given twice. Evaluable are only three runs of the same server
# commit ("Server, Seed und Migrationen") with each job of the gate in every
# run (WP-206, F-417); the evidence never uses the partial mode of the
# script. The input gate selects the jobs (--gate of the script, WP-327):
# G2 (default, the evidence of gate G2) the five jobs of G1 as regression
# (api, ingest, ingest-spool, ingest-rediscover, nfr01-volume) and the jobs
# of phase 2, phase2 (WP-822) and the write jobs import, template and
# computed (WP-823); in the write jobs the thresholds of the ingest beside
# them (<job>-ingest.json, NFR-03) are evaluated by the same rule. G1 the
# five jobs of G1 alone: it re-evaluates the archives of the G1 evidence
# (runs before WP-822), whose last line names the job set G1. Further jobs
# of the runs (api-large-*) are evaluated as well. The gate also selects
# the p95 budgets of api.js and phase2.js (tests/load/budgets.json, E-146):
# G2 the provisional budgets of the decision of 2026-11-09 (revised the
# same day against run variance, run 42661932847), G1 those of
# NFR-02. A run without an archive (expired, never archived) fails the
# download step.
name: Load evidence

on:
  workflow_dispatch:
    inputs:
      run_1:
        description: "Run ID of the first load.yml run"
        required: true
      run_2:
        description: "Run ID of the second load.yml run"
        required: true
      run_3:
        description: "Run ID of the third load.yml run"
        required: true
      gate:
        description: "Job set and p95 budgets of the evidence: G2 (the nine jobs of G2, budgets of E-146) or G1 (the five jobs of G1, archives before WP-822, budgets of NFR-02)"
        type: choice
        options:
          - G2
          - G1
        default: G2

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    name: Evaluate three runs (E-58)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The inputs reach the shell only as environment variables, and only
      # numbers reach the download steps.
      - name: Check the run IDs
        env:
          RUN_1: ${{ inputs.run_1 }}
          RUN_2: ${{ inputs.run_2 }}
          RUN_3: ${{ inputs.run_3 }}
        run: |
          for id in "$RUN_1" "$RUN_2" "$RUN_3"; do
            case "$id" in
              '' | *[!0-9]*)
                echo "::error::run ID '$id' is not a number"
                exit 2
                ;;
            esac
          done
          if [ "$RUN_1" = "$RUN_2" ] || [ "$RUN_1" = "$RUN_3" ] || [ "$RUN_2" = "$RUN_3" ]; then
            echo "::error::the three run IDs must differ"
            exit 2
          fi

      # Each archive holds the directory <run id>/ (tests/load/archive-run.sh),
      # so the three land side by side in archives/.
      - uses: actions/download-artifact@v4
        with:
          name: load-archive-${{ inputs.run_1 }}
          run-id: ${{ inputs.run_1 }}
          github-token: ${{ github.token }}
          path: archives

      - uses: actions/download-artifact@v4
        with:
          name: load-archive-${{ inputs.run_2 }}
          run-id: ${{ inputs.run_2 }}
          github-token: ${{ github.token }}
          path: archives

      - uses: actions/download-artifact@v4
        with:
          name: load-archive-${{ inputs.run_3 }}
          run-id: ${{ inputs.run_3 }}
          github-token: ${{ github.token }}
          path: archives

      - name: Evaluate by the median rule of E-58
        env:
          RUN_1: ${{ inputs.run_1 }}
          RUN_2: ${{ inputs.run_2 }}
          RUN_3: ${{ inputs.run_3 }}
          GATE: ${{ inputs.gate || 'G2' }}
        run: |
          mkdir -p evidence
          rc=0
          tests/load/evaluate-runs.sh --gate "$GATE" "archives/$RUN_1" "archives/$RUN_2" "archives/$RUN_3" > evidence/bewertung.md || rc=$?
          cat evidence/bewertung.md
          cat evidence/bewertung.md >> "$GITHUB_STEP_SUMMARY"
          echo "evaluate-runs.sh exit code: $rc"
          exit "$rc"

      # The report is kept also when the evaluation fails: a missed budget is
      # a result.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: ignore
