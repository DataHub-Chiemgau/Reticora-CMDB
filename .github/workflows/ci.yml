name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  # The collector and edgecore go.work modules are tested in their own jobs.
  go-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [collector, edgecore]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # TimescaleDB is required by migration 000020 (metric_sample hypertable);
        # matches the docker-compose database image.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: reticora
          POSTGRES_PASSWORD: reticora
          POSTGRES_DB: reticora_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reticora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: reticora
      DATABASE_URL: postgres://reticora:reticora@localhost:5432/reticora_migrations?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install golang-migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Apply all migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Revert all migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" down -all

      - name: Re-apply all migrations
        run: migrate -path backend/migrations -database "$DATABASE_URL" up

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # Every PostgreSQL test activates itself through TEST_DATABASE_URL, so the
      # whole module runs without a name filter. -p 1 runs packages one after
      # another: they share this database and some fixtures are not isolated.
      # This includes the migration roundtrip with schema comparison and the
      # docs/schema-baseline.md check (internal/database, DB-02).
      - name: PostgreSQL integration tests (all packages)
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: gotestsum --format testname --jsonfile test-db.json -- -count=1 -p 1 ./...

      - name: Summarize PostgreSQL test run
        if: always()
        working-directory: backend
        run: |
          set -euo pipefail
          test -s test-db.json || { echo "::error::no test output recorded"; exit 1; }
          pkgs=$(go list $(grep -rl --include='*_test.go' 'TEST_DATABASE_URL' . | xargs -n1 dirname | sort -u) | jq -R . | jq -sc .)
          jq -r --argjson pkgs "$pkgs" '
            select(.Test != null and (.Test | contains("/") | not))
            | select(.Action == "pass" or .Action == "fail" or .Action == "skip")
            | select(.Package as $p | $pkgs | index($p))
            | "\(.Action)\t\(.Package | sub(".*/backend/"; ""))\t\(.Test)"' test-db.json | sort -k2 > db-tests.txt
          cat db-tests.txt
          echo "Tests in $(echo "$pkgs" | jq length) PostgreSQL-backed packages: passed=$(grep -c '^pass' db-tests.txt || true) failed=$(grep -c '^fail' db-tests.txt || true) skipped=$(grep -c '^skip' db-tests.txt || true)"
          if grep -q 'TEST_DATABASE_URL not set' test-db.json; then
            echo "::error::PostgreSQL integration tests were skipped although TEST_DATABASE_URL is set"
            exit 1
          fi

      - name: Assert every tenant policy uses app.org_id
        run: |
          drifted=$(psql "$DATABASE_URL" -tAc "SELECT string_agg(tablename || '.' || policyname, ', ') FROM pg_policies WHERE schemaname = 'public' AND (qual LIKE '%app.organization_id%' OR qual LIKE '%app.current_org%')")
          if [ -n "$drifted" ]; then
            echo "RLS policies still reference a legacy session variable: $drifted"
            exit 1
          fi

      - name: Assert RLS is forced on every tenant table
        run: |
          unforced=$(psql "$DATABASE_URL" -tAc "SELECT string_agg(c.relname, ', ') FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relrowsecurity AND NOT c.relforcerowsecurity")
          if [ -n "$unforced" ]; then
            echo "Tables with RLS enabled but not forced: $unforced"
            exit 1
          fi

      # SIM-01 (WP-106): make seed must succeed against the migrated database.
      # It runs after the tests so the seeded tenant cannot affect them.
      - name: Seed the database (make seed)
        run: make seed

  # GLO-11/DOD-01: docs/traceability.csv is checked on every PR (E-30).
  # Format, known IDs, existing test files and the rows the plan prescribes for
  # the PR's work packages block; completeness is reported until gate G1.
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Work packages are taken from the PR title and the "Arbeitspakete:" line
      # of the PR template. Untrusted text is only read through env variables.
      - name: Determine work packages of the pull request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          wps=$( { printf '%s\n' "$PR_TITLE"; printf '%s\n' "$PR_BODY" | grep -iE '^[*_ ]*Arbeitspakete?[*_ ]*:' || true; } \
            | grep -oE 'WP-[0-9]{3}' | sort -u | tr '\n' ' ' || true)
          echo "Work packages: ${wps:-none}"
          echo "TRACEABILITY_WPS=${wps}" >> "$GITHUB_ENV"

      - name: Check docs/traceability.csv
        working-directory: backend
        run: go test -count=1 -v -run 'TestTraceabilityFile' ./internal/traceability/

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All go.work modules share the backend configuration.
        module: [backend, collector, edgecore]
    env:
      # Must match GOLANGCI_LINT_VERSION in the Makefile (checked below).
      GOLANGCI_LINT_VERSION: v2.14.0
    steps:
      - uses: actions/checkout@v4
        with:
          # backend/.golangci.yml sets issues.new-from-rev, which needs the
          # baseline commit in the local history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Check golangci-lint pin matches the Makefile
        run: grep -qx "GOLANGCI_LINT_VERSION := ${GOLANGCI_LINT_VERSION}" Makefile

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/backend/.golangci.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Steps run in sequence; any failing step fails the job.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # The typed client is generated from api/openapi.yaml, so a specification
      # change that was not regenerated must fail the build rather than silently
      # leave the frontend types behind.
      - name: Generated API client is up to date
        run: npm run generate:api:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: |
          npx serve -s dist -l 4173 &
          npx wait-on http://localhost:4173 --timeout 10000
          npx playwright test --project=chromium
        env:
          BASE_URL: http://localhost:4173

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # SEC-11/TST-04 (WP-004): dependency and container scans on every PR.
  # Critical and High findings block; accepted findings need an entry with an
  # expiry within the CVE fix SLA in security/scan-exceptions.txt (see
  # docs/security/abhaengigkeitsscans.md). Reports are uploaded as artifacts.
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, collector, edgecore]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # JSON mode always exits 0; the next step decides. Only findings whose
      # vulnerable symbol is reachable from the module's code count
      # (trace[0].function set); imported-but-unused code is reported only.
      - name: Scan Go dependencies and standard library
        working-directory: ${{ matrix.module }}
        run: govulncheck -format json ./... > "$GITHUB_WORKSPACE/govulncheck-${{ matrix.module }}.json"

      - name: Evaluate findings
        env:
          REPORT: govulncheck-${{ matrix.module }}.json
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          active=$(awk -v today="$today" '!/^#/ && NF { until = ""; for (i = 2; i <= NF; i++) if ($i ~ /^exp:/) until = substr($i, 5); if (until >= today) print $1 }' security/scan-exceptions.txt)
          jq -r 'select(.finding != null) | "\(.finding.osv) \(if .finding.trace[0].function then "reachable" else "imported" end)"' "$REPORT" | sort -u | tee govulncheck-findings.txt
          blocking=$(awk '$2 == "reachable" { print $1 }' govulncheck-findings.txt | sort -u | grep -vxF -f <(printf '%s\n' "$active") || true)
          if [ -n "$blocking" ]; then
            echo "::error::reachable Go vulnerabilities without valid exception: $(tr '\n' ' ' <<<"$blocking")"
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-${{ matrix.module }}
          path: govulncheck-${{ matrix.module }}.json
          retention-days: 30

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Threshold: High and Critical advisories of production dependencies
      # (the shipped bundle) block. Development tooling is reported only.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev --json > "$GITHUB_WORKSPACE/npm-audit-prod.json" || true
          npm audit --json > "$GITHUB_WORKSPACE/npm-audit-all.json" || true

      - name: Evaluate findings
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          active=$(awk -v today="$today" '!/^#/ && NF { until = ""; for (i = 2; i <= NF; i++) if ($i ~ /^exp:/) until = substr($i, 5); if (until >= today) print $1 }' security/scan-exceptions.txt)
          jq -e '.vulnerabilities' npm-audit-prod.json > /dev/null || { echo "::error::npm audit produced no report"; cat npm-audit-prod.json; exit 1; }
          jq -r '.metadata.vulnerabilities | "production: critical=\(.critical) high=\(.high) moderate=\(.moderate) low=\(.low)"' npm-audit-prod.json
          jq -r '.metadata.vulnerabilities | "all incl. dev: critical=\(.critical) high=\(.high) moderate=\(.moderate) low=\(.low)"' npm-audit-all.json
          blocking=$(jq -r '.vulnerabilities[] | select(.severity == "high" or .severity == "critical") | .via[] | objects | select(.severity == "high" or .severity == "critical") | .url | sub(".*/"; "")' npm-audit-prod.json \
            | sort -u | grep -vxF -f <(printf '%s\n' "$active") || true)
          if [ -n "$blocking" ]; then
            echo "::error::High/Critical npm advisories in production dependencies without valid exception: $(tr '\n' ' ' <<<"$blocking")"
            exit 1
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit-*.json
          retention-days: 30

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: collector
            context: .
            dockerfile: collector/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "reticora-${{ matrix.image }}:scan" -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"

      # Trivy (E-31): OS packages and application dependencies of the built
      # image. Critical/High findings with an available fix block; the
      # exceptions file uses the .trivyignore format with exp: dates.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: reticora-${{ matrix.image }}:scan
          format: json
          output: trivy-${{ matrix.image }}.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: security/scan-exceptions.txt
          exit-code: "1"

      - name: Summarize findings
        if: always()
        run: |
          if [ -s "trivy-${{ matrix.image }}.json" ]; then
            jq -r '[.Results[]?.Vulnerabilities[]? | "\(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"] | unique | .[]' "trivy-${{ matrix.image }}.json"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.json
          retention-days: 30

  # NFR-09/PRI-11 (WP-105): the Terraform module only accepts EU regions for
  # all data locations (primary, backups, logs, search index).
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format, init and validate
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: EU regions are accepted
        run: terraform plan -input=false -var region=eu-central-1 -var backup_region=europe-west3 -var log_region=westeurope -var search_region=fsn1

      - name: Non-EU regions are rejected
        run: |
          set -u
          for var in region=us-east-1 region=eu-west-2 region=eu-central-2 region=europe-west6 \
                     backup_region=us-west-2 log_region=eastus search_region=switzerlandnorth; do
            if terraform plan -input=false -var "$var" > /dev/null 2>&1; then
              echo "::error::terraform accepted the non-EU setting $var"
              exit 1
            fi
            echo "rejected: $var"
          done

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1

      - name: Validate base and overlays build
        # kustomize build parses every manifest and resolves patches/components,
        # catching structural and reference errors without needing a cluster.
        run: |
          set -e
          for overlay in deploy/k8s/base deploy/k8s/overlays/staging deploy/k8s/overlays/prod; do
            echo "== kustomize build $overlay"
            kustomize build "$overlay" > /dev/null
          done

      # OPS-03 (WP-099): every build injects the mandatory master key from the
      # reticora-secrets secret into the server container.
      - name: Assert master key secret reference
        run: |
          set -euo pipefail
          for overlay in deploy/k8s/base deploy/k8s/overlays/staging deploy/k8s/overlays/prod; do
            ref=$(kustomize build "$overlay" | grep -A6 -- '- name: RETICORA_MASTER_KEY' || true)
            if ! grep -q 'name: reticora-secrets' <<<"$ref" || ! grep -q 'key: master-key' <<<"$ref"; then
              echo "::error::$overlay does not inject RETICORA_MASTER_KEY from secret reticora-secrets/master-key"
              exit 1
            fi
            echo "$overlay: RETICORA_MASTER_KEY <- reticora-secrets/master-key"
          done
