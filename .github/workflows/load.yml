# NFR-10 (WP-204): load test against the SIM-01 seed scaled to 10,000
# objects. The k6 thresholds are the budgets of NFR-02 and NFR-03. Each
# scenario runs as a job of its own, as the evidence protocol requires
# (tests/load/README.md): a fresh database, the seed, the rebuilt search
# index and ANALYZE, then the server with four ingest lanes; one scenario's
# backlog never reaches the next. After the run tests/integrity-check.sql
# must find no violation (ABN-03, F-281), and the database cost of the run
# per record is reported from pg_stat_statements (F-118). Every job uploads
# its k6 summary, the integrity check and the cost report as an artifact of
# its own.
#
# server_ref (WP-437, F-118): the server, the seed and the migrations are
# built from that commit, tests/load and tests/integrity-check.sql always
# from the run's commit. The re-discovery before and after WP-434 compares
# a run of ingest-rediscover with server_ref = the parent of the WP-434
# merge and one with the run's commit; an invalid server_ref ends the run in
# the job prepare, before anything is built or seeded.
#
# Root cause of NFR-02 (WP-438, F-117): every api.js run also records
# auto_explain plans of the statements over 100 ms (slow-plans-api.txt and
# the PostgreSQL log) and the CPU profile of the server during the load
# (cpu-api.pprof, summarized in cpu-api.txt; RETICORA_PPROF_ADDR, loopback
# only); the cost report lists the statements by their share of the run's
# execution time (pg_stat_statements).
#
# NFR-01 (WP-439, F-279): the job nfr01-volume runs api.js on the volumes of
# NFR-01: 10,000 objects with 50,000 interfaces, 200,000 addresses and
# 100,000 relationships in the demo organization and 500 small
# organizations besides it (cmd/seed -interfaces-per-ci, -ips-per-ci,
# -relationships-per-ci, -orgs); every job records what the seed holds.
#
# E-17 (WP-839): the jobs api-large-28000 and api-large-50000 (scenarios
# api-large selects both) run api.js on a demo organization of 28,000 and
# 50,000 objects (matrix objects, a fresh database, the seed and ANALYZE
# like every job). At 28,000 objects list, filter and list_sorted keep the
# p95 budget of 500 ms including total (LATENCY_BUDGETS=lists); the search
# and every value at 50,000 objects, topology and impact included, are
# measured without a budget (LATENCY_BUDGETS=none). The failure thresholds
# hold in both. The evidence is the median of three runs (E-58).
# Phase 2 (WP-822, ABN-02, NFR-02): every job starts the server with
# RETICORA_MODULES=P2, the release configuration of G2 (every module of
# phase P2 in server.LateModules, metamodel and import included after
# E-105), and seeds the demo organization with objects CIs and the inputs
# assets, tickets and consumables (cmd/seed -assets, -tickets,
# -consumables; 10,000 each): 10,000 CIs and 10,000 assets are 20,000
# objects of NFR-01. api-large-50000 keeps the SIM-01 quantities of the
# Phase-2 objects, because the seed takes at most 50,000 CIs and assets
# together (MaxObjects). The job phase2 runs tests/load/phase2.js (lists,
# search, filters, relationship search and bulk of Phase 2) with a second
# key from a second seed run with -api-key-role viewer
# (API_KEY_RESTRICTED). The job api keeps its thresholds against the
# extended seed: OBJECTS stays the CI count objects.
#
# Mass write jobs beside the ingest (WP-823, ABN-02, NFR-03): the jobs
# import, template and computed run tests/load/writes.js with SCENARIO =
# the job, each with a fresh database, the seed, ANALYZE, four ingest
# lanes and the P2 modules. The preparation of the scenario is a k6 run of
# its own (PHASE=prepare) before the ingest starts; then ingest.js
# (SCENARIO=load, 200 records/s for INGEST_DURATION_S = 120 s, every record
# a new CI: 24,000 CIs, about 44,000 with seed and import) runs in the
# background beside writes.js. The job fails when either run fails, so
# NFR-03 (ingest_visible_delay < 30 s, ingest_records_missing = 0) holds
# beside the write job too. The ingest summary is <job>-ingest.json beside
# <job>.json; size-<job>.txt holds the size of the organization at the end
# of the job. The import over JSON rows stages them in the object storage
# (WP-303), so these jobs start MinIO (the image of ci.yml) and the server
# with RETICORA_S3_*; the import of documents with the clamd scan is not
# measured.
#
# The job archive gathers the k6 summaries, run records (commit, lscpu,
# memory, configuration) and outcomes of all jobs into one artifact,
# load-archive-<run id>, that docs/acceptance/artefakte/lasttest/<run id>/
# takes over unchanged (tests/load/archive-run.sh, tests/load/README.md).
# The evidence of three runs is evaluated from their archives by the median
# rule of E-58 (tests/load/evaluate-runs.sh, self-test in the job prepare).
name: Load test

on:
  workflow_dispatch:
    inputs:
      objects:
        description: "CIs of the demo organization (NFR-10: 10000)"
        default: "10000"
      duration:
        description: Duration of each read scenario
        default: "2m"
      server_ref:
        description: "Commit, tag or branch the server, the seed and the migrations are built from (empty: the run's commit)"
        default: ""
      assets:
        description: "Assets of the demo organization (Phase 2, cmd/seed -assets; WP-822: 10000)"
        default: "10000"
      tickets:
        description: "Tickets of the demo organization (Phase 2, cmd/seed -tickets; WP-822: 10000)"
        default: "10000"
      consumables:
        description: "Consumables of the demo organization (Phase 2, cmd/seed -consumables; WP-822: 10000)"
        default: "10000"
      scenarios:
        description: "Jobs to run, comma-separated (api, ingest, ingest-spool, ingest-rediscover, nfr01-volume, api-large, phase2, import, template, computed), or all"
        default: "all"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  # Resolves server_ref and selects the scenarios before any job builds or
  # seeds: an invalid ref or scenario fails here with an error.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      server_sha: ${{ steps.ref.outputs.sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the server_ref resolution
        run: ./tests/load/resolve-server-ref.test.sh

      - name: Test the plan summary
        run: ./tests/load/slow-plans.test.sh

      - name: Test the run archive
        run: ./tests/load/archive-run.test.sh

      - name: Test the evaluation over three runs
        run: ./tests/load/evaluate-runs.test.sh

      # E-104 (WP-839): GET /cis caps its total at 10,000; ingest.js counts
      # the visible records exactly beyond it (tests/load/count.js, node).
      - name: Test the exact counts of the ingest scenarios
        run: ./tests/load/count.test.sh

      # F-388 (WP-659): a failed request or a bulk job that did not succeed
      # makes the run red; k6 against a stub of the API.
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: Test the failure thresholds of the load scripts
        run: ./tests/load/thresholds.test.sh

      - name: Resolve server_ref
        id: ref
        env:
          SERVER_REF: ${{ inputs.server_ref }}
        run: |
          if ! sha="$(tests/load/resolve-server-ref.sh "$SERVER_REF" "$GITHUB_SHA")"; then
            echo "$sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Server, seed and migrations from \`$sha\` (server_ref \`${SERVER_REF:-}\`); tests/load and tests/integrity-check.sql from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Select the scenarios
        id: matrix
        env:
          SCENARIOS: ${{ inputs.scenarios || 'all' }}
        run: |
          # objects and latency_budgets: the size of the demo organization
          # (empty: the input objects) and the p95 budgets of api.js
          # (LATENCY_BUDGETS); group selects several jobs by one name;
          # phase2_volumes: inputs (the inputs assets, tickets and
          # consumables) or sim01 (the SIM-01 quantities; WP-822).
          all='[{"scenario":"api","script":"api.js","k6_scenario":"","seed_args":"","objects":"","latency_budgets":"all","group":"","phase2_volumes":"inputs"},
                {"scenario":"ingest","script":"ingest.js","k6_scenario":"load","seed_args":"","objects":"","latency_budgets":"","group":"","phase2_volumes":"inputs"},
                {"scenario":"ingest-spool","script":"ingest.js","k6_scenario":"spool","seed_args":"","objects":"","latency_budgets":"","group":"","phase2_volumes":"inputs"},
                {"scenario":"ingest-rediscover","script":"ingest.js","k6_scenario":"rediscover","seed_args":"","objects":"","latency_budgets":"","group":"","phase2_volumes":"inputs"},
                {"scenario":"nfr01-volume","script":"api.js","k6_scenario":"",
                 "seed_args":"-interfaces-per-ci 5 -ips-per-ci 20 -relationships-per-ci 10 -orgs 500","objects":"","latency_budgets":"all","group":"","phase2_volumes":"inputs"},
                {"scenario":"api-large-28000","script":"api.js","k6_scenario":"","seed_args":"","objects":"28000","latency_budgets":"lists","group":"api-large","phase2_volumes":"inputs"},
                {"scenario":"api-large-50000","script":"api.js","k6_scenario":"","seed_args":"","objects":"50000","latency_budgets":"none","group":"api-large","phase2_volumes":"sim01"},
                {"scenario":"phase2","script":"phase2.js","k6_scenario":"","seed_args":"","objects":"","latency_budgets":"","group":"","phase2_volumes":"inputs"},
                {"scenario":"import","script":"writes.js","k6_scenario":"import","seed_args":"","objects":"","latency_budgets":"","group":"","phase2_volumes":"inputs"},
                {"scenario":"template","script":"writes.js","k6_scenario":"template","seed_args":"","objects":"","latency_budgets":"","group":"","phase2_volumes":"inputs"},
                {"scenario":"computed","script":"writes.js","k6_scenario":"computed","seed_args":"","objects":"","latency_budgets":"","group":"","phase2_volumes":"inputs"}]'
          want="$(jq -cn --arg s "$SCENARIOS" '$s | gsub("\\s"; "") | split(",") | map(select(. != ""))')"
          unknown="$(jq -rn --argjson all "$all" --argjson want "$want" '$want - ["all"] - [$all[].scenario] - [$all[].group] | join(", ")')"
          if [ -n "$unknown" ] || [ "$want" = "[]" ]; then
            echo "::error title=scenarios::unknown or no scenario '${unknown:-$SCENARIOS}': api, ingest, ingest-spool, ingest-rediscover, nfr01-volume, api-large (api-large-28000, api-large-50000), phase2, import, template, computed or all"
            exit 1
          fi
          matrix="$(jq -cn --argjson all "$all" --argjson want "$want" \
            'if ($want | index("all")) then $all else [$all[] | select(.scenario as $n | .group as $g | ($want | index($n)) or ($g != "" and ($want | index($g))))] end')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  load:
    name: Load (${{ matrix.scenario }})
    needs: prepare
    runs-on: ubuntu-latest
    # The write jobs (WP-823) add the preparation and up to two imports of
    # 10,000 rows to the seed.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # DATABASE_URL is the migration/admin login (migrate, seed via
      # database.NewAdminPool); the server logs in with RUNTIME_DATABASE_URL,
      # a login without SUPERUSER/BYPASSRLS (TEN-03, WP-351).
      DATABASE_URL: postgres://reticora:reticora@localhost:5432/reticora?sslmode=disable
      RUNTIME_DATABASE_URL: postgres://reticora_test_runtime:reticora_test_runtime@localhost:5432/reticora?sslmode=disable
      OBJECTS: ${{ matrix.objects || inputs.objects || '10000' }}
      # The Phase-2 volumes of the seed (WP-822); empty with phase2_volumes
      # sim01: no flag, the SIM-01 quantities.
      ASSETS: ${{ matrix.phase2_volumes == 'inputs' && (inputs.assets || '10000') || '' }}
      TICKETS: ${{ matrix.phase2_volumes == 'inputs' && (inputs.tickets || '10000') || '' }}
      CONSUMABLES: ${{ matrix.phase2_volumes == 'inputs' && (inputs.consumables || '10000') || '' }}
      LATENCY_BUDGETS: ${{ matrix.latency_budgets || 'all' }}
      DURATION: ${{ inputs.duration || '2m' }}
      SERVER_SHA: ${{ needs.prepare.outputs.server_sha }}
      SCENARIO_NAME: ${{ matrix.scenario }}
      # The server configuration of every job (E-58: four ingest lanes, the
      # raised rate limit); the run record names it.
      INGEST_LANES: "4"
      # The release configuration of G2 (WP-822): every module of phase P2
      # (server.ParseModules).
      MODULES: "P2"
      # The ingest beside writes.js (WP-823): 200 records/s for 120 s.
      INGEST_DURATION_S: "120"
      RATE_LIMIT_RPM: "1000000"
      RATE_LIMIT_ORG_RPM: "1000000"
    steps:
      # The run's commit: tests/load and tests/integrity-check.sql.
      - uses: actions/checkout@v4

      # server_ref (WP-437): the server, the seed and the migrations.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.server_sha }}
          path: server-src

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: server-src/backend/go.sum

      # A service container takes no server options; pg_stat_statements
      # must be preloaded for the cost per record (F-118), auto_explain for
      # the plans of api.js (F-117; off until the step that resets the
      # statistics switches it on).
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=reticora -e POSTGRES_PASSWORD=reticora -e POSTGRES_DB=reticora \
            timescale/timescaledb:2.31.0-pg16@sha256:322ae364eca3321cf2a48f1ef31213b87843413b3cf8feeebf54e999a26bb731 \
            postgres -c shared_preload_libraries=timescaledb,pg_stat_statements,auto_explain
          for _ in $(seq 1 90); do
            psql "$DATABASE_URL" -Atc 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js

      # writes.js (WP-823): the import over JSON rows stages them in the
      # object storage (WP-303; without it POST /imports is 503). The image
      # of ci.yml and deploy/docker-compose; a service container takes no
      # arguments ("server /data").
      - name: Start MinIO
        if: matrix.script == 'writes.js'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=reticora -e MINIO_ROOT_PASSWORD=reticora_dev \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio; exit 1

      - name: Migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
          migrate -path server-src/backend/migrations -database "$DATABASE_URL" up

      # TEN-03/F-057 (WP-351): the server runs with a runtime login without
      # SUPERUSER/BYPASSRLS, member of reticora_app only (same SQL as the
      # runtime test login of the CI database job, WP-349).
      - name: Create the runtime login
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE reticora_test_runtime LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'reticora_test_runtime';
          GRANT reticora_app TO reticora_test_runtime;
          SQL

      - name: Build server and seed
        working-directory: server-src/backend
        run: |
          go build -o "$RUNNER_TEMP/server" ./cmd/server
          go build -o "$RUNNER_TEMP/seed" ./cmd/seed

      # The seed is a tool with the migration login (database.NewAdminPool).
      # nfr01-volume adds the volumes of NFR-01 (matrix seed_args; a
      # server_ref before WP-439 has no such options and fails here), every
      # job but api-large-50000 the Phase-2 volumes ASSETS, TICKETS and
      # CONSUMABLES (WP-821; a server_ref before WP-821 fails here).
      # phase2.js (WP-822) also needs the key of the role user viewer: a
      # second run with the same options changes no row and issues
      # load-test-viewer beside load-test (-api-key-role, WP-325).
      - name: Seed (SIM-01, NFR-10, NFR-01, Phase 2)
        id: seed
        env:
          SEED_ARGS: ${{ matrix.seed_args }}
          K6_SCRIPT: ${{ matrix.script }}
        run: |
          mkdir -p load-results
          read -ra volume <<< "$SEED_ARGS"
          if [ -n "$ASSETS" ]; then
            volume+=(-assets "$ASSETS" -tickets "$TICKETS" -consumables "$CONSUMABLES")
          fi
          start=$SECONDS
          "$RUNNER_TEMP/seed" -database-url "$DATABASE_URL" -objects "$OBJECTS" "${volume[@]}" \
            -api-key-file "$RUNNER_TEMP/load.key" > /dev/null
          echo "seed seconds: $((SECONDS - start))" | tee "load-results/seed-$SCENARIO_NAME.txt"
          if [ "$K6_SCRIPT" = phase2.js ]; then
            start=$SECONDS
            "$RUNNER_TEMP/seed" -database-url "$DATABASE_URL" -objects "$OBJECTS" "${volume[@]}" \
              -api-key-role viewer -api-key-file "$RUNNER_TEMP/load-restricted.key" > /dev/null
            echo "seed seconds of the viewer key: $((SECONDS - start))" | tee -a "load-results/seed-$SCENARIO_NAME.txt"
          fi

      # NFR-01 (WP-439): what the seed holds; nfr01-volume fails below the
      # volumes of NFR-01 (10,000 objects with 50,000 interfaces, 200,000
      # addresses and 100,000 relationships in one organization, 500
      # organizations).
      - name: Seeded volumes (NFR-01)
        id: volumes
        run: |
          set -o pipefail
          mkdir -p load-results
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F '|' <<'SQL' | tee "load-results/volumes-$SCENARIO_NAME.txt"
          WITH demo AS (SELECT id FROM organization WHERE slug = 'demo')
          SELECT 'CIs of demo', count(*) FROM ci WHERE organization_id = (SELECT id FROM demo) AND deleted_at IS NULL
          UNION ALL SELECT 'interfaces of demo', count(*) FROM network_interface WHERE organization_id = (SELECT id FROM demo)
          UNION ALL SELECT 'addresses of demo', count(*) FROM ip_address WHERE organization_id = (SELECT id FROM demo)
          UNION ALL SELECT 'relationships of demo', count(*) FROM ci_relationship WHERE organization_id = (SELECT id FROM demo)
          UNION ALL SELECT 'organizations', count(*) FROM organization
          UNION ALL SELECT 'assets of demo', count(*) FROM asset WHERE organization_id = (SELECT id FROM demo)
          UNION ALL SELECT 'tickets of demo', count(*) FROM ticket WHERE organization_id = (SELECT id FROM demo)
          UNION ALL SELECT 'consumables of demo', count(*) FROM consumable WHERE organization_id = (SELECT id FROM demo)
          SQL
          if [ "$SCENARIO_NAME" = nfr01-volume ]; then
            awk -F'|' 'BEGIN { split("10000 50000 200000 100000 500", want, " ") }
              $2 + 0 < want[NR] + 0 { printf "::error title=NFR-01::%s: %s, NFR-01 needs %s\n", $1, $2, want[NR]; bad = 1 }
              END { exit bad }' "load-results/volumes-$SCENARIO_NAME.txt"
          fi

      # RETICORA_PPROF_ADDR (WP-438): the CPU profile of the api.js run, on
      # the loopback address only (development, the server's default
      # environment here). A server_ref before WP-438 ignores it. writes.js
      # (WP-823) gets the object storage of the step Start MinIO.
      - name: Start the server
        env:
          K6_SCRIPT: ${{ matrix.script }}
        run: |
          openssl genrsa -out "$RUNNER_TEMP/session.pem" 2048
          if [ "$K6_SCRIPT" = writes.js ]; then
            export RETICORA_S3_ENDPOINT=localhost:9000 RETICORA_S3_ACCESS_KEY=reticora RETICORA_S3_SECRET_KEY=reticora_dev
          fi
          RETICORA_DATABASE_URL="$RUNTIME_DATABASE_URL" \
          RETICORA_REDIS_URL=redis://localhost:6379/0 \
          RETICORA_NATS_URL=nats://localhost:4222 \
          RETICORA_SESSION_KEY_PATH="$RUNNER_TEMP/session.pem" \
          RETICORA_MASTER_KEY="$(head -c 32 /dev/urandom | base64)" \
          RETICORA_RATE_LIMIT_RPM="$RATE_LIMIT_RPM" RETICORA_RATE_LIMIT_ORG_RPM="$RATE_LIMIT_ORG_RPM" \
          RETICORA_INGEST_LANES="$INGEST_LANES" \
          RETICORA_MODULES="$MODULES" \
          RETICORA_PPROF_ADDR=127.0.0.1:6060 \
          nohup "$RUNNER_TEMP/server" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do curl -fsS http://localhost:8080/healthz >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1

      # F-116: the global search reads the index of the whole organization,
      # rebuilt after the seed as an operator does it. Since WP-786 the
      # rebuild is the job search.reindex (202 with job_id): the step waits
      # until it succeeded, so phase2.js finds the assets (WP-822); an
      # answer without job_id (a server_ref before WP-786) rebuilt in the
      # request.
      - name: Rebuild the search index
        run: |
          key="$(cat "$RUNNER_TEMP/load.key")"
          answer="$(curl -fsS -X POST -H "X-API-Key: $key" http://localhost:8080/api/v1/search/reindex)"
          echo "$answer"
          job="$(jq -r '.job_id // empty' <<< "$answer")"
          if [ -z "$job" ]; then
            exit 0
          fi
          for _ in $(seq 1 600); do
            status="$(curl -fsS -H "X-API-Key: $key" "http://localhost:8080/api/v1/jobs/$job" | jq -r .status)"
            case "$status" in
              succeeded) echo "search.reindex $job succeeded"; exit 0 ;;
              queued | running) sleep 1 ;;
              *) echo "::error title=reindex::search.reindex $job: $status"; exit 1 ;;
            esac
          done
          echo "::error title=reindex::search.reindex $job did not end within 10 minutes"
          exit 1

      # Statistics of the seeded tables and the rebuilt index before the
      # first request: without them the plans depend on when autovacuum
      # gets to the seed.
      - name: Analyze the seed
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'ANALYZE'

      # api.js (F-117): from here on auto_explain logs the plan of every
      # statement over 100 ms with its actual rows and buffers, without
      # timing each plan node (that would slow every statement down); the
      # setting reaches the server's open connections with the reload.
      - name: Reset the statement statistics
        env:
          K6_SCRIPT: ${{ matrix.script }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements' \
            -c 'SELECT pg_stat_statements_reset()'
          if [ "$K6_SCRIPT" = api.js ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "ALTER SYSTEM SET auto_explain.log_min_duration = '100ms'" \
              -c 'ALTER SYSTEM SET auto_explain.log_analyze = on' \
              -c 'ALTER SYSTEM SET auto_explain.log_buffers = on' \
              -c 'ALTER SYSTEM SET auto_explain.log_timing = off' \
              -c 'SELECT pg_reload_conf()'
          fi

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      # api.js (F-117): the server's CPU profile from 10 s after the start
      # (setup done) to 10 s before the end of DURATION.
      - name: k6 ${{ matrix.scenario }}
        id: k6
        env:
          K6_SCRIPT: ${{ matrix.script }}
          K6_SCENARIO: ${{ matrix.k6_scenario }}
        run: |
          set -o pipefail
          mkdir -p load-results
          args=(-e BASE_URL=http://localhost:8080 -e API_KEY="$(cat "$RUNNER_TEMP/load.key")" -e DURATION="$DURATION" -e OBJECTS="$OBJECTS")
          if [ -n "$K6_SCENARIO" ]; then
            args+=(-e SCENARIO="$K6_SCENARIO")
          fi
          if [ "$K6_SCRIPT" = phase2.js ]; then
            args+=(-e API_KEY_RESTRICTED="$(cat "$RUNNER_TEMP/load-restricted.key")")
          fi
          if [ "$K6_SCRIPT" = api.js ]; then
            args+=(-e LATENCY_BUDGETS="$LATENCY_BUDGETS")
            seconds=0 rest="$DURATION"
            while [[ $rest =~ ^([0-9]+)([hms])(.*)$ ]]; do
              n=$((10#${BASH_REMATCH[1]}))
              case ${BASH_REMATCH[2]} in
                h) seconds=$((seconds + n * 3600)) ;;
                m) seconds=$((seconds + n * 60)) ;;
                s) seconds=$((seconds + n)) ;;
              esac
              rest=${BASH_REMATCH[3]}
            done
            if [ -z "$rest" ] && [ "$seconds" -ge 30 ]; then
              (
                sleep 10
                curl -fsS -o "load-results/cpu-$SCENARIO_NAME.pprof" \
                  "http://127.0.0.1:6060/debug/pprof/profile?seconds=$((seconds - 20))" \
                  || echo "::warning title=pprof::no CPU profile of the server (server_ref before WP-438?)"
              ) &
            else
              echo "::warning title=pprof::no CPU profile: DURATION=$DURATION is not h/m/s of at least 30 s"
            fi
          fi
          # writes.js (WP-823): the preparation as a k6 run of its own, then
          # ingest.js (load, INGEST_DURATION_S) in the background beside the
          # measured write job.
          ingest=""
          if [ "$K6_SCRIPT" = writes.js ]; then
            k6 run "${args[@]}" -e PHASE=prepare --console-output "load-results/console-$SCENARIO_NAME-prepare.log" \
              tests/load/writes.js | tee "load-results/$SCENARIO_NAME-prepare.txt" || {
              status=$?
              cat "load-results/console-$SCENARIO_NAME-prepare.log" > "load-results/console-$SCENARIO_NAME.log" 2>/dev/null || true
              echo "::error title=writes::the preparation of $SCENARIO_NAME failed"
              exit "$status"
            }
            k6 run -e BASE_URL=http://localhost:8080 -e API_KEY="$(cat "$RUNNER_TEMP/load.key")" -e SCENARIO=load \
              -e DURATION_S="$INGEST_DURATION_S" -e OBJECTS="$OBJECTS" \
              --summary-export "load-results/$SCENARIO_NAME-ingest.json" \
              --console-output "load-results/console-$SCENARIO_NAME-ingest.log" tests/load/ingest.js \
              > "load-results/$SCENARIO_NAME-ingest.txt" 2>&1 &
            ingest=$!
          fi
          status=0
          k6 run "${args[@]}" --summary-export "load-results/$SCENARIO_NAME.json" \
            --console-output "load-results/console-$SCENARIO_NAME.log" "tests/load/$K6_SCRIPT" \
            | tee "load-results/$SCENARIO_NAME.txt" || status=$?
          if [ -n "$ingest" ]; then
            ingest_status=0
            wait "$ingest" || ingest_status=$?
            cat "load-results/$SCENARIO_NAME-ingest.txt"
            # The failed requests of the preparation count with the job.
            cat "load-results/console-$SCENARIO_NAME-prepare.log" >> "load-results/console-$SCENARIO_NAME.log" 2>/dev/null || true
            if [ "$ingest_status" -ne 0 ]; then
              echo "::error title=ingest::the ingest beside $SCENARIO_NAME failed (k6 exit $ingest_status)"
              [ "$status" -ne 0 ] || status=$ingest_status
            fi
          fi
          wait
          exit "$status"

      # F-388 (WP-659): every failed request by name and status (k6 console,
      # tests/load/lib.js) in the job summary and for the archive.
      - name: Failed requests
        if: always() && steps.k6.outcome != 'skipped'
        env:
          K6_SCRIPT: ${{ matrix.script }}
        run: |
          mkdir -p load-results
          tests/load/failed-requests.sh "load-results/console-$SCENARIO_NAME.log" | tee "load-results/failed-$SCENARIO_NAME.txt"
          {
            echo "### Job $SCENARIO_NAME"
            echo
            cat "load-results/failed-$SCENARIO_NAME.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          # The ingest beside writes.js (WP-823).
          if [ "$K6_SCRIPT" = writes.js ]; then
            tests/load/failed-requests.sh "load-results/console-$SCENARIO_NAME-ingest.log" \
              | tee "load-results/failed-$SCENARIO_NAME-ingest.txt"
            {
              echo
              echo "#### Ingest beside $SCENARIO_NAME"
              echo
              cat "load-results/failed-$SCENARIO_NAME-ingest.txt"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # F-117 (WP-438): auto_explain off again, so the checks below do not
      # add plans; the PostgreSQL log, the plans of the statements over
      # 100 ms by statement and the summary of the CPU profile.
      - name: Statement plans and CPU profile
        if: always() && steps.k6.outcome != 'skipped' && matrix.script == 'api.js'
        run: |
          mkdir -p load-results
          psql "$DATABASE_URL" -c 'ALTER SYSTEM RESET auto_explain.log_min_duration' -c 'SELECT pg_reload_conf()' \
            || echo "::warning title=auto_explain::auto_explain stays on"
          docker logs postgres > "load-results/postgres-$SCENARIO_NAME.log" 2>&1 || true
          tests/load/slow-plans.sh "load-results/postgres-$SCENARIO_NAME.log" > "load-results/slow-plans-$SCENARIO_NAME.txt" \
            || echo "::warning title=slow-plans::the plan summary failed"
          head -25 "load-results/slow-plans-$SCENARIO_NAME.txt" || true
          if [ -s "load-results/cpu-$SCENARIO_NAME.pprof" ]; then
            tests/load/cpu-profile-report.sh "load-results/cpu-$SCENARIO_NAME.pprof" > "load-results/cpu-$SCENARIO_NAME.txt" \
              || echo "::warning title=pprof::the profile summary failed"
          fi

      # WP-823: the size of the organization at the end of a write job
      # (seed, import and the CIs of the ingest beside it), for the report
      # of WP-327 (the headroom of NFR-01 is 50,000 objects).
      - name: Size of the organization at the end
        if: always() && steps.k6.outcome != 'skipped' && matrix.script == 'writes.js'
        run: |
          set -o pipefail
          mkdir -p load-results
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F '|' <<'SQL' | tee "load-results/size-$SCENARIO_NAME.txt"
          WITH demo AS (SELECT id FROM organization WHERE slug = 'demo')
          SELECT 'CIs of demo', count(*) FROM ci WHERE organization_id = (SELECT id FROM demo) AND deleted_at IS NULL
          UNION ALL SELECT 'assets of demo', count(*) FROM asset WHERE organization_id = (SELECT id FROM demo)
          UNION ALL SELECT 'objects of demo (CIs and assets)',
            (SELECT count(*) FROM ci WHERE organization_id = (SELECT id FROM demo) AND deleted_at IS NULL)
            + (SELECT count(*) FROM asset WHERE organization_id = (SELECT id FROM demo))
          SQL

      # ABN-03, F-281: the data after the run, every check 0.
      - name: Integrity check
        id: integrity
        if: always() && steps.k6.outcome != 'skipped'
        run: |
          set -o pipefail
          mkdir -p load-results
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F '|' -f tests/integrity-check.sql | tee "load-results/integrity-$SCENARIO_NAME.txt"
          violations="$(awk -F'|' '{s += $2} END {print s + 0}' "load-results/integrity-$SCENARIO_NAME.txt")"
          checks="$(wc -l < "load-results/integrity-$SCENARIO_NAME.txt")"
          if [ "$checks" -eq 0 ] || [ "$violations" -ne 0 ]; then
            echo "::error title=integrity-check::$violations violations in $checks checks after the run"
            exit 1
          fi
          echo "integrity check: 0 violations in $checks checks"

      # F-118: execution time, buffers and generic plan cost of the run's
      # statements per accepted record (tests/load/statement-costs.sql).
      - name: Database cost per record
        if: always() && steps.k6.outcome != 'skipped'
        run: |
          set -o pipefail
          mkdir -p load-results
          # writes.js (WP-823): the records of the ingest beside it.
          summary="load-results/$SCENARIO_NAME.json"
          if [ -f "load-results/$SCENARIO_NAME-ingest.json" ]; then
            summary="load-results/$SCENARIO_NAME-ingest.json"
          fi
          records="$(jq -r '.metrics.ingest_records_accepted.count // 0' "$summary" 2>/dev/null || echo 0)"
          org="$(psql "$DATABASE_URL" -Atc "SELECT id FROM organization WHERE slug = 'demo'")"
          psql "$DATABASE_URL" -v records="$records" -v org="$org" -f tests/load/statement-costs.sql \
            | tee "load-results/statements-$SCENARIO_NAME.txt" \
            || echo "::warning title=statement-costs::the cost report failed"

      - name: Ingest backlog per lane
        if: always()
        run: |
          mkdir -p load-results
          curl -fsS http://localhost:8080/readyz > "load-results/readyz-$SCENARIO_NAME.json" || true

      - name: Collect the server log
        if: always()
        run: |
          mkdir -p load-results
          cp "$RUNNER_TEMP/server.log" "load-results/server-$SCENARIO_NAME.log" || true

      # E-58 (WP-439): commit, server_ref, CPU (lscpu), memory and the
      # configuration of the run, and the outcome of the job and its steps
      # (the last step before the upload, so the status is final), for the
      # archive (tests/load/archive-run.sh).
      - name: Record the run
        if: always()
        env:
          K6_SCRIPT: ${{ matrix.script }}
          K6_SCENARIO: ${{ matrix.k6_scenario }}
          SEED_ARGS: ${{ matrix.seed_args }}
          JOB_STATUS: ${{ job.status }}
          SEED_OUTCOME: ${{ steps.seed.outcome }}
          VOLUMES_OUTCOME: ${{ steps.volumes.outcome }}
          K6_OUTCOME: ${{ steps.k6.outcome }}
          INTEGRITY_OUTCOME: ${{ steps.integrity.outcome }}
        run: |
          mkdir -p load-results
          {
            echo "run commit: $GITHUB_SHA"
            echo "server, seed and migrations: $SERVER_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "recorded: $(date -u +%FT%TZ)"
            echo "script: $K6_SCRIPT"
            echo "k6 scenario: ${K6_SCENARIO:-default}"
            echo "objects: $OBJECTS"
            echo "latency budgets: $LATENCY_BUDGETS"
            echo "duration: $DURATION"
            echo "seed options: ${SEED_ARGS:-none}"
            echo "phase-2 volumes: ${ASSETS:-SIM-01} assets, ${TICKETS:-SIM-01} tickets, ${CONSUMABLES:-SIM-01} consumables"
            echo "modules: $MODULES"
            if [ "$K6_SCRIPT" = writes.js ]; then
              echo "parallel ingest: ingest.js load, 200 records/s for $INGEST_DURATION_S s"
            fi
            echo "ingest lanes: $INGEST_LANES"
            echo "rate limit rpm: $RATE_LIMIT_RPM"
            echo "rate limit org rpm: $RATE_LIMIT_ORG_RPM"
            echo "k6: $(k6 version 2>/dev/null | head -n 1)"
            echo "go: $(go version 2>/dev/null)"
            echo "postgresql: $(psql "$DATABASE_URL" -Atc 'SELECT version()' 2>/dev/null)"
            echo "timescaledb: $(psql "$DATABASE_URL" -Atc "SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'" 2>/dev/null)"
            echo "runner: ${RUNNER_NAME:-} ${ImageOS:-} ${ImageVersion:-}"
            echo "kernel: $(uname -sr)"
            docker ps --format 'container: {{.Names}} {{.Image}}' || true
            lscpu
            grep -E '^(MemTotal|MemAvailable):' /proc/meminfo
            free -h
          } > "load-results/run-$SCENARIO_NAME.txt"
          {
            echo "job: $SCENARIO_NAME"
            echo "status: $JOB_STATUS"
            echo "seed: ${SEED_OUTCOME:-skipped}"
            echo "volumes: ${VOLUMES_OUTCOME:-skipped}"
            echo "k6: ${K6_OUTCOME:-skipped}"
            echo "integrity: ${INTEGRITY_OUTCOME:-skipped}"
          } | tee "load-results/result-$SCENARIO_NAME.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-results-${{ matrix.scenario }}
          path: load-results/

  # WP-439 (E-58, NFR-10): one artifact per run, load-archive-<run id>, with
  # the k6 summaries, run records and outcomes of every selected job and
  # ergebnis.md with every threshold; docs/acceptance/artefakte/lasttest/
  # takes it over unchanged (tests/load/README.md). It also runs when a load
  # job failed: a red job is a result of the run.
  archive:
    name: Archive
    needs: [prepare, load]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: load-results-*
          path: load-artifacts

      - name: Assemble the archive
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          SERVER_SHA: ${{ needs.prepare.outputs.server_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_OBJECTS: ${{ inputs.objects || '10000' }}
          INPUT_DURATION: ${{ inputs.duration || '2m' }}
          INPUT_SCENARIOS: ${{ inputs.scenarios || 'all' }}
          INPUT_SERVER_REF: ${{ inputs.server_ref }}
        run: |
          jobs="$(jq -r '[.[].scenario] | join(",")' <<< "$MATRIX")"
          tests/load/archive-run.sh load-artifacts "load-archive/$GITHUB_RUN_ID" "$jobs"
          cat "load-archive/$GITHUB_RUN_ID/ergebnis.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: load-archive-${{ github.run_id }}
          path: load-archive/
          overwrite: true
