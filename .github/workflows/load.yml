# NFR-10 (WP-204): load test against the SIM-01 seed scaled to 10,000
# objects. The k6 thresholds are the budgets of NFR-02 and NFR-03. Each
# scenario runs as a job of its own, as the evidence protocol requires
# (tests/load/README.md): a fresh database, the seed and ANALYZE, then the
# server with four ingest lanes; one scenario's backlog never reaches the
# next. Every job uploads its k6 summary as an artifact of its own.
name: Load test

on:
  workflow_dispatch:
    inputs:
      objects:
        description: "CIs of the demo organization (NFR-10: 10000)"
        default: "10000"
      duration:
        description: Duration of each read scenario
        default: "2m"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  load:
    name: Load (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latency budgets (NFR-02).
          - scenario: api
            script: api.js
            args: '-e DURATION="$DURATION" -e OBJECTS="$OBJECTS"'
          # Ingest delay at 200 records/s (NFR-03).
          - scenario: ingest
            script: ingest.js
            args: '-e SCENARIO=load'
          # Spool flush and drain rate (NFR-03, COL-05).
          - scenario: ingest-spool
            script: ingest.js
            args: '-e SCENARIO=spool'
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: reticora
          POSTGRES_PASSWORD: reticora
          POSTGRES_DB: reticora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reticora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      # DATABASE_URL is the migration/admin login (migrate, seed via
      # database.NewAdminPool); the server logs in with RUNTIME_DATABASE_URL,
      # a login without SUPERUSER/BYPASSRLS (TEN-03, WP-351).
      DATABASE_URL: postgres://reticora:reticora@localhost:5432/reticora?sslmode=disable
      RUNTIME_DATABASE_URL: postgres://reticora_test_runtime:reticora_test_runtime@localhost:5432/reticora?sslmode=disable
      OBJECTS: ${{ inputs.objects || '10000' }}
      DURATION: ${{ inputs.duration || '2m' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum

      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js

      - name: Migrate
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
          migrate -path backend/migrations -database "$DATABASE_URL" up

      # TEN-03/F-057 (WP-351): the server runs with a runtime login without
      # SUPERUSER/BYPASSRLS, member of reticora_app only (same SQL as the
      # runtime test login of the CI database job, WP-349).
      - name: Create the runtime login
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE reticora_test_runtime LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'reticora_test_runtime';
          GRANT reticora_app TO reticora_test_runtime;
          SQL

      - name: Build server and seed
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/server" ./cmd/server
          go build -o "$RUNNER_TEMP/seed" ./cmd/seed

      # The seed is a tool with the migration login (database.NewAdminPool).
      - name: Seed (SIM-01, NFR-10)
        run: |
          "$RUNNER_TEMP/seed" -database-url "$DATABASE_URL" -objects "$OBJECTS" -api-key-file "$RUNNER_TEMP/load.key"

      # Statistics of the seeded tables before the first request: without
      # them the plans depend on when autovacuum gets to the seed.
      - name: Analyze the seed
        run: docker exec "${{ job.services.postgres.id }}" psql -U reticora -d reticora -v ON_ERROR_STOP=1 -c 'ANALYZE'

      - name: Start the server
        run: |
          openssl genrsa -out "$RUNNER_TEMP/session.pem" 2048
          RETICORA_DATABASE_URL="$RUNTIME_DATABASE_URL" \
          RETICORA_REDIS_URL=redis://localhost:6379/0 \
          RETICORA_NATS_URL=nats://localhost:4222 \
          RETICORA_SESSION_KEY_PATH="$RUNNER_TEMP/session.pem" \
          RETICORA_MASTER_KEY="$(head -c 32 /dev/urandom | base64)" \
          RETICORA_RATE_LIMIT_RPM=1000000 RETICORA_RATE_LIMIT_ORG_RPM=1000000 \
          RETICORA_INGEST_LANES=4 \
          nohup "$RUNNER_TEMP/server" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz >/dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: k6 ${{ matrix.scenario }}
        run: |
          set -o pipefail
          mkdir -p load-results
          k6 run -e BASE_URL=http://localhost:8080 -e API_KEY="$(cat "$RUNNER_TEMP/load.key")" ${{ matrix.args }} \
            --summary-export "load-results/${{ matrix.scenario }}.json" "tests/load/${{ matrix.script }}" \
            | tee "load-results/${{ matrix.scenario }}.txt"

      - name: Ingest backlog per lane
        if: always()
        run: |
          mkdir -p load-results
          curl -fsS http://localhost:8080/readyz > "load-results/readyz-${{ matrix.scenario }}.json" || true

      - name: Collect the server log
        if: always()
        run: |
          mkdir -p load-results
          cp "$RUNNER_TEMP/server.log" "load-results/server-${{ matrix.scenario }}.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-results-${{ matrix.scenario }}
          path: load-results/
