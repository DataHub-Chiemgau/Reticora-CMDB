# Signed releases (WP-102, TEC-15, COL-06; tools per E-31).
#
# A version tag v* builds the edge binaries and the container images,
# generates an SPDX SBOM for each, and signs everything keyless with cosign
# (Fulcio certificate for this workflow's identity, Rekor log entry). The
# edge updater (edgecore/update) installs a binary only after
# `cosign verify-blob` accepted its bundle for exactly this workflow on a
# version tag. The installers (WP-387) verify the same identity before the
# installation: the images (install-cloud.sh release mode), the collector
# binary (install-vm.sh --release) and the source of a release tag (install.sh,
# install-vm.sh) against the signed manifest SHA256SUMS, which lists
# SOURCE_COMMIT and the source tarball reticora-source-<tag>.tar.gz.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # cosign v3 (E-258): writes Sigstore bundles (v0.3) and stores the image
  # signatures as OCI referrers; the installers and the updater accept
  # COSIGN_MIN_VERSION (v3.1.3) or newer.
  COSIGN_VERSION: v3.1.4
  REGISTRY: ghcr.io/datahub-chiemgau

jobs:
  # The GitHub release is created by this workflow (binaries, 'Publish the
  # GitHub release'). A release made beforehand for the tag, e.g. in the web
  # UI (publishing it there creates the tag and starts this workflow), would
  # stop the run only at the end, after building, pushing and signing; the
  # run is refused here before anything is built.
  release-free:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: No GitHub release exists for the tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            echo "::error::A GitHub release $GITHUB_REF_NAME already exists; release.yml creates it itself. Delete that release (keep the tag) and re-run this workflow."
            exit 1
          fi

  # A release is only published when the outage suite passes (OPS-06).
  outage:
    needs: release-free
    uses: ./.github/workflows/outage.yml

  # Publishes the GitHub release, so it waits for every image to be signed,
  # attested and verified (WP-545).
  binaries:
    needs: [outage, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the files to the GitHub release
      id-token: write   # keyless signing (Fulcio)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: anchore/sbom-action/download-syft@v0.17.8

      - name: Build edge binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            (cd collector && CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w -X github.com/DataHub-Chiemgau/Reticora-CMDB/collector/collectorcmd.Version=$GITHUB_REF_NAME" \
              -o "../dist/reticora-collector-linux-$arch" ./cmd/collector)
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" -o "../dist/reticora-agent-linux-$arch" ./cmd/agent)
          done

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          for bin in dist/reticora-*-linux-*; do
            syft scan "file:$bin" -o "spdx-json=$bin.spdx.json"
          done
          syft scan dir:. -o spdx-json=dist/reticora-source.spdx.json

      # The source of the tag for the installers (WP-387, TEC-15): the commit
      # a checkout of the tag must be, and the tarball installed without git.
      - name: Source tarball and commit
        run: |
          set -euo pipefail
          git rev-parse HEAD > dist/SOURCE_COMMIT
          git archive --format=tar.gz --prefix="reticora-source-$GITHUB_REF_NAME/" \
            -o "dist/reticora-source-$GITHUB_REF_NAME.tar.gz" HEAD

      # cosign v3 writes the Sigstore bundle format (v0.3, E-258) by
      # default; a legacy bundle stops the release.
      - name: Sign binaries and SBOMs (cosign keyless)
        run: |
          set -euo pipefail
          for file in dist/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            if ! jq -e '.mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json"' "$file.sigstore.json" > /dev/null; then
              echo "::error::$file.sigstore.json is no Sigstore bundle v0.3"
              exit 1
            fi
          done

      # WP-545 (TEC-15, COL-06): the updater's CosignVerifier runs the real
      # cosign against the bundles just made, for every architecture
      # (edgecore/update/cosign_real_test.go): the signed collector passes with
      # the pinned release identity; the binary changed by one byte, a foreign
      # bundle of the same dist directory and another identity are refused. A
      # failing, skipped or missing test stops the release.
      - name: Updater verifier against the real cosign (per architecture)
        run: |
          set -euo pipefail
          dist="$PWD/dist"
          cosign_bin="$(command -v cosign)"
          for arch in amd64 arm64; do
            log="$(mktemp)"
            (cd edgecore && COSIGN_BIN="$cosign_bin" \
              RELEASE_ARTIFACT="$dist/reticora-collector-linux-$arch" \
              RELEASE_BUNDLE="$dist/reticora-collector-linux-$arch.sigstore.json" \
              go test -tags cosignreal -count=1 -v -run '^TestCosignVerifierWithRealCosign$' ./update/) 2>&1 | tee "$log"
            if ! grep -qE '^--- PASS: TestCosignVerifierWithRealCosign ' "$log" \
              || grep -qE -- '--- SKIP|no tests to run' "$log"; then
              echo "::error::TestCosignVerifierWithRealCosign did not pass for linux/$arch (skipped or not run)"
              exit 1
            fi
          done

      - name: Verify the signatures as the updater does
        run: |
          set -euo pipefail
          identity="^https://github\.com/${GITHUB_REPOSITORY//./\\.}/\.github/workflows/release\.yml@refs/tags/v.+$"
          for bundle in dist/*.sigstore.json; do
            cosign verify-blob --bundle "$bundle" \
              --certificate-identity-regexp "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${bundle%.sigstore.json}"
          done

      - name: Write updater release manifests
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          # Channel (COL-06): a pre-release tag (v1.2.0-beta.1) is beta,
          # every other tag stable.
          channel=stable
          case "$GITHUB_REF_NAME" in *-*) channel=beta ;; esac
          for bin in dist/reticora-*-linux-amd64 dist/reticora-*-linux-arm64; do
            name="$(basename "$bin")"
            jq -n --arg version "$GITHUB_REF_NAME" --arg channel "$channel" --arg url "$base/$name" \
              --arg bundle "$base/$name.sigstore.json" --arg sha "$(sha256sum "$bin" | cut -d' ' -f1)" \
              --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $version, channel: $channel, downloadUrl: $url, signatureBundleUrl: $bundle, checksums: {sha256: $sha}, publishedAt: $published}' \
              > "$bin.release.json"
          done
          (cd dist && sha256sum reticora-* SOURCE_COMMIT > SHA256SUMS)

      # The manifest is what the installers verify first (WP-387): signed
      # like every other file and checked with the identity they pin.
      - name: Sign the release manifest
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          if ! jq -e '.mediaType == "application/vnd.dev.sigstore.bundle.v0.3+json"' dist/SHA256SUMS.sigstore.json > /dev/null; then
            echo "::error::dist/SHA256SUMS.sigstore.json is no Sigstore bundle v0.3"
            exit 1
          fi
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # A pre-release tag (v1.0.0-rc.1) becomes a GitHub pre-release, so
        # GitHub's latest release, the installers' default (install.sh), stays
        # the newest stable one.
        run: |
          set -euo pipefail
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${prerelease[@]}" dist/*

  images:
    needs: outage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing (Fulcio)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: reticora-server
            context: .
            dockerfile: backend/Dockerfile
          - image: reticora-collector
            context: .
            dockerfile: collector/Dockerfile
          - image: reticora-frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: reticora-postgres
            context: deploy/docker-compose/postgres
            dockerfile: deploy/docker-compose/postgres/Dockerfile
          # PostgreSQL of Keycloak with the rebuilt gosu (E-96, A-85).
          - image: reticora-keycloak-db
            context: deploy/docker-compose/keycloak-db
            dockerfile: deploy/docker-compose/keycloak-db/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # SEC-11 (WP-389): Trivy reads the exceptions file below.
      - name: Check scan exceptions (SEC-11 SLA)
        run: ./scripts/ci/check-scan-exceptions.sh

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Scan before the push (WP-389, SEC-11, E-31): the image is built into
      # the local Docker store and scanned with the threshold of the ci.yml
      # image-scan job (Critical/High with an available fix block). The push
      # step builds from the same cache; the next step checks that the pushed
      # image has the scanned layers.
      - name: Build the image for the scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.ref_name }}

      - name: Scan image with Trivy
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker image inspect --format '{{json .RootFS.Layers}}' "$IMAGE_TAG" > "$RUNNER_TEMP/scanned-layers.json"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image \
            --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile security/scan-exceptions.txt \
            --format json --output "trivy-${{ matrix.image }}.json" \
            --exit-code 1 \
            "$IMAGE_TAG"

      - name: Summarize findings
        if: always()
        run: |
          if [ -s "trivy-${{ matrix.image }}.json" ]; then
            jq -r '[.Results[]?.Vulnerabilities[]? | "\(.VulnerabilityID) \(.Severity) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)"] | unique | .[]' "trivy-${{ matrix.image }}.json"
          fi

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.json
          retention-days: 90

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.ref_name }}

      - name: The pushed image is the scanned one
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(docker image inspect --format '{{json .RootFS.Layers}}' "$IMAGE_TAG")" != "$(cat "$RUNNER_TEMP/scanned-layers.json")" ]; then
            echo "::error::the pushed image differs from the scanned one; it is not signed"
            exit 1
          fi

      - name: Generate the image SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the image and attest its SBOM (cosign keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate "${{ matrix.image }}.spdx.json" "$IMAGE"

      # WP-545: every image (the matrix, reticora-postgres and
      # reticora-keycloak-db included) is checked as an operator checks it
      # (docs/README.md): its signature and its SPDX SBOM attestation for the
      # release identity. A failure fails
      # this job, and the binaries job publishes the release only after every
      # image passed (needs: images). The signature names the image with the
      # pushed digest, as the installers require (verify_release_image,
      # docker-reference with the digest since cosign v3, E-258).
      - name: Verify the image signature and SBOM attestation
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          identity="^https://github\.com/${GITHUB_REPOSITORY//./\\.}/\.github/workflows/release\.yml@refs/tags/v.+$"
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > "$RUNNER_TEMP/verify.json"
          if ! jq -e --arg ref "$IMAGE" --arg digest "$DIGEST" \
            'any(.[]; .critical.identity["docker-reference"] == $ref and .critical.image["docker-manifest-digest"] == $digest)' \
            "$RUNNER_TEMP/verify.json" > /dev/null; then
            echo "::error::the signature of $IMAGE does not name the image with its digest"
            jq -c '[.[].critical]' "$RUNNER_TEMP/verify.json"
            exit 1
          fi
          cosign verify-attestation --type spdxjson "$IMAGE" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
