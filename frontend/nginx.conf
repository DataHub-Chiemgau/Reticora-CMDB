# Reticora frontend — main nginx configuration (plain HTTP).
#
# The container runs as the unprivileged nginx user (docker-compose sets
# `user: nginx`), so the stock nginx.conf cannot be used: it writes its pid
# to /run/nginx.pid and its temp directories under /var/cache/nginx, both of
# which are read-only for the nginx user (a tmpfs mounted there is owned by
# root). All writable paths therefore live under /tmp, which is backed by a
# tmpfs in docker-compose.
#
# This file replaces /etc/nginx/nginx.conf (see frontend/Dockerfile). It must
# be a complete main configuration — putting `pid` into a file under
# conf.d/ fails with '"pid" directive is not allowed here' and the container
# crash-loops ("docker-compose-frontend-1" is restarting).
#
# TLS: when a domain is configured (RETICORA_TLS_DOMAIN in .env, written by
# install-cloud.sh), docker-compose mounts
# deploy/docker-compose/nginx-tls.conf.template as
# /etc/nginx/templates/reticora-tls.conf.template and the image entrypoint
# renders it (envsubst of ${RETICORA_TLS_DOMAIN}) to
# /etc/nginx/conf.d/reticora-tls.conf, which this file includes below. That
# variant terminates TLS on 443 with the Let's Encrypt certificate and
# redirects HTTP to HTTPS. The rendered directory is made writable for the
# unprivileged nginx user in the Dockerfile.

pid /tmp/nginx.pid;
worker_processes auto;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Writable temp paths for the unprivileged nginx user (see above).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # TLS server configuration rendered by the image entrypoint when
    # RETICORA_TLS_DOMAIN is set (see above); empty otherwise.
    include /etc/nginx/conf.d/*.conf;

    # Default plain-HTTP server: the container health-check endpoint, the
    # ACME challenge directory and (when no TLS domain is configured) the web
    # UI itself. When a TLS domain is configured, the rendered
    # conf.d/reticora-tls.conf becomes the port-80 default server and
    # redirects all traffic to HTTPS; because both server blocks then share
    # port 80, the health-check endpoint below also lives in the TLS
    # template — so the healthcheck keeps working.
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Container health-check endpoint (docker-compose healthcheck): always
        # returns 200, even when the TLS configuration redirects all other
        # HTTP traffic to HTTPS (busybox wget cannot follow that redirect).
        location = /__reticora_http_status {
            return 200 "ok\n";
        }

        # ACME http-01 challenge directory shared with the certbot container
        # (compose volume certbot-webroot). Only present when the volume is
        # mounted; harmless otherwise.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # The backend service is called "server" in docker-compose.yml.
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
