# Reticora frontend — main nginx configuration.
#
# The container runs as the unprivileged nginx user (docker-compose sets
# `user: nginx`), so the stock nginx.conf cannot be used: it writes its pid
# to /run/nginx.pid and its temp directories under /var/cache/nginx, both of
# which are read-only for the nginx user (a tmpfs mounted there is owned by
# root). All writable paths therefore live under /tmp, which is backed by a
# tmpfs in docker-compose.
#
# This file replaces /etc/nginx/nginx.conf (see frontend/Dockerfile). It must
# be a complete main configuration — putting `pid` into a file under
# conf.d/ fails with '"pid" directive is not allowed here' and the container
# crash-loops ("docker-compose-frontend-1" is restarting).

pid /tmp/nginx.pid;
worker_processes auto;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    # Writable temp paths for the unprivileged nginx user (see above).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # The backend service is called "server" in docker-compose.yml.
            proxy_pass http://server:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
