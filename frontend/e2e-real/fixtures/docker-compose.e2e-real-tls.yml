# Compose overlay of the real-stack suite over a TLS origin (WP-646, F-375),
# applied by setup-real-stack.sh on top of docker-compose.e2e-real.yml when
# the installation has RETICORA_TLS_DOMAIN (frontend/e2e-real/fixtures/
# setup-tls-origin.sh). Test configuration only; the product files stay
# unchanged.
services:
  frontend:
    volumes:
      # The TLS template of the installation with X-Real-IP passed through
      # from the client, like nginx.conf in docker-compose.e2e-real.yml: the
      # server block on port 443 comes from this template. Generated by
      # setup-real-stack.sh; it replaces the template mount of
      # docker-compose.yml (same target).
      - '${E2E_NGINX_TLS_TEMPLATE:?E2E_NGINX_TLS_TEMPLATE must be set}:/etc/nginx/templates/reticora-tls.conf.template:ro'
