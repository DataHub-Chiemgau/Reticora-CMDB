# Compose overlay of the real-stack suite (WP-338), applied by
# setup-real-stack.sh on top of the installed stack and the onboarding overlay
# (frontend/e2e/fixtures/docker-compose.e2e.yml). Test configuration only; the
# product files stay unchanged.
services:
  server:
    environment:
      # The suite signs in and calls the API several hundred times within
      # minutes, like the local audit stack (audit/phase1-final/, section 8).
      RETICORA_RATE_LIMIT_RPM: '6000'
      RETICORA_RATE_LIMIT_ORG_RPM: '60000'
      RETICORA_PREAUTH_RATE_LIMIT_RPM: '600'

  frontend:
    volumes:
      # nginx.conf with X-Real-IP passed through from the client, so that each
      # tenant of a spec signs up from its own address (E-33 signup budget of
      # 5 per IP and hour). Generated by setup-real-stack.sh.
      - '${E2E_NGINX_CONF:?E2E_NGINX_CONF must be set}:/etc/nginx/nginx.conf:ro'
