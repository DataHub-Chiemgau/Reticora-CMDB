# Reticora frontend — shared proxy settings for the Keycloak locations.
#
# Copied into the image as /etc/nginx/reticora-keycloak-proxy.conf (see
# frontend/Dockerfile) and included by the /realms/ and /resources/ locations
# of both the plain-HTTP server (nginx.conf) and the TLS server
# (deploy/docker-compose/nginx-tls.conf.template).
#
# Keycloak runs with KC_PROXY=edge, so it builds all absolute URLs (login
# form actions, redirects, issuer) from the forwarded host and protocol.
# Passing them through is what makes the login screen work behind this proxy.

# $http_host (unlike $host) keeps a non-default port, so Keycloak builds its
# login form actions and redirects for the address the browser actually used
# — e.g. http://cmdb.example.com:3000 instead of http://cmdb.example.com.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;

# Keycloak sets several large cookies (KC_RESTART, AUTH_SESSION_ID); the
# default 4k/8k response header buffers overflow with "upstream sent too big
# header", which would surface as a blank 502 instead of the login screen.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
