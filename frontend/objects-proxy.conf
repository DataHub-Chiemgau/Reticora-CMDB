# Reticora frontend — signed downloads from the object store (EXP-01, F-376).
#
# Copied into the image as /etc/nginx/reticora-objects-proxy.conf (see
# frontend/Dockerfile) and included by the plain-HTTP server (nginx.conf) and
# the TLS server (deploy/docker-compose/nginx-tls.conf.template).
#
# The server signs download URLs of exports and documents for the internal
# endpoint minio:9000 but hands them out under <public base URL>/objects
# (RETICORA_S3_PUBLIC_URL): a browser cannot resolve "minio", and from an
# HTTPS page an http:// URL is mixed content. This location forwards only
# reads of the two download buckets, with the Host the signature covers;
# MinIO checks the signature and the expiry (15 minutes) and answers 403
# otherwise. Nothing else of the object store is reachable here.
location ~ ^/objects/(exports|reticora-documents)/ {
    limit_except GET {
        deny all;
    }
    rewrite ^/objects(/.*)$ $1 break;
    proxy_pass http://minio:9000;
    proxy_set_header Host minio:9000;
    # The signed query string is the only credential: no session cookie or
    # bearer token of the app reaches the object store.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_buffering off;
}
