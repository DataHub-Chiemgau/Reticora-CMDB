  /api/v1/notification-channels:
    get:
      operationId: listNotificationChannels
      tags: [Notifications]
      summary: Notification channels of the organization
      description: >-
        Requires notification:manage (RBA-02: org_admin only). Secrets
        (password, secret) are returned as `********`, the url of a webhook
        channel as scheme and host with masked path and query
        (`https://hooks.example.org/********`): path and query carry the
        token of an incoming webhook.
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  next_cursor:
                    type: string
                    description: Opaque signed cursor for the next page (API-02); absent on the last page.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createNotificationChannel
      tags: [Notifications]
      summary: Create a notification channel
      description: >-
        Requires notification:manage. The response is redacted like the
        list. The server of an own SMTP channel (provider smtp) is held to
        the egress policy (SEC-08): without RETICORA_EGRESS_ALLOW_PRIVATE=true
        an IP literal or name of a private, loopback, link-local or
        unique-local network and a port other than 25, 465 or 587 are
        refused with 422 (field host or port, the detail names the
        setting); cloud metadata endpoints (169.254.169.254, fd00:ec2::254)
        are refused in every mode. The address a name resolves to is checked
        again on every connection. central_smtp is the operator's server and
        exempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelRequest'
      responses:
        '201':
          description: Created channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/notification-channels/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getNotificationChannel
      tags: [Notifications]
      summary: Get a notification channel
      description: Requires notification:manage; redacted like the list.
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateNotificationChannel
      tags: [Notifications]
      summary: Update name, configuration or enabled flag
      description: >-
        Requires notification:manage. A configuration replaces the stored
        one; a secret sent back as `********` and a webhook url sent back as
        returned (masked) keep their value. A secret sent back as `********`
        while the configuration changes its destination (smtp: host, port,
        tls or username; webhook: url) is refused with 400 (field password
        or secret): it must be entered again. A configuration is held to the
        egress policy like on create (422, field host or port). Kind and
        provider cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationChannelRequest'
      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationChannel'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteNotificationChannel
      tags: [Notifications]
      summary: Delete a notification channel
      description: Requires notification:manage.
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      tags: [Notifications]
      summary: Latest notification deliveries with their status
      description: >-
        Requires notification:manage (RBA-02: org_admin only). A delivery
        shows recipients, category, subject, status, attempts and the last
        error, not its content (body, data): links and tokens such as an
        invitation link are not returned, URLs in subject and last error are
        masked like the url of a webhook channel.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  next_cursor:
                    type: string
                    description: Opaque signed cursor for the next page (API-02); absent on the last page.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

