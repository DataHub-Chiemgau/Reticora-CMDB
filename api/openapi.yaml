    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCisIdFields
      tags: [CIs]
      summary: List field provenance (discovered/override/effective) of a CI
      description: >-
        Per field the observed value with source and time, the manual
        override with author, reason and time, and the effective value: the
        override when there is one, otherwise the observed value (OVR-01).
        GET /cis/{id} and the CI list return the same effective values.
      responses:
        '200':
          description: Field provenance of the CI
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  next_cursor:
                    type: string
                    description: Opaque signed cursor for the next page (API-02); absent on the last page.
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FieldProvenance' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cis/{id}/fields/{name}/override:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: name, in: path, required: true, schema: { type: string }, description: CI column or attribute name }
    put:
      operationId: putCisIdFieldsNameOverride
      tags: [CIs]
      summary: Set a manual field override
      description: >-
        The CI takes the value at once; automation sources never overwrite it
        (REC-03). Structural columns (client_id, location_id, ci_type_id, ...)
        cannot be overridden. The override is a manual write (API-07): in the
        same transaction the CI version rises by one and the CI history
        records the change (change_type override; an attribute counts as the
        field attributes, as for PATCH), so a PATCH of the field with an
        older If-Match is refused with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetOverrideRequest' }
      responses:
        '200':
          description: Field provenance after the change
          headers:
            ETag:
              description: The new CI version (API-07); send it as If-Match with a PATCH of the CI.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldProvenance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The field cannot be overridden
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      operationId: deleteCisIdFieldsNameOverride
      tags: [CIs]
      summary: Clear a manual field override
      description: >-
        The CI returns to the current observed value, when there is one, in
        the same transaction; the change is audited. Clearing an override is
        a manual write (API-07): the CI version rises by one and the CI
        history records the change, as for PUT. A field without an override
        keeps the version.
      responses:
        '200':
          description: Field provenance after the change
          headers:
            ETag:
              description: The CI version after the change (API-07); send it as If-Match with a PATCH of the CI.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldProvenance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Unknown or invisible CI, or the CI has no value of the field
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

