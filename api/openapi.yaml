        created:
          type: integer
        updated:
          type: integer
        conflicts:
          type: integer
        queued:
          type: integer
          description: >-
            Records published to the ingest.> queue (REC-01); with NATS the
            records are processed asynchronously and the other counters stay 0.
        resurrected:
          type: integer
          description: >-
            Records matching a soft-deleted CI; they are held in a
            resurrected_device review instead of creating a CI (CI-13).
        duplicates:
          type: integer
          description: Records whose record_id was processed within the last 48 hours (REC-01).
        rejected_future:
          type: integer
          description: >-
            Records whose observed_at lies more than five minutes in the
            future; they are rejected and counted (GLO-12).
        unlicensed:
          type: integer
          description: >-
            New devices held as unlicensed_ci review items because max_cis is
            reached (ENT-03, CH21).
        job_id:
          type: string

