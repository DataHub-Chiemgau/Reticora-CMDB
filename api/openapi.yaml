components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Maximum number of items to return.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: |
        Number of items to skip before returning data. Ignored when `cursor` is
        supplied.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: |
        Opaque keyset cursor taken from `next_cursor` of the previous page.
        Cursors are bound to the sort order they were issued for; sending one
        with a different `sort_by`/`sort_dir` combination yields 400.
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Free-text search term.
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
      description: Sort field name.
    SortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction.
    CIStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/CIStatus'
    CITypeID:
      name: ci_type_id
      in: query
      schema:
        type: string
    ClientID:
      name: client_id
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: Upstream delivery failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: A required subsystem is not configured or temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    IGAObject:
      type: object
      additionalProperties: true
    IGAArray:
      type: array
      items:
        $ref: '#/components/schemas/IGAObject'
    IGAListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/IGAObject' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    SCIMResource:
      type: object
      additionalProperties: true
    SCIMListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items: { type: string }
        totalResults: { type: integer }
        startIndex: { type: integer }
        itemsPerPage: { type: integer }
        Resources:
          type: array
          items: { $ref: '#/components/schemas/SCIMResource' }
    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details object.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        trace_id:
          type: string

    PaginationEnvelope:
      type: object
      required: [total, limit, offset, has_more]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          description: |
            Opaque cursor for the next page. Absent when no further rows follow.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

