        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/collectors/enrollment-codes:
    post:
      operationId: createCollectorEnrollmentCode
      tags: [Collectors]
      summary: Mint a single-use collector enrollment code
      description: >-
        Zero-config onboarding: returns the plaintext code exactly once. Only
        its SHA-256 hash is stored. The collector redeems the code via
        /api/v1/collectors/enroll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                ttl_minutes:
                  type: integer
                  description: Validity in minutes; defaults to and is capped at 1440 (24 h, COL-04).
      responses:
        '201':
          description: Enrollment code created; plaintext returned once
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  code: { type: string }
                  label: { type: string }
                  expires_at: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/collectors/enroll:
    post:
      operationId: enrollCollector
      tags: [Collectors]
      summary: Enroll a collector with an enrollment code
      description: >-
        Unauthenticated by bearer design — the single-use enrollment code is
        the credential (valid 24 h, consumed exactly once). On success the
        collector identity is registered under the code's organization and
        returned with its id. With `csr` (PEM certificate signing request of
        the collector's locally generated key) the internal CA issues the
        collector's client certificate (CN = collector id, 90 days, COL-04).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                version: { type: string }
                client_id: { type: string }
                csr: { type: string, description: PEM certificate signing request }
      responses:
        '201':
          description: Collector enrolled (with `certificate` when a CSR was sent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Collector'
                  - type: object
                    properties:
                      certificate:
                        $ref: '#/components/schemas/CollectorCertificate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/collectors/pki:
    get:
      operationId: getCollectorPKI
      tags: [Collectors]
      summary: Trust bundle and revocation list of the collector certificates
      description: >-
        The trust bundle holds the active CA and, during a CA roll-over, the
        previous one (COL-04); the revocation list names the revoked
        certificates (disabled collectors, predecessors of renewed
        certificates) that have not expired. Collectors renew their
        certificate over their mTLS NATS channel
        (collector.<org>.<id>.certificate.renew), not over this API.
      responses:
        '200':
          description: Trust bundle and CRL (PEM)
          content:
            application/json:
              schema:
                type: object
                required: [ca_bundle_pem, crl_pem]
                properties:
                  ca_bundle_pem: { type: string }
                  crl_pem: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/collectors/{id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: collectorHeartbeat
      tags: [Collectors]
      summary: Record a collector heartbeat
      description: >-
        Updates the collector's last-heartbeat timestamp so the platform can
        track liveness. The optional body reports the offline spool state;
        losses and backpressure are logged for operators (NFR-04, COL-05).
        The response names the discovery license status; after valid_until
        the collector pauses (no scans, no spooling) until it is renewed
        (CH21, ENT-07).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorHeartbeatRequest'
      responses:
        '204':
          description: Heartbeat recorded
          headers:
            Reticora-License-Status:
              description: Discovery license status of the organization.
              schema:
                type: string
                enum: [active, expired]
            Reticora-Collector-Status:
              description: Status of the collector after the heartbeat (paused stops scanning).
              schema:
                type: string
                enum: [active, paused]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/collectors/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      operationId: updateCollector
      tags: [Collectors]
      summary: Rename, bind to a site, disable or enable a collector
      description: >-
        Requires collector:manage. The site decides the client (422 for a site
        of another client). status disabled refuses the collector's heartbeats;
        active enables a disabled collector again (offline until its next
        heartbeat).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectorPatch'
      responses:
        '200':
          description: Collector updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collector'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/discovery-scopes:
    get:
      operationId: listDiscoveryScopes
      tags: [Discovery]
      summary: List discovery scopes
      description: Requires discovery:read (DIS-09, API-05).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
        - name: collector_id
          in: query
          description: Only the scopes of this collector.
          schema:
            type: string
      responses:
        '200':
          description: Discovery scopes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryScopeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createDiscoveryScope
      tags: [Discovery]
      summary: Create a discovery scope
      description: >-
        Requires discovery:manage. A scope is a CIDR, host or address range
        (at most 65,536 addresses) that one collector discovers on a
        schedule (an interval of at least 5m or a five-field cron
        expression) with the given credentials and plugins. The site decides
        the client; without a site the collector's client and site apply.
        The collector receives its enabled scopes over its NATS channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryScopeInput'
      responses:
        '201':
          description: Scope created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryScope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/discovery-scopes/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getDiscoveryScope
      tags: [Discovery]
      summary: Get a discovery scope
      description: Requires discovery:read.
      responses:
        '200':
          description: Discovery scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryScope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDiscoveryScope
      tags: [Discovery]
      summary: Change a discovery scope
      description: Requires discovery:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryScopePatch'
      responses:
        '200':
          description: Scope updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryScope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteDiscoveryScope
      tags: [Discovery]
      summary: Delete a discovery scope
      description: Requires discovery:manage.
      responses:
        '204':
          description: Scope deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ingest/bulk:
    post:
      operationId: bulkIngest
      tags: [Discovery]
      summary: Ingest discovery results in bulk
      description: >-
        Reconciles a batch of discovered items against existing CIs, creating,
        updating or queueing them for manual review. This is the canonical
        endpoint that `/api/v1/discovery/ingest` aliases. Both require the
        discovery feature; after the discovery license expired they answer
        403 with the problem type license-expired (CH21). While the ingest
        queue (NATS) is unreachable both answer 503 at once and queue
        nothing, not even after the reconnect (OPS-06, WP-449); records of
        the batch queued before a failure are deduplicated by record_id when
        the batch is sent again.
      parameters:
        - name: Content-Encoding
          in: header
          description: Collectors send the body gzip-compressed.
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        description: >-
          A DeviceRecord batch (DIS-05, normative schema
          api/devicerecord.schema.json). The collector_id/items request is
          deprecated and answered with a Deprecation header.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DeviceRecordBatch'
                - $ref: '#/components/schemas/DiscoveryIngestRequest'
      responses:
        '202':
          description: Discovery payload accepted
          headers:
            Deprecation:
              description: Set (RFC 9745) when the deprecated collector_id/items request was used.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Decompressed body larger than 64 MiB
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: A record breaks the DeviceRecord contract; the detail names each field (records[i].field)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/credentials:
    get:
      operationId: listCredentials
      tags: [Credentials]
      summary: List credential metadata
      description: >-
        Returns credential metadata (never the secret material) for the
        authenticated tenant. The organization is derived from the session and
        cannot be supplied by the client.
      responses:
        '200':
          description: Credential metadata list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCredential
      tags: [Credentials]
      summary: Create an encrypted credential
      description: >-
        Stores a credential whose secret is envelope-encrypted at rest. The
        owning organization is derived from the authenticated tenant; any
        `organization_id` in the request body is ignored. A missing or
        unknown `kind` is answered with 422 (`field` = `kind`); `nas` is the
        account of the NAS plugin (Synology DSM: username and password).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        '201':
          description: Credential created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getCredential
      tags: [Credentials]
      summary: Get credential metadata
      description: >-
        Returns credential metadata (never the secret material) for the
        authenticated tenant.
      responses:
        '200':
          description: Credential metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      operationId: deleteCredential
      tags: [Credentials]
      summary: Delete a credential
      responses:
        '204':
          description: Credential deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/credentials/rotate-keys:
    post:
      operationId: rotateCredentialKeys
      tags: [Credentials]
      summary: Rotate the tenant data-encryption key (DEK)
      description: >-
        Generates a fresh per-organization DEK, re-encrypts every stored
        credential ciphertext with it and atomically bumps the key version.
        Plaintext secrets never leave the platform. Regular rotation limits
        the blast radius of a key compromise (ISO 27001 A.10.1.2, NIS2
        cryptographic-controls requirement). Requires credential:manage.
      responses:
        '200':
          description: Rotation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_version:
                    type: integer
                  rotated:
                    type: integer
                    description: Number of credential ciphertexts re-encrypted
                  pii_subjects:
                    type: integer
                    description: Number of PII vault entries re-encrypted with the new data key (SEC-05)
                required: [key_version, rotated]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/documents/{id}/content:
    x-phase: P2
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    put:
      operationId: uploadDocumentContent
      tags: [Documents]
      summary: Upload the binary content of a document
      description: >
        Stores the request body as the document's object in blob storage.
        The Content-Type header is validated against a whitelist of common
        office and image formats; the body is limited to 25 MiB. A principal
        restricted to some clients or sites uploads only to documents whose
        links it sees completely; other documents answer 404 before anything
        is stored (TEN-05, E-09).
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Content stored; returns the updated document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Payload too large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          description: Unsupported media type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: Blob storage is not configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    get:
      operationId: downloadDocumentContent
      tags: [Documents]
      summary: Get a time-limited download URL for the document content
      responses:
        '200':
          description: Presigned download URL (15 minute TTL)
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    format: uri
                required: [download_url]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Blob storage is not configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/documents/{id}/links:
    x-phase: P2
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getDocumentLinks
      tags: [Documents]
      summary: List entities linked to a document
      responses:
        '200':
          description: Document links
          content:
