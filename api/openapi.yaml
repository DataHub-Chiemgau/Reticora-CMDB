    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: resolveReviewItem
      tags: [Reviews]
      summary: Resolve a review item
      description: >-
        Requires review:resolve. The actions per type (REC-08):
        unclassified_device new|dismiss; ambiguous_identity merge|new|dismiss;
        conflicting_values accept|dismiss; probable_duplicate merge|dismiss
        (merge removes the new CI); override_conflict accept|dismiss (accept
        removes the override and the CI takes the observed value; dismiss
        keeps the override and suppresses the value until the source reports
        another); conflicting_values accept applies the reported serial
        number or hardware UUID kept in payload.incoming;
        resurrected_device merge|new|dismiss (merge reactivates the deleted
        CI); new of unclassified_device, ambiguous_identity and
        resurrected_device creates the CI as the ingest of the device kept
        in the payload would, with the client and site of the item (CI-13),
        and 422 when the item records no client and its candidate CIs share
        none (dismiss it and wait for the next sighting); unlicensed_ci new|dismiss (new adopts the device within max_cis,
        403 entitlement-limit otherwise); scope_suggested accept|dismiss (accept creates the scope; both also need discovery:manage, 403 otherwise, the item stays open); unknown_relationship accept|dismiss (accept records the neighbor as connected_to);
        serial_mismatch and duplicate_ip dismiss. Another action is 422.
        resolved_by and the audit actor are the caller; a body with
        resolved_by is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewItemResolveRequest'
      responses:
        '200':
          description: The resolved review item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The action does not resolve items of this type, or new cannot tell the client of the device
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

