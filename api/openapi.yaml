  /api/v1/role-assignments:
    get:
      operationId: listRoleAssignments
      tags: [Roles]
      summary: List the role assignments of a user (API-05)
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Role assignments of the user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleAssignment'
                  next_cursor:
                    type: string
                    description: Always absent; the assignments of a user are returned in full.
                  total: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createRoleAssignment
      tags: [Roles]
      summary: Assign a role to a user (API-05)
      description: >-
        The user and the role must belong to the organization, and a team
        scope must name a team of the organization (404 otherwise). A client
        or site scope must name a client or site of the organization in
        scope_id, an organization-wide assignment names none (422 field
        scope_id otherwise; a scope is never widened to the organization). A
        client role (scope client) is assigned with scope_type client only, a
        site role with scope_type site only, an organization role or custom
        role with any scope_type (422 field scope_type otherwise, F-305).
        Grant ceiling (RBA-03, F-015): the caller must hold role:manage and
        every permission of the standard or custom role in a scope covering
        the assignment's scope (a client covers its sites, site.client_id; a
        team scope needs the clients and sites of the whole organization and
        that team); otherwise 403 and nothing is stored, before any MFA
        binding. Assigning a standard role again in the same scope stores no
        second assignment and answers with the existing one. Assigning the
        standard role org_admin binds the IdP
        account of the user to MFA (Keycloak realm role mfa_required,
        AUT-09) before the assignment is stored; a user without IdP account
        yet is bound at the first login. When the binding fails (no Keycloak
        admin client, admin API refused or unreachable), nothing is assigned
        and the answer is 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '201':
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/role-assignments/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    delete:
      operationId: revokeRoleAssignment
      tags: [Roles]
      summary: Revoke a role assignment (API-05, AUT-02)
      description: >-
        Removes a standard or custom role assignment of the organization (the
        id of GET /api/v1/role-assignments). Grant ceiling (RBA-03, F-017):
        the caller must hold role:manage and every permission of the role in
        a scope covering the assignment's scope, the rule of POST
        /api/v1/role-assignments; otherwise 403 and the assignment stays. An
        unknown id or an assignment of another organization is 404. The
        assignment is removed and the audit entry role_assignment.revoked
        (caller, table, user, role, scope) is written in one transaction. The
        user loses the rights at the next token refresh or sign-in (AUT-02);
        an access token issued before keeps them until it expires. Revoking
        org_admin leaves the MFA binding of the IdP account (Keycloak realm
        role mfa_required) in place. Roles from IdP groups are revoked in the
        IdP, not here.
      responses:
        '204':
          description: Role assignment revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/roles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRole
      tags: [Roles]
      summary: Get a custom role
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRole
      tags: [Roles]
      summary: Update a custom role
      description: >-
        The role applies to all its assignments, org-wide ones too:
        permissions the request adds must be held by the caller
        organization-wide (RBA-03, F-015); otherwise 403 and the role stays
        unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A role of this name exists already.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    delete:
      operationId: deleteRole
      tags: [Roles]
      summary: Delete a custom role
      responses:
        '204':
          description: Role deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}/data-export:
    parameters:
