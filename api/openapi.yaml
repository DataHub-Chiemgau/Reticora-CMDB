components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OperatorAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Operator session from POST /api/v1/admin/auth/callback (SEC-07).
    BreakGlassAuth:
      type: apiKey
      in: header
      name: X-Operator-Token
      description: RETICORA_OPERATOR_TOKEN, bootstrap and break-glass only; every use raises an alarm.

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Maximum number of items to return.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: |
        Number of items to skip before returning data. Ignored when `cursor` is
        supplied.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: |
        Opaque keyset cursor taken from `next_cursor` of the previous page.
        Cursors are bound to the sort order they were issued for; sending one
        with a different `sort_by`/`sort_dir` combination yields 400.
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Free-text search term.
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
      description: Sort field name.
    SortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction.
    CIStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/CIStatus'
    CITypeID:
      name: ci_type_id
      in: query
      schema:
        type: string
    ClientID:
      name: client_id
      in: query
      schema:
        type: string
    SiteID:
      name: site_id
      in: query
      schema:
        type: string
    RoomID:
      name: room_id
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: A field value is outside its allowed range; `field` names it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: Upstream delivery failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: The pre-auth budget of the client IP is spent (AUT-10)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: A required subsystem is not configured or temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    LocationInUse:
      description: The location or its subtree is still referenced; dependencies lists the kinds of referencing objects
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DependencyProblem'
    LocationViolation:
      description: The request violates the parent matrix or a field rule; violations name the field
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ViolationProblem'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    AttributeDefinition:
      type: object
      required: [id, scope, key, display_name, data_type, required, multi_value, searchable, unique, unique_scope, inheritable, order, is_system, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string, description: Empty for system definitions. }
        ci_type_id: { type: string, description: Empty for global definitions. }
        scope: { type: string, enum: [type, global] }
        key: { type: string }
        display_name:
          $ref: '#/components/schemas/LocalizedText'
        description: { type: string }
        data_type: { type: string }
        required: { type: boolean }
        default: {}
        enum_values:
          type: array
          items: { type: string }
        multi_value: { type: boolean }
        searchable:
          type: boolean
          description: >-
            Indexed for search: an `attribute.index` job builds
            `idx_attr_<id>` concurrently (DB-04).
        unique:
          type: boolean
          description: >-
            The value is unique among the active CIs (MET-15), enforced by the
            server and the unique index `idx_attr_<id>_u`; soft-deleted CIs do
            not count.
        unique_scope:
          type: string
          enum: [org, client]
          description: Unique per organization or per client (CIs without a client count as one client).
        inheritable: { type: boolean }
        validation: { type: object, additionalProperties: true }
        conditional: { type: object, additionalProperties: true }
        reference_target: { type: string }
        group: { type: string }
        order: { type: integer }
        unit: { type: string }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttributeDefinitionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    AttributeDefinitionCreate:
      type: object
      required: [key, data_type]
      additionalProperties: false
      properties:
        ci_type_id: { type: string, description: Omitted for a global definition. }
        key: { type: string, minLength: 1, maxLength: 100 }
        display_name:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: string
        description: { type: string }
        data_type: { type: string, description: 'Data type of MET-11 — phase 1: text, multiline, integer, decimal, boolean, date, datetime, enum, multiselect, ip, mac, url, email, uuid; phase 2: file, json, reference (former names textarea, multi_enum and the specific reference types stay valid).' }
        required: { type: boolean }
        default: { description: Any JSON value valid for the data type. }
        enum_values:
          type: array
          items: { type: string }
        multi_value: { type: boolean }
        searchable: { type: boolean }
        unique: { type: boolean }
        unique_scope: { type: string, enum: [org, client] }
        inheritable: { type: boolean }
        validation: { type: object, additionalProperties: true }
        conditional: { type: object, additionalProperties: true }
        reference_target: { type: string }
        group: { type: string }
        order: { type: integer }
        unit: { type: string }
    AttributeDefinitionPatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: string
        description: { type: string }
        data_type: { type: string, description: 'Data type of MET-11 — phase 1: text, multiline, integer, decimal, boolean, date, datetime, enum, multiselect, ip, mac, url, email, uuid; phase 2: file, json, reference (former names textarea, multi_enum and the specific reference types stay valid).' }
        required: { type: boolean }
        default: { description: Any JSON value valid for the data type. }
        enum_values:
          type: array
          items: { type: string }
        multi_value: { type: boolean }
        searchable: { type: boolean }
        unique: { type: boolean }
        unique_scope: { type: string, enum: [org, client] }
        inheritable: { type: boolean }
        validation: { type: object, additionalProperties: true }
        conditional: { type: object, additionalProperties: true }
        reference_target: { type: string }
        group: { type: string }
        order: { type: integer }
        unit: { type: string }
    LocalizedText:
      type: object
      description: A label per language (MET-01).
      additionalProperties: false
      minProperties: 1
      properties:
        de: { type: string, minLength: 1, maxLength: 200 }
        en: { type: string, minLength: 1, maxLength: 200 }
    NotificationRecipient:
      type: object
      properties:
        user_id: {type: string}
        email: {type: string}
        name: {type: string}

    InAppNotification:
      type: object
      required: [id, organization_id, user_id, category, subject, body, created_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        user_id: {type: string}
        category: {type: string}
        subject: {type: string}
        body: {type: string}
        data:
          type: object
          additionalProperties: true
        created_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time}

    InAppNotificationListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InAppNotification'

    NotificationPreference:
      type: object
      required: [time_zone, muted_categories]
      properties:
        quiet_start: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Start of the quiet hours (HH:MM).}
        quiet_end: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: End of the quiet hours; may be on the next day.}
        time_zone: {type: string, example: Europe/Berlin}
        muted_categories:
          type: array
          items: {type: string}

    NotificationChannel:
      type: object
      required: [id, organization_id, name, kind, provider, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        kind:
          type: string
          enum: [email, inapp, webhook, sms, pager]
        provider:
          type: string
          enum: [central_smtp, smtp, inapp, webhook]
        config:
          type: object
          additionalProperties: true
          description: >-
            central_smtp: sender_name, reply_to; smtp: host, port, tls
            (starttls|tls|none), username, password, from; webhook: url,
            secret. Secrets are returned as `********`.
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    NotificationChannelRequest:
      type: object
      properties:
        name: {type: string}
        kind:
          type: string
          enum: [email, inapp, webhook]
        provider:
          type: string
          enum: [central_smtp, smtp, inapp, webhook]
        config:
          type: object
          additionalProperties: true
        enabled: {type: boolean}

    NotificationDelivery:
      type: object
      required: [id, organization_id, channel_id, recipient, category, critical, subject, body, status, attempts, max_attempts, next_attempt_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        channel_id: {type: string}
        recipient:
          $ref: '#/components/schemas/NotificationRecipient'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRecipient'
        category: {type: string}
        critical: {type: boolean}
        subject: {type: string}
        body: {type: string}
        data:
          type: object
          additionalProperties: true
        dedup_key: {type: string}
        status:
          type: string
          enum: [pending, sending, sent, failed, suppressed]
        attempts: {type: integer}
        max_attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_error: {type: string}
        provider_id: {type: string}
        sent_at: {type: string, format: date-time}

    MetamodelExport:
      type: object
      required: [format_version, exported_at, organization_id, ci_types, attribute_definitions]
      properties:
        format_version:
          type: integer
          enum: [1]
        exported_at:
          type: string
          format: date-time
        organization_id:
          type: string
        ci_types:
          type: array
          items:
            $ref: '#/components/schemas/CIType'
        attribute_definitions:
          type: array
          description: Global attribute definitions of the organization and the system.
          items:
            $ref: '#/components/schemas/AttributeDefinition'

    CIType:
      type: object
      required: [id, key, name, display_name, is_builtin, is_system, is_active, is_logical, is_observable, schema_version, version, capabilities, allowed_relationship_types, ui_schema, compliance_rules, discovery_mappings, created_at, updated_at]
