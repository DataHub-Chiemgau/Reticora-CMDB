  /api/v1/users/{id}/anonymize:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: anonymizeUser
      tags: [Users, Privacy]
      summary: Anonymize a user (GDPR Art. 17, right to erasure)
      description: >
        Replaces all personal data (e-mail, display name, avatar, external
        ID) with non-identifying surrogate values and disables the account.
        The row itself and audit history are kept so referential integrity
        and the audit chain survive. Requires user:manage. Like a
        deactivation (TLC-04), it revokes the user's sessions and refresh
        cookies and every active API key the user created for themself, in
        the same transaction and only for a user of the caller's
        organization. Keys the user created for service accounts stay valid
        (decision E-64, option 2): the audit entry lists them (id, prefix,
        name, service account; never the secret), and the org_admins of the
        organization receive a notification to rotate them; an unknown user or a user of another organization
        answers 404 without any effect. If the sessions cannot be revoked,
        nothing is changed and the answer is 503. The caller cannot
        anonymize their own account (400).
      responses:
        '200':
          description: User anonymized; returns the updated record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

