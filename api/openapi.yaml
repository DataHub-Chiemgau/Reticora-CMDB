  /api/v1/audit/verify:
    post:
      operationId: verifyAuditChainLegacy
      deprecated: true
      x-deprecated-at: '2026-10-13'
      x-sunset: '2027-10-14'
      x-successor: '/api/v1/audit-log/verify'
      tags: [Audit]
      summary: Verify the audit hash chain
      description: >-
        Walks the organization's audit chain in `seq` order and reports the
        first violation (AUD-04): a gap in the sequence, a broken
        `previous_hash` link (the first entry links to 32 zero bytes) or a
        hash that does not match SHA-256(previous_hash || SHA-256(canonical
        JSON)) of the stored entry.
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/audit-log/verify:
    post:
      operationId: verifyAuditChain
      tags: [Audit]
      summary: Verify the audit hash chain
      description: >-
        Walks the organization's audit chain in `seq` order and reports the
        first violation (AUD-04): a gap in the sequence, a broken
        `previous_hash` link (the first entry links to 32 zero bytes) or a
        hash that does not match SHA-256(previous_hash || SHA-256(canonical
        JSON)) of the stored entry.
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/privacy/retention:
    get:
      operationId: getRetentionPolicy
      tags: [Privacy]
      summary: Get the tenant data-retention policy (DSGVO Art. 5)
      description: >-
        Returns the configured retention policy for personal data. The policy
        defines after how many days personal records (contacts, deactivated
        user accounts) expire and whether the erasure workflow anonymizes or
        deletes them. Requires user:manage.
      responses:
        '200':
          description: Retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putRetentionPolicy
      tags: [Privacy]
      summary: Configure the tenant data-retention policy
      description: >-
        Creates or updates the retention policy. `retention_days = 0` keeps
        data forever (no erasure); a value outside 0..2147483647 is a 400
        field error. `mode` selects whether expired records are
        anonymized (default; rows stay for referential integrity) or deleted.
        Requires user:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retention_days: { type: integer, minimum: 0, maximum: 2147483647 }
                mode: { type: string, enum: [anonymize, delete] }
      responses:
        '200':
          description: Updated retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/privacy/erasure:
    post:
      operationId: runErasureWorkflow
      tags: [Privacy]
      summary: Run the data-erasure workflow (DSGVO Art. 17)
      description: >-
        Enforces the configured retention policy: contact records and
        deactivated user accounts whose last update predates the retention
        window are anonymized (default) or deleted. Running the workflow
        requires an explicitly configured policy, so a tenant can never purge
        data by accident. Requires user:manage.
      responses:
        '200':
          description: Erasure summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/relationships:
    get:
      operationId: listRelationships
      tags: [Relationships]
      summary: List relationships
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
        - name: ci_id
          in: query
          schema:
            type: string
          description: Return relationships where the CI is either the source or target.
        - name: source_ci_id
          in: query
          schema:
            type: string
        - name: target_ci_id
          in: query
          schema:
            type: string
        - name: rel_type
          in: query
          schema:
            $ref: '#/components/schemas/RelationshipType'
      responses:
        '200':
          description: Paginated list of relationships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createRelationship
      tags: [Relationships]
      summary: Create a relationship
      description: >-
        contains, contained_by, parent_of, child_of, mounted_in and located_in
        are projected and cannot be stored (422, REL-01, CH27): containment is
        the CI's parent_ci_id, mounted_in follows from the rack mount,
        located_in from the CI's location. A principal restricted to some
        clients or sites may connect its own CI with a visible org-wide CI
        (client or site NULL); the edge carries the client and site of the own
        endpoint and is visible only there. An edge between two org-wide CIs
        is reserved to org-wide principals (403, E-09, E-62).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationshipRequest'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            The edge exists already (the same source, target, type and
            interfaces), e.g. a repeated create
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            The source or target CI is not visible to the caller: a CI of
            another organization, of a client or site outside the scope, or
            an unknown ID. `violations` names source_ci_id, target_ci_id or
            both ("source CI not found", "target CI not found"), the same
            answer for a foreign and an unknown CI; nothing is stored (F-145).
            Without violations: a structural relationship type, which is
            projected and cannot be stored, or an interface of another CI.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ViolationProblem' }
                  - { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/relationships/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    patch:
      operationId: updateRelationship
      tags: [Relationships]
      summary: Edit or verify a relationship
      description: >-
        Updates the provenance and verification metadata of an existing
        relationship. The edge endpoints and rel_type are immutable; rewiring is
        expressed by deleting and recreating the relationship so the graph
        history stays truthful.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRelationshipRequest'
      responses:
        '200':
          description: Updated relationship
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteRelationship
      tags: [Relationships]
      summary: Delete a relationship
      description: >-
        Manual and other edges are deleted as asked. A discovery edge is
        deleted only with force=true (409 otherwise) and is then recorded as
        suppression for its CIs and type, so discovery does not recreate it
        (REL-03, REL-04). Discovery never changes or removes manual edges
        (REL-05).
      parameters:
        - name: force
          in: query
          description: Required to delete a discovery edge; creates its suppression.
          schema:
            type: boolean
      responses:
        '204':
          description: Relationship deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhook subscriptions
      description: >-
        Lists the subscriptions in the caller's scope (TEN-09, E-98): those
        whose creator's client, site and team scope lies in the caller's
        scope. Subscriptions created before this rule apply to the whole
        organization and are listed for callers without client, site and
        team restriction only. Every route with a subscription id answers
        404 for a subscription outside the caller's scope.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
        - name: event
          in: query
          schema:
            $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Paginated list of webhook subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook subscription
      description: >-
        The subscription takes the client, site and team scope of its
        creator (TEN-09, E-98): only callers whose scope covers it see and
        manage it, and it receives only events whose objects lie in that
        scope; events of unknown scope and events about objects of the whole
        organization reach subscriptions of creators without restriction
        only. A service account in `service_account_id` must be visible to
        the creator (422 otherwise); the subscription then receives only the
        events both the creator's scope and the account's read rights cover.
        invitation.created is delivered without its link: the acceptance
        token reaches the invitee by mail only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Get a webhook subscription
      responses:
        '200':
          description: Webhook subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook subscription
      responses:
        '204':
          description: Webhook subscription deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/{id}/rotate-secret:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: >-
        A new secret (generated, or the one given) replaces the current one;
        for 24 hours deliveries are signed with both
        (X-Webhook-Signature, X-Webhook-Signature-Previous), so the receiver
        can switch without losing deliveries (SEC-06). The new secret is
        returned only here.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                secret: {type: string, minLength: 16}
      responses:
        '200':
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                required: [id, secret, previous_secret_expires_at]
                properties:
                  id: {type: string}
                  secret: {type: string}
                  previous_secret_expires_at: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Send a test delivery to a webhook subscription
      description: >-
        Sends a single signed `webhook.test` payload to the subscription URL and
        returns the delivery attempt. The endpoint responds with 200 even when the
        receiver rejected the request; inspect `success` and `status_code`.
      responses:
        '200':
          description: Test delivery attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List the durable delivery history of a webhook subscription
      description: >-
        Returns the persisted deliveries including their retry state
        (WHK-01): pending, delivering, delivered, failed (a retry is
        scheduled) and dead. Failed deliveries are retried after 30 s, 2 min,
        10 min, 60 min and 360 min, then they are dead; the third dead
        delivery within 24 hours deactivates the subscription and notifies
        the webhook managers.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Delivery history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/webhooks/{id}/deliveries/{delivery_id}/retry:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - name: delivery_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryWebhookDelivery
      tags: [Webhooks]
      summary: Retry a failed or dead delivery
      description: >-
        Queues the delivery again with a fresh retry budget (WHK-01); a dead
        delivery leaves the dead-letter queue. The retry worker sends it with
        its next poll. A pending, delivering or delivered delivery is 409.
        Requires webhook:manage.
      responses:
        '202':
          description: The queued delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/webhooks/dead-letters:
    get:
      operationId: listWebhookDeadLetters
      tags: [Webhooks]
      summary: List the webhook dead-letter queue
      description: >-
        Returns deliveries that exhausted their retry budget and were moved to
        the dead-letter queue, newest first: those of the subscriptions in the
        caller's scope (E-98). Operators inspect this queue to find
        permanently failed deliveries and replay them.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Dead-letter queue entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeadLetterListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/discovery/ingest:
    post:
      operationId: ingestDiscoveryData
      tags: [Discovery]
      summary: Ingest discovery results in bulk
      parameters:
        - name: Content-Encoding
          in: header
          description: Collectors send the body gzip-compressed.
          schema:
            type: string
            enum: [gzip]
      requestBody:
        required: true
        description: >-
          A DeviceRecord batch (DIS-05, normative schema
          api/devicerecord.schema.json). The collector_id/items request is
          deprecated and answered with a Deprecation header.
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DeviceRecordBatch'
                - $ref: '#/components/schemas/DiscoveryIngestRequest'
      responses:
        '202':
          description: Discovery payload accepted
          headers:
            Deprecation:
              description: Set (RFC 9745) when the deprecated collector_id/items request was used.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Decompressed body larger than 64 MiB
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: A record breaks the DeviceRecord contract; the detail names each field (records[i].field)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/discovery/jobs:
