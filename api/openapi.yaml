      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getCINeighbors
      tags: [Topology]
      summary: Get the immediate topology neighbors of a CI
      responses:
        '200':
          description: Neighbor subgraph (depth 1) centered on the CI
          content:
