  /api/v1/topology:
    get:
      operationId: getTopology
      tags: [Topology]
      summary: Get the CI topology graph for the tenant
      parameters:
        - name: client_id
          in: query
          schema:
            type: string
        - name: site_id
          in: query
          schema:
            type: string
        - name: ci_type
          in: query
          description: CI type id (ci.ci_type_id) to filter by.
          schema:
            type: string
        - name: root_ci_id
          in: query
          description: >-
            When set, returns a subgraph reachable from this CI (a UUID). A
            CI the caller does not see is 404.
          schema:
            type: string
        - name: depth
          in: query
          description: Traversal depth from root_ci_id (default 2, max 20).
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: Topology graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopologyGraph'
        '400':
          description: >-
            root_ci_id, client_id, site_id or ci_type is no UUID (for
            root_ci_id with field root_ci_id).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          description: >-
            root_ci_id names no CI the caller sees: an unknown or deleted CI,
            a CI of another organization or of a client or site outside the
            scope. The answer is the same in each case ("ci not found") and
            does not name the CI (F-161).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            Without root_ci_id the filtered topology holds more than 2,000
            CIs (IMP-06); narrow it with site_id, client_id or ci_type (a CI
            type id) or set root_ci_id.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

