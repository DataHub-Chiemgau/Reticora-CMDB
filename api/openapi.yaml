    WebhookEvent:
      type: string
      enum: [ci.created, ci.updated, ci.deleted, ci.status_changed, relationship.created, relationship.deleted, discovery.completed]

    WebhookSubscription:
      type: object
      required: [id, organization_id, name, url, events, is_active, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        is_active:
          type: boolean
        headers:
          type: object
          description: >-
            Custom request headers. Values are write-only: responses return
            each header name with the value "***" (SEC-01).
          additionalProperties:
            type: string
        previous_secret_expires_at:
          type: string
          format: date-time
          description: Until when the previous secret still signs after a rotation (SEC-06).
        service_account_id:
          type: string
          description: >-
            Binds the subscription to a service account (RBA-08): it then
            receives only events whose objects the account may read; every
            CI or asset an event references must be readable, objects without
            client or site count as readable like under RLS. An event whose
            scope cannot be determined reaches the subscription only when the
            account reads org-wide.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [name, url, secret, events]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
          writeOnly: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        headers:
          type: object
          additionalProperties:
            type: string
        service_account_id:
          type: string
          description: >-
            Binds the subscription to a service account (RBA-08): it then
            receives only events whose objects the account may read; every
            CI or asset an event references must be readable, objects without
            client or site count as readable like under RLS. An event whose
            scope cannot be determined reaches the subscription only when the
            account reads org-wide. The account must be visible to the
            creator (422 otherwise), and the scope of the creator still
            applies: the binding never widens it (E-98).

