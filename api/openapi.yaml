  /api/v1/review-items:
    get:
      operationId: listReviewItems
      tags: [Reviews]
      summary: List review items
      description: >-
        The review queue of reconciliation (REC-08). Items open longer than
        14 days carry escalated = true; escalated=true lists only those (the
        dashboard's escalation).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, dismissed]
        - name: kind
          in: query
          schema:
            type: string
            enum: [unclassified_device, ambiguous_identity, conflicting_values, probable_duplicate, override_conflict, resurrected_device, unlicensed_ci, scope_suggested, serial_mismatch, duplicate_ip]
        - name: escalated
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of review items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItemListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/review-items/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getReviewItem
      tags: [Reviews]
      summary: Get a review item
      responses:
        '200':
          description: The review item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/review-items/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: resolveReviewItem
      tags: [Reviews]
      summary: Resolve a review item
      description: >-
        Requires review:resolve. The actions per type (REC-08):
        unclassified_device new|dismiss; ambiguous_identity merge|new|dismiss;
        conflicting_values accept|dismiss; probable_duplicate merge|dismiss
        (merge removes the new CI); override_conflict accept|dismiss (accept
        removes the override and the CI takes the observed value; dismiss
        keeps the override and suppresses the value until the source reports
        another); conflicting_values accept applies the reported serial
        number or hardware UUID kept in payload.incoming;
        resurrected_device merge|new|dismiss (merge reactivates the deleted
        CI); unlicensed_ci new|dismiss (new adopts the device within max_cis,
        403 entitlement-limit otherwise); scope_suggested accept|dismiss;
        serial_mismatch and duplicate_ip dismiss. Another action is 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewItemResolveRequest'
      responses:
        '200':
          description: The resolved review item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The action does not resolve items of this type
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

