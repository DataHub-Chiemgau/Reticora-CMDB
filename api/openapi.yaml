openapi: 3.1.0
info:
  title: Reticora CMDB API
  version: 1.0.0
  description: |
    Multi-tenant Configuration Management Database API for MSPs and ISPs.
    Endpoints require tenant-scoped authentication unless explicitly marked otherwise.
  contact:
    name: DataHub Chiemgau
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Auth
    description: Authentication and session endpoints
  - name: CIs
    description: Configuration item management
  - name: Relationships
    description: CI relationship management
  - name: Webhooks
    description: Webhook subscription management
  - name: Discovery
    description: Discovery ingest and job tracking
  - name: Reviews
    description: Review queue of reconciliation (REC-08)
  - name: Collectors
    description: Customer-deployed discovery collector management
  - name: Credentials
    description: Envelope-encrypted credential management
  - name: Export
    description: Data export operations
  - name: Entitlements
    description: Subscription features and usage
  - name: Assets
    description: Asset inventory management
  - name: Assignments
    description: Asset and CI assignment workflows
  - name: Documents
    description: Document metadata management
  - name: Stocktake
    description: Inventory stocktake operations
  - name: Tickets
    description: Ticket and comment management
  - name: Users
    description: User management
  - name: Teams
    description: Team and membership management
  - name: Roles
    description: Custom role and role assignment management
  - name: Permissions
    description: Permission catalogue and effective access
  - name: SLA
    description: Service-level policies and ticket clocks
  - name: Forms
    description: JSON-Schema based form definitions and submissions
  - name: Workflows
    description: Workflow definitions, runs and approvals
  - name: Compliance
    description: Compliance rules, evaluations and scores
  - name: Audit
    description: Hash-chained audit trail
  - name: Privacy
    description: DSGVO/GDPR data lifecycle (retention policy, erasure workflow)
  - name: Monitoring
    description: Metrics and alert rules
  - name: GraphQL
    description: GraphQL backend-for-frontend endpoint
  - name: IGA
    description: Identity governance, active provisioning and access reviews
  - name: SCIM
    description: SCIM 2.0 service provider endpoints
  - name: Search
    description: Tenant-scoped full-text search
  - name: AI
    description: Governed LLM/RAG assistant
  - name: Locations
    description: Canonical location tree (sites, buildings, rooms, racks, warehouses, zones, shelves, bins)

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      security: []
      summary: Readiness check
      description: >-
        Checks the configured dependencies (database with required
        extensions, Redis, object storage, NATS) with a timeout per check.
        Liveness stays on /healthz. Failing checks are only named; the cause
        is logged by the server.
      responses:
        '200':
          description: All dependencies are usable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/admin/auth/callback:
    post:
      operationId: operatorLogin
      tags: [Operator]
      security: []
      summary: Operator login (SEC-07)
      description: |
        Exchanges an OIDC authorization code (PKCE) for a 15-minute operator
        session. Only members of the operator group (RETICORA_OPERATOR_GROUP,
        default "operators") who logged in with a second factor (amr, or acr
        in RETICORA_OPERATOR_MFA_ACR) get one. Every attempt is recorded in
        operator_audit. Operator sessions are refused by the tenant API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: Operator session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/me:
    get:
      operationId: getOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: The authenticated operator
      responses:
        '200':
          description: Operator identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/orgs:
    get:
      operationId: listOrganizationsAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: List every organization
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOrgListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createOrganizationAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: Create an organization with plan and limits (TLC-02)
      description: >-
        Runs the creation chain of the self-signup without verification: the
        organization with its slug (derived from the name unless given), the
        default VRF and standard roles, the first user as org_admin, and the
        entitlements of the plan (source manual) with the given limits in
        the limits of their feature. With an IdP admin client the first
        org_admin receives an account and the IdP's mail to set a password
        (`admin_invited`). The creation and its `org.create` entry in
        operator_audit are atomic. Reseller creation is phase 4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorCreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCreatedOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/orgs/{id}/entitlements:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listOrganizationEntitlementsAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: List the entitlements of an organization
      responses:
        '200':
          description: Entitlements of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: grantEntitlementAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: Grant or update an entitlement of an organization
      description: >-
        The only path that writes entitlements (ENT-04, E-12). The change is
        recorded in operator_audit with the previous and the new state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantEntitlementRequest'
      responses:
        '200':
          description: Entitlement stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: cmdb_core disabled or limited in time, unknown source or negative limit
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/audit:
    get:
      operationId: listOperatorAudit
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: List the operator audit, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Operator audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuditListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/audit/verify:
    get:
      operationId: verifyOperatorAudit
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: Verify the operator audit hash chain
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuditVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [Auth]
      security: []
      summary: Public OIDC parameters for browser clients
      description: >-
        Returns the issuer, client ID, redirect URI and endpoints a single-page
        application needs to start an authorization code flow with PKCE. The
        client secret is never returned.
      responses:
        '200':
          description: Public OIDC configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/signup/challenge:
    get:
      operationId: getSignupChallenge
      tags: [Auth]
      security: []
      summary: ALTCHA challenge for the signup form (TLC-01, E-33)
      description: >-
        A signed proof-of-work challenge of the self-hosted ALTCHA. The
        solution is sent as `altcha` with the signup request; it is valid
        for ten minutes and accepted once.
      responses:
        '200':
          description: Challenge
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AltchaChallenge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/signup:
    post:
      operationId: submitSignup
      tags: [Auth]
      security: []
      summary: Request a self-signup (TLC-01)
      description: >-
        Stores a signup request and sends a verification link to the
        address. The answer is 202 whether or not the address already has an
        account. The request passes the pre-auth limit (AUT-10), at most five
        signups per client IP and hour (429), the ALTCHA solution (400,
        `field` = `altcha`) and the disposable-domain blocklist (422,
        `field` = `email`). 503 while no e-mail channel, IdP administration
        or protection store is available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          description: Verification link sent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [verification_sent] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/signup/verify:
    post:
      operationId: verifySignup
      tags: [Auth]
      security: []
      summary: Verify a self-signup and create the organization (TLC-01)
      description: >-
        The token of the verification link is the credential. Creates, in
        one transaction, the organization with a slug derived from its name,
        the default VRF, the first user as org_admin and the trial
        entitlements (ENT-07), sets the password in the IdP (it is never
        stored by Reticora) and records the signup in operator_audit. 404
        for an unknown or used token, 410 for an expired one, 409 when the
        address already has an IdP account, 422 when the IdP rejects the
        password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupVerification'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The verification link has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/callback:
    post:
      operationId: authCallback
      tags: [Auth]
      security: []
      summary: Complete the OIDC callback flow and issue a session token
      description: |
        Issues a 15-minute access token (AUT-02) and sets the refresh token as
        an HttpOnly, Secure, SameSite=Strict cookie for /api/v1/auth.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: Session token and resolved user info
          headers:
            Set-Cookie:
              description: Refresh cookie `reticora_refresh`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      security: []
      summary: Refresh the session with the refresh cookie
      description: |
        Uses up the refresh cookie and sets a new one (rotation). A cookie
        presented a second time revokes the whole session; a revoked session
        (logout, deactivation) or a deactivated user gets 401. Roles and
        scopes are read again (AUT-02).
      parameters:
        - name: reticora_refresh
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refreshed session token issued
          headers:
            Set-Cookie:
              description: Rotated refresh cookie `reticora_refresh`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      security: []
      summary: End the session
      description: |
        Revokes the refresh cookie's session, blacklists the presented access
        token in Redis until it expires and clears the cookie (AUT-02). It
        needs no valid access token.
      parameters:
        - name: reticora_refresh
          in: cookie
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Session ended; the refresh cookie is cleared
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/me:
    get:
      operationId: getCurrentSession
      tags: [Auth]
      security:
        - BearerAuth: []
      summary: Get the currently authenticated session claims
      responses:
        '200':
          description: Current session claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionClaims'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cis:
    get:
      operationId: listCIs
      tags: [CIs]
      summary: List configuration items
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - $ref: '#/components/parameters/CIStatus'
        - $ref: '#/components/parameters/CITypeID'
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/RoomID'
      responses:
        '200':
          description: Paginated list of configuration items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCI
      tags: [CIs]
      summary: Create a configuration item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCIRequest'
      responses:
        '201':
          description: Configuration item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            Another active CI holds the value of a unique attribute (MET-15);
            `violations` names the attributes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cis/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getCI
      tags: [CIs]
      summary: Get a configuration item
      responses:
        '200':
          description: Configuration item details
          headers:
            ETag:
              description: The CI version (API-07); send it as If-Match with a PATCH.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCI
      tags: [CIs]
      summary: Update a configuration item
      description: >-
        Optimistic concurrency (API-07): If-Match names the version the editor
        read. A stale version is refused with 409 only when a field of the
        request was changed since by a write of rank >= 92 (manual, import,
        workflow); observed discovery updates do not change the version.
        An organization can require If-Match (settings.require_if_match);
        then a request without it is 412, like an unknown version.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: ETag of the version the change is based on, or "*".
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCIRequest'
      responses:
        '200':
          description: Configuration item updated
          headers:
            ETag:
              description: The new CI version.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Fields of the request changed since the If-Match version, or
            another active CI holds the value of a unique attribute (MET-15,
            `violations` names the attributes)
          content:
            application/problem+json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/VersionConflictProblem' }
                  - { $ref: '#/components/schemas/ProblemDetail' }
        '412':
          description: If-Match missing although required, or not a version of the CI
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    delete:
      operationId: deleteCI
      tags: [CIs]
      summary: Delete a configuration item
      responses:
        '204':
          description: Configuration item deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cis/{id}/changes:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    get:
      operationId: listCIChanges
      tags: [CIs]
      summary: List the change history of a CI
      description: >-
        Returns the `ci_change` rows recorded for the CI. Entries are written in
        the same transaction as the mutation itself, so the history can never
        diverge from the current state.
      responses:
        '200':
          description: Paginated change history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIChangeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/audit:
    parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    get:
      operationId: listAuditEntries
      tags: [Audit]
      summary: List audit log entries
      description: >-
        Newest first; requires audit:read (AUD-05). The filters combine with
        AND; `from` is inclusive, `to` exclusive. Personal values (e-mail,
        names, phone) are stored as PII-vault surrogates and resolved here;
        a deleted vault entry shows as null (SEC-05).
      parameters:
        - {name: action, in: query, schema: {type: string}}
        - {name: resource_type, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string, format: uuid}}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - name: source
          in: query
          schema:
            $ref: '#/components/schemas/AuditSource'
        - {name: request_id, in: query, schema: {type: string}}
        - {name: correlation_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/audit/verify:
    post:
      operationId: verifyAuditChain
      tags: [Audit]
      summary: Verify the audit hash chain
      description: >-
        Walks the organization's audit chain in `seq` order and reports the
        first violation (AUD-04): a gap in the sequence, a broken
        `previous_hash` link (the first entry links to 32 zero bytes) or a
        hash that does not match SHA-256(previous_hash || SHA-256(canonical
        JSON)) of the stored entry.
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/privacy/retention:
    get:
      operationId: getRetentionPolicy
      tags: [Privacy]
      summary: Get the tenant data-retention policy (DSGVO Art. 5)
      description: >-
        Returns the configured retention policy for personal data. The policy
        defines after how many days personal records (contacts, deactivated
        user accounts) expire and whether the erasure workflow anonymizes or
        deletes them. Requires user:manage.
      responses:
        '200':
          description: Retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putRetentionPolicy
      tags: [Privacy]
      summary: Configure the tenant data-retention policy
      description: >-
        Creates or updates the retention policy. `retention_days = 0` keeps
        data forever (no erasure). `mode` selects whether expired records are
        anonymized (default; rows stay for referential integrity) or deleted.
        Requires user:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retention_days: { type: integer, minimum: 0 }
                mode: { type: string, enum: [anonymize, delete] }
      responses:
        '200':
          description: Updated retention policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/privacy/erasure:
    post:
      operationId: runErasureWorkflow
      tags: [Privacy]
      summary: Run the data-erasure workflow (DSGVO Art. 17)
      description: >-
        Enforces the configured retention policy: contact records and
        deactivated user accounts whose last update predates the retention
        window are anonymized (default) or deleted. Running the workflow
        requires an explicitly configured policy, so a tenant can never purge
        data by accident. Requires user:manage.
      responses:
        '200':
          description: Erasure summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

