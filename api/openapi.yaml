      properties:
        id: { type: string }
        organization_id: { type: string }
        user_id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AICitation:
      type: object
      required: [entity_type, entity_id, title, url, score]
      properties:
        entity_type: { type: string }
        entity_id: { type: string }
        title: { type: string }
        url: { type: string }
        score: { type: number }

    AIAskRequest:
      type: object
      required: [question]
      properties:
        conversation_id: { type: string }
        question: { type: string, maxLength: 2000 }

    AIAskResponse:
      type: object
      required: [conversation_id, answer, citations, prompt_tokens, completion_tokens]
      properties:
        conversation_id: { type: string }
        answer: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/AICitation' }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }

