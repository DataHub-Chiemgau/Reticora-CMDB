      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listRackMounts
      tags: [Racks]
      summary: List mounts in a rack
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of rack mounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackMountListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createRackMount
      tags: [Racks]
      summary: Mount a CI into a rack
      description: >-
        The location of the CI, or of its asset, becomes the rack; ci_change
        and the audit record the mount (RCK-03, DB-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRackMountRequest'
      responses:
        '201':
          description: Rack mount created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackMount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The mount collides with another on an overlapping face (front,
            rear, both), exceeds the rack height, mounts a CI that is
            mounted already or a child CI of a composition (RCK-01, RCK-02).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/rack-mounts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getRackMount
      tags: [Racks]
      summary: Get a rack mount
      responses:
        '200':
          description: Rack mount details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackMount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRackMount
      tags: [Racks]
      summary: Update a rack mount
      description: >-
        Repositions the mount (another rack included). The location of the
        CI, or of its asset, becomes the rack; ci_change and the audit record
        the change (RCK-03, DB-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRackMountRequest'
      responses:
        '200':
          description: Rack mount updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RackMount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The mount collides with another on an overlapping face (front,
            rear, both), exceeds the rack height, mounts a CI that is
            mounted already or a child CI of a composition (RCK-01, RCK-02).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    delete:
      operationId: deleteRackMount
      tags: [Racks]
      summary: Delete a rack mount
      description: >-
        Unmounts the CI. Its location, or its asset's, becomes the rack's
        room; ci_change and the audit record the change (RCK-03, DB-05).
      responses:
        '204':
          description: Rack mount deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

