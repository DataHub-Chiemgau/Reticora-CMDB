  /api/v1/export/cis:
    get:
      operationId: exportCIs
      deprecated: true
      x-deprecated-at: '2026-10-14'
      x-sunset: '2027-10-15'
      x-successor: '/api/v1/exports'
      tags: [Export]
      summary: Export configuration items
      description: |
        Streams the tenant's configuration items. Rows are fetched in
        keyset-paginated batches and flushed as they are produced, so the
        response is chunked and neither the server nor the client has to hold
        the full result set in memory. There is no row limit. CSV and DATEV
        are UTF-8 with BOM and semicolons (EXP-01); X-Export-Omitted-Fields
        names the CI fields the layout leaves out. The export job resource
        /api/v1/exports (202, presigned download, manifest) replaces it.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json, datev]
            default: json
        - $ref: '#/components/parameters/CIStatus'
        - $ref: '#/components/parameters/CITypeID'
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIExportJSONResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

