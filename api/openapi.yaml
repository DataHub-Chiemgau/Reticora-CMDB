      type: object
      required: [id, organization_id, kind, status, payload, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        kind:
          type: string
          enum: [unclassified_device, ambiguous_identity, conflicting_values, probable_duplicate, override_conflict, resurrected_device, unlicensed_ci, scope_suggested, serial_mismatch, duplicate_ip, unknown_relationship]
        status:
          type: string
          enum: [open, resolved, dismissed]
        payload:
          type: object
          additionalProperties: true
        candidate_ci_ids:
          type: array
          items:
            type: string
        resolved_by:
          type: string
          description: >-
            The principal (user or service account) that resolved the item;
            absent when the system resolved it: an unlicensed_ci item adopted
            after max_cis was raised, or an unclassified_device item closed
            with resolution reclassified because discovery classified its CI
            later (DIS-02).
        resolved_at:
          type: string
          format: date-time
        resolution:
          type: string
        object_key:
          type: string
          description: The object the item is about; one item per object and type is open (REC-08).
        action:
          type: string
          enum: [merge, new, dismiss, accept]
        escalated:
          type: boolean
          description: Open longer than 14 days (REC-08).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

