              type: array
              items:
                $ref: '#/components/schemas/Role'

    RoleAssignment:
      type: object
      required: [id, user_id, scope_type, granted_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        custom_role_id:
          type: string
        role_id:
          type: string
        scope_type:
          type: string
          enum: [organization, client, site, team]
          description: Scope of the assignment (RBA-03); see AssignRoleRequest.scope_type.
        scope_id:
          type: string
          description: Client, site or team of the scope; absent for organization.
        granted_at:
          type: string
          format: date-time
        granted_by:
          type: string

    AssignRoleRequest:
      type: object
      required: [user_id]
      description: Assigns a role to a user. Exactly one of `custom_role_id`
        (tenant-defined role) or `role_id` (seeded standard role) must be set.
      properties:
        user_id:
          type: string
        custom_role_id:
          type: string
        role_id:
          type: string
          description: ID of a standard (builtin) role; mutually exclusive with custom_role_id.
        scope_type:
          type: string
          enum: [organization, client, site, team]
          description: >-
            Scope of the assignment (RBA-03); defaults to "organization" when
            omitted. client, site and team name the client, site or team in
            scope_id: a client or site scope needs a client or site of the
            organization (422 otherwise), a team scope a team of the
            organization (404 otherwise). A site assignment is confined to the
            client of its site. The scopes of all assignments of a user are united per
            dimension (clients, sites, teams) and the dimensions are
            intersected (E-70 option 1): a site assignment next to a client
            assignment limits the sites of that client as well (client C1
            plus a site S1 of C1 grants C1 at S1 and without site only), and
            a team assignment limits the tickets of every assignment to its
            team plus tickets without team, which stay read-only (E-11,
            TEN-05). An org-wide assignment lifts every dimension.
        scope_id:
          type: string
          description: The client, site or team of a scoped assignment; omitted for organization.

