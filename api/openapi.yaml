                  assignments:
                    type: object
                    properties:
                      received:
                        type: array
                        items:
                          $ref: '#/components/schemas/Assignment'
                      issued:
                        type: array
                        items:
                          $ref: '#/components/schemas/Assignment'
                  exported_at:
                    type: string
                    format: date-time
                required: [user, contacts, roles, tickets, assignments, exported_at]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
