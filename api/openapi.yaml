    Role:
      type: object
      description: >-
        A permission role. The list endpoint returns the union of the seeded
        standard roles (org_admin, engineer, viewer, client_technician;
        is_builtin=true, assign via role_id) and tenant-defined custom roles
        (is_builtin=false, assign via custom_role_id).
      required: [id, organization_id, name, is_system, permissions, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        is_builtin:
          type: boolean
          description: True for the seeded standard roles stored in `role`.
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

