    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLocation
      tags: [Locations]
      summary: Read a node of the location tree
      responses:
        '200':
          description: Location node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLocation
      tags: [Locations]
      summary: Rename and/or move a node
      description: >-
        Moving re-derives path, site and client of the node and its subtree.
        Sites cannot be moved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdateRequest' }
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/LocationViolation' }
    delete:
      operationId: deleteLocation
      tags: [Locations]
      summary: Delete a leaf node
      description: >-
        Refused with 409 while the node has child locations or CIs, assets,
        stock items, movements, rack mounts or role assignments reference it
        (LOC-11); a site also while VLANs, subnets, collectors, discovery
        scopes, unexpired agent enrollment tokens or merge tombstones within
        tombstone_until are bound to it (E-71). Expired tokens and tombstones
        are removed with the site. Deleting a site, building, room or rack
        through its own endpoint follows the same rules; no delete cascades
        into the subtree.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LocationInUse' }

