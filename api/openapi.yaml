          type: string
          description: Site of the collector; it decides the client.
        name:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [pending, active, offline, disabled, paused]
          description: >-
            pending until the first heartbeat, active while heartbeats arrive,
            offline after five minutes without heartbeat (COL-05), disabled by an
            administrator (its certificates are revoked), paused while the
            discovery license is not active (ENT-07).
        status_changed_at:
          type: string
          format: date-time
        last_heartbeat_at:
          type: string
          format: date-time
        cert_fingerprint:
          type: string
        cert_not_after:
          type: string
          format: date-time
        config:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

