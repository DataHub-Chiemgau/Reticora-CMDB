        ui_schema: { type: object, additionalProperties: true }
        compliance_rules:
          type: array
          items: {}
        discovery_mappings:
          type: array
          items: {}
        fields:
          type: array
          items: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CITypeListResponse:
