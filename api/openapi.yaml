  /api/v1/search/query:
    post:
      operationId: queryByFilterSpec
      summary: Execute a structured filter spec (saved-view DSL) against CIs or assets
      description: >-
        The flat fields of the filter spec are AND-ed with the filter AST in
        where (SRC-03): groups and, or and not nest comparisons of a field
        with eq, ne, lt, lte, gt, gte, like (* as wildcard), in or exists.
        Fields are the whitelisted columns of the entity kind, its dynamic
        attributes (attributes.<key>) and, for CIs, the fields of the linked
        asset (asset.<field>). At most 10 levels and 100 nodes. Every value
        is checked against its field before any query runs: UUID fields
        take UUIDs, time and date fields an RFC 3339 time or a date
        (YYYY-MM-DD), number fields numbers, boolean fields true or false,
        text fields strings without NUL; each element of in likewise, and
        exists takes true, false or no value. A dynamic attribute compares
        by the type of the value (for in of the first element, all elements
        sharing it): a number only with numeric values, a boolean only with
        booleans, a time string with lt, lte, gt or gte only with values
        holding a time, other strings as text. An attribute value of another
        JSON type counts as missing: it matches neither eq, in nor an order
        comparison and, like a missing key, matches ne. The ids in
        client_id, location_id, upstream_of and downstream_of are UUIDs. A
        violation is 422 with field naming it (where.<path>, e.g.
        where.and[1].value or where.value[0], or the flat field).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                entity_kind: { type: string, enum: [ci, asset] }
                where: { $ref: '#/components/schemas/FilterExpr' }
      responses:
        '200':
          description: Filtered query results
        '400':
          description: >-
            Invalid filter spec (malformed JSON, unknown member or
            entity_kind), or a value the database refuses after the checks
            (e.g. NUL in a flat text field); the detail is generic and never
            carries database text.
        '401':
          description: Unauthorized
        '422':
          description: >-
            Invalid filter AST or filter value; field names it (where.<path>
            or the flat field).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        API key of AUT-04. While the key store (database) is unreachable, a
        request with a well-formed key is refused with 503 and Retry-After,
        not with 401 (OPS-06).
    OperatorAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Operator session from POST /api/v1/admin/auth/callback (SEC-07).
    BreakGlassAuth:
      type: apiKey
      in: header
      name: X-Operator-Token
      description: RETICORA_OPERATOR_TOKEN, bootstrap and break-glass only; every use raises an alarm.
    OpsAlertAuth:
      type: http
      scheme: bearer
      description: RETICORA_OPS_ALERT_TOKEN of the Alertmanager bridge (OPS-05), sent by Alertmanager from a credentials file.

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Maximum number of items to return (API-02); a larger value is capped to 200.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: |
        Number of items to skip before returning data. Ignored when `cursor` is
        supplied.
    ListFilter:
      name: filter
      in: query
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: true
      description: |
        Field filters of API-02: `filter[field]=value` (exact),
        `filter[field][op]=value` with op `exact`, `gte`, `lte`, `like`
        (`*` as wildcard, otherwise substring) or `in` (comma-separated).
        `filter[attributes.<key>]` filters a JSONB attribute; only searchable
        attributes may be filtered (otherwise 400 with a hint), and they
        compare by their data type. An unknown field yields 422, an unknown
        operator or a malformed value 400.
    ListSort:
      name: sort
      in: query
      schema:
        type: string
      description: Sort field from the list's whitelist; a leading `-` sorts descending. An unknown field yields 422.
    ListFields:
      name: fields
      in: query
      schema:
        type: string
      description: Comma-separated response fields; `id` is always returned. An unknown field yields 422.
    ImpactFields:
      name: fields
      in: query
      schema:
        type: string
      description: >-
        Sparse fieldset of the impacted CIs (API-02): comma-separated fields
        of ImpactNode (name, ci_type, status, client_id, site_id,
        management_ip, heuristic, hops, via, relay, path); `id` is always
        returned, an unknown field yields 422. Without it every field is
        returned (ImpactAnalysis); with it the answer is an
        ImpactAnalysisFields, whose impacted CIs are ImpactNodeFields. Paths
        are only built when `path` is selected; via and relay rebuild them
        (see ImpactNode). The topology view asks for
        `name,ci_type,status,heuristic,hops,via,relay` (NFR-02).
    ListQ:
      name: q
      in: query
      schema:
        type: string
      description: Free-text search.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: |
        Opaque cursor taken from `next_cursor` of the previous page. Cursors
        are HMAC-signed by the server (API-02); a forged or altered cursor
        yields 400. Keyset cursors are bound to the sort order they were
        issued for; sending one with a different `sort_by`/`sort_dir`
        combination yields 400.
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Free-text search term.
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
      description: Sort field name.
    SortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction.
    CIStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/CIStatus'
    CITypeID:
      name: ci_type_id
      in: query
      schema:
        type: string
    ClientID:
      name: client_id
      in: query
      schema:
        type: string
    SiteID:
      name: site_id
      in: query
      schema:
        type: string
    RoomID:
      name: room_id
      in: query
      schema:
        type: string

  headers:
    X-RateLimit-Limit:
      description: Requests per minute of the budget closest to exhaustion (API-04).
      schema: { type: integer }
    X-RateLimit-Remaining:
      description: Requests left in the current minute of that budget.
      schema: { type: integer }
    X-RateLimit-Reset:
      description: Seconds until the current window ends.
      schema: { type: integer }

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: A field value is outside its allowed range; `field` names it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: Upstream delivery failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: >-
        A rate limit is spent: the pre-auth budget of the client IP (AUT-10),
        the budget of the API key or session, or the organization budget
        (API-04).
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the budget is renewed.
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: A required subsystem is not configured or temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    DependencyUnavailable:
      description: >-
        A dependency the request needs is unreachable (OPS-06): the ingest
        queue (NATS), the API key store (database) or a database connection
        that cannot be established. Nothing was stored; the request may be
        repeated after Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds after which the request may be repeated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    LocationInUse:
      description: The location or its subtree is still referenced; dependencies lists the kinds of referencing objects
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/DependencyProblem'
    LocationViolation:
      description: The request violates the parent matrix or a field rule; violations name the field
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ViolationProblem'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    AttributeDefinition:
      type: object
      required: [id, scope, key, display_name, data_type, required, multi_value, searchable, unique, unique_scope, inheritable, order, is_system, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string, description: Empty for system definitions. }
        ci_type_id: { type: string, description: Empty for global definitions. }
        scope: { type: string, enum: [type, global] }
        key: { type: string }
        display_name:
          $ref: '#/components/schemas/LocalizedText'
        description: { type: string }
        data_type: { type: string }
        required: { type: boolean }
        default: {}
        enum_values:
          type: array
          items: { type: string }
        multi_value: { type: boolean }
        searchable:
          type: boolean
          description: >-
            Indexed for search: an `attribute.index` job builds
            `idx_attr_<id>` concurrently (DB-04).
        unique:
          type: boolean
          description: >-
            The value is unique among the active CIs (MET-15), enforced by the
            server and the unique index `idx_attr_<id>_u`; soft-deleted CIs do
            not count.
        unique_scope:
          type: string
          enum: [org, client]
          description: Unique per organization or per client (CIs without a client count as one client).
        inheritable: { type: boolean }
        validation: { type: object, additionalProperties: true }
        conditional: { type: object, additionalProperties: true }
        reference_target: { type: string }
        group: { type: string }
        order: { type: integer }
        unit: { type: string }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttributeDefinitionListResponse:
      type: object
      required: [data]
      properties:
        next_cursor:
          type: string
          description: Opaque signed cursor for the next page (API-02); absent on the last page.
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    AttributeDefinitionCreate:
      type: object
      required: [key, data_type]
      additionalProperties: false
      properties:
        ci_type_id: { type: string, description: Omitted for a global definition. }
        key: { type: string, minLength: 1, maxLength: 100 }
        display_name:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: string
        description: { type: string }
        data_type: { type: string, description: 'Data type of MET-11 — phase 1: text, multiline, integer, decimal, boolean, date, datetime, enum, multiselect, ip, mac, url, email, uuid; phase 2: file, json, reference (former names textarea, multi_enum and the specific reference types stay valid).' }
        required: { type: boolean }
        default: { description: Any JSON value valid for the data type. }
        enum_values:
          type: array
          items: { type: string }
        multi_value: { type: boolean }
        searchable: { type: boolean }
        unique: { type: boolean }
        unique_scope: { type: string, enum: [org, client] }
        inheritable: { type: boolean }
        validation: { type: object, additionalProperties: true }
        conditional: { type: object, additionalProperties: true }
        reference_target: { type: string }
        group: { type: string }
        order: { type: integer }
        unit: { type: string }
    AttributeDefinitionPatch:
      type: object
      additionalProperties: false
      properties:
        display_name:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: string
        description: { type: string }
        data_type: { type: string, description: 'Data type of MET-11 — phase 1: text, multiline, integer, decimal, boolean, date, datetime, enum, multiselect, ip, mac, url, email, uuid; phase 2: file, json, reference (former names textarea, multi_enum and the specific reference types stay valid).' }
        required: { type: boolean }
        default: { description: Any JSON value valid for the data type. }
        enum_values:
          type: array
          items: { type: string }
        multi_value: { type: boolean }
        searchable: { type: boolean }
        unique: { type: boolean }
        unique_scope: { type: string, enum: [org, client] }
        inheritable: { type: boolean }
        validation: { type: object, additionalProperties: true }
        conditional: { type: object, additionalProperties: true }
        reference_target: { type: string }
        group: { type: string }
        order: { type: integer }
        unit: { type: string }
    LocalizedText:
      type: object
      description: A label per language (MET-01).
      additionalProperties: false
      minProperties: 1
      properties:
        de: { type: string, minLength: 1, maxLength: 200 }
        en: { type: string, minLength: 1, maxLength: 200 }
    NotificationRecipient:
      type: object
      properties:
        user_id: {type: string}
        email: {type: string}
        name: {type: string}

    InAppNotification:
      type: object
      required: [id, organization_id, user_id, category, subject, body, created_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        user_id: {type: string}
        category: {type: string}
        subject: {type: string}
        body: {type: string}
        data:
          type: object
          additionalProperties: true
        created_at: {type: string, format: date-time}
        read_at: {type: string, format: date-time}

    InAppNotificationListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/InAppNotification'

    NotificationPreference:
      type: object
      required: [time_zone, muted_categories]
      properties:
        quiet_start: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: Start of the quiet hours (HH:MM).}
        quiet_end: {type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: End of the quiet hours; may be on the next day.}
        time_zone: {type: string, example: Europe/Berlin}
        muted_categories:
          type: array
          items: {type: string}

    NotificationChannel:
      type: object
      required: [id, organization_id, name, kind, provider, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        name: {type: string}
        kind:
          type: string
          enum: [email, inapp, webhook, sms, pager]
        provider:
          type: string
          enum: [central_smtp, smtp, inapp, webhook]
        config:
          type: object
          additionalProperties: true
          description: >-
            central_smtp: sender_name, reply_to; smtp: host, port, tls
            (starttls|tls|none), username, password, from; webhook: url,
            secret. Secrets are returned as `********`, the webhook url as
            scheme and host with masked path and query. The smtp host and
            port are held to the egress policy (SEC-08).
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    NotificationChannelRequest:
      type: object
      properties:
        name: {type: string}
        kind:
          type: string
          enum: [email, inapp, webhook]
        provider:
          type: string
          enum: [central_smtp, smtp, inapp, webhook]
        config:
          type: object
          additionalProperties: true
        enabled: {type: boolean}

    NotificationDelivery:
      type: object
      description: >-
        A queued delivery without its content: body and data (links,
        tokens) stay in the delivery queue.
      required: [id, organization_id, channel_id, recipient, category, critical, subject, status, attempts, max_attempts, next_attempt_at]
      properties:
        id: {type: string}
        organization_id: {type: string}
        channel_id: {type: string}
        recipient:
          $ref: '#/components/schemas/NotificationRecipient'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/NotificationRecipient'
        category: {type: string}
        critical: {type: boolean}
        subject: {type: string}
        dedup_key: {type: string}
        status:
          type: string
          enum: [pending, sending, sent, failed, suppressed]
        attempts: {type: integer}
        max_attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_error: {type: string}
        provider_id: {type: string}
        sent_at: {type: string, format: date-time}

    MetamodelExport:
      type: object
      required: [format_version, exported_at, organization_id, ci_types, attribute_definitions]
      properties:
        format_version:
          type: integer
          enum: [1]
        exported_at:
          type: string
          format: date-time
        organization_id:
          type: string
        ci_types:
          type: array
          items:
            $ref: '#/components/schemas/CIType'
        attribute_definitions:
          type: array
          description: Global attribute definitions of the organization and the system.
          items:
            $ref: '#/components/schemas/AttributeDefinition'

    CIType:
      type: object
      required: [id, key, name, display_name, is_builtin, is_system, is_active, is_logical, is_observable, schema_version, version, capabilities, allowed_relationship_types, ui_schema, compliance_rules, discovery_mappings, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string, description: Empty for system types. }
        key: { type: string }
        name: { type: string }
        display_name:
          $ref: '#/components/schemas/LocalizedText'
        icon: { type: string }
        description: { type: string }
        category: { type: string }
        is_builtin: { type: boolean }
        is_system: { type: boolean }
        is_active: { type: boolean }
        is_logical: { type: boolean }
        is_observable:
          type: boolean
          description: The offline detector watches CIs of the type (LCY-05); true for physical, false for logical types by default.
        schema_version:
          type: integer
          minimum: 1
          description: Version of the generated attribute schema.
        attribute_schema:
          type: object
          readOnly: true
          additionalProperties: true
          description: JSON Schema 2020-12 generated from the type's attribute definitions; read-only (DB-03).
        required_fields:
          type: array
          readOnly: true
          items: { type: string }
        version: { type: integer }
        cloned_from_id: { type: string }
        template_key: { type: string }
        lifecycle_definition_id: { type: string }
        capabilities: { type: object, additionalProperties: true }
        allowed_relationship_types:
