  /api/v1/export/cis:
    get:
      operationId: exportCIs
      tags: [Export]
      summary: Export configuration items
      description: |
        Streams the tenant's configuration items. Rows are fetched in
        keyset-paginated batches and flushed as they are produced, so the
        response is chunked and neither the server nor the client has to hold
        the full result set in memory. There is no row limit.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json, datev]
            default: json
        - $ref: '#/components/parameters/CIStatus'
        - $ref: '#/components/parameters/CITypeID'
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIExportJSONResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/export/jobs:
    get:
      operationId: listExportJobs
      tags: [Export]
      summary: List asynchronous export jobs
      description: Returns the caller's own export jobs newest first; jobs of
        other users are not listed. Completed, unexpired jobs carry a
        time-limited signed download URL.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Export jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createExportJob
      tags: [Export]
      summary: Queue an asynchronous CI export
      description: |
        Queues an asynchronous export. The job records the caller's tenant
        scope (`scope`); a background worker renders the CI set visible in
        exactly this scope in the requested format into object storage. Once
        the job is `completed` it exposes a signed download URL until
        `expires_at`. Requires blob storage to be configured — otherwise 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportJobRequest'
      responses:
        '202':
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/export/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
