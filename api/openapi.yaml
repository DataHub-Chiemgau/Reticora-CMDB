openapi: 3.1.0
info:
  title: Reticora CMDB API
  version: 1.0.0
  description: |
    Multi-tenant Configuration Management Database API for MSPs and ISPs.
    Endpoints require tenant-scoped authentication unless explicitly marked otherwise.

    Rate limits (API-04): 600 requests per minute per API key or session
    and 6,000 per minute per organization (configurable). Every response
    carries `X-RateLimit-Limit`, `X-RateLimit-Remaining` and
    `X-RateLimit-Reset` (seconds until the window ends) for the budget
    closest to exhaustion; a refused request gets 429 with `Retry-After`.

    Dependency outages (OPS-06): a request that needs an unreachable
    dependency is refused before anything is stored, with 503 and
    `Retry-After`: every request with a well-formed API key while the key
    store (database) is unreachable (not 401: the key is not known to be invalid,
    and the refusal does not count against the pre-auth limit), an ingest
    while the ingest queue (NATS) is unreachable, and a request whose
    database connection cannot be established. While Redis is unreachable
    the rate limits refuse with 429. A 2xx answer means stored or durably
    queued.
  contact:
    name: DataHub Chiemgau
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Auth
    description: Authentication and session endpoints
  - name: CIs
    description: Configuration item management
  - name: Relationships
    description: CI relationship management
  - name: Webhooks
    description: Webhook subscription management
  - name: Discovery
    description: Discovery ingest and job tracking
  - name: Jobs
    description: Generic job model (export, bulk, merge, system jobs)
  - name: Reviews
    description: Review queue of reconciliation (REC-08)
  - name: Collectors
    description: Customer-deployed discovery collector management
  - name: Credentials
    description: Envelope-encrypted credential management
  - name: Export
    description: Data export operations
  - name: Entitlements
    description: Subscription features and usage
  - name: Assets
    description: Asset inventory management
  - name: Assignments
    description: Asset and CI assignment workflows
  - name: Documents
    description: Document metadata management
  - name: Stocktake
    description: Inventory stocktake operations
  - name: Tickets
    description: Ticket and comment management
  - name: Users
    description: User management
  - name: Teams
    description: Team and membership management
  - name: Roles
    description: Custom role and role assignment management
  - name: Permissions
    description: Permission catalogue and effective access
  - name: SLA
    description: Service-level policies and ticket clocks
  - name: Forms
    description: JSON-Schema based form definitions and submissions
  - name: Workflows
    description: Workflow definitions, runs and approvals
  - name: Compliance
    description: Compliance rules, evaluations and scores
  - name: Audit
    description: Hash-chained audit trail
  - name: Privacy
    description: DSGVO/GDPR data lifecycle (retention policy, erasure workflow)
  - name: Monitoring
    description: Metrics and alert rules
  - name: IGA
    description: Identity governance, active provisioning and access reviews
  - name: SCIM
    description: SCIM 2.0 service provider endpoints
  - name: Search
    description: Tenant-scoped full-text search
  - name: AI
    description: Governed LLM/RAG assistant
  - name: Locations
    description: Canonical location tree (sites, buildings, rooms, racks, warehouses, zones, shelves, bins)

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      security: []
      summary: Readiness check
      description: >-
        Checks the configured dependencies of the instance with a timeout of
        two seconds per check (OPS-01): `database` (with the required
        extensions), `redis`, `object_storage` (a TCP connection to the
        host:port the S3 client uses for RETICORA_S3_ENDPOINT, also for a URL
        or an endpoint without port: 443 or 80 by scheme or
        RETICORA_S3_USE_SSL), `nats`, and `smtp` when RETICORA_SMTP_HOST is
        set (connection, 220 greeting and EHLO in the TLS mode of
        RETICORA_SMTP_TLS; no mail is sent and no credentials are used, and
        one connection answers the requests of a second, WP-442). A
        dependency that is not configured has no key. While a
        configured mail server is unreachable, the instance answers 503 and
        leaves the load balancer.
        The database check also fails while the event trigger that restricts
        the application roles to index DDL is disabled or missing, e.g. after
        an aborted TimescaleDB extension update (WP-604, OPS-01); an extension
        below the version of its installed library is only logged as a
        warning by the start check of the server.
        Liveness stays on /healthz. Failing checks are only named; the server
        logs "readiness check failed" with the check, its address (without
        credentials) and the cause once when a check turns unavailable, and
        "readiness check recovered" once when it passes again. On an instance
        that runs the ingest worker, `details.ingest` reports the last
        30-second sample of the ingest lane backlog (WP-334, OPS-05), summed
        over all organizations, with its `sampled_at`; the request itself
        makes no call to NATS. The detail is informational and never changes
        the status.
      responses:
        '200':
          description: All dependencies are usable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: At least one dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/admin/auth/callback:
    post:
      operationId: operatorLogin
      tags: [Operator]
      security: []
      summary: Operator login (SEC-07)
      description: |
        Exchanges an OIDC authorization code (PKCE) for a 15-minute operator
        session. Only members of the operator group (RETICORA_OPERATOR_GROUP,
        default "operators") who logged in with a second factor (amr, or acr
        in RETICORA_OPERATOR_MFA_ACR) get one. Every attempt is recorded in
        operator_audit. Operator sessions are refused by the tenant API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: Operator session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/me:
    get:
      operationId: getOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: The authenticated operator
      responses:
        '200':
          description: Operator identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/orgs:
    get:
      operationId: listOrganizationsAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: List every organization
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOrgListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createOrganizationAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: Create an organization with plan and limits (TLC-02)
      description: >-
        Runs the creation chain of the self-signup without verification: the
        organization with its slug (derived from the name unless given), the
        default VRF and standard roles, the first user as org_admin, and the
        entitlements of the plan (source manual) with the given limits in
        the limits of their feature. With an IdP admin client the first
        org_admin receives an account and the IdP's mail to set a password
        (`admin_invited`). The creation and its `org.create` entry in
        operator_audit are atomic. Reseller creation is phase 4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorCreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorCreatedOrganization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/admin/orgs/{id}/entitlements:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listOrganizationEntitlementsAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: List the entitlements of an organization
      responses:
        '200':
          description: Entitlements of the organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: grantEntitlementAsOperator
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: Grant or update an entitlement of an organization
      description: >-
        The only path that writes entitlements (ENT-04, E-12). The change is
        recorded in operator_audit with the previous and the new state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantEntitlementRequest'
      responses:
        '200':
          description: Entitlement stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: cmdb_core disabled or limited in time, unknown source or negative limit
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/audit:
    get:
      operationId: listOperatorAudit
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: List the operator audit, newest first
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Operator audit entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuditListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/audit/verify:
    get:
      operationId: verifyOperatorAudit
      tags: [Operator]
      security:
        - OperatorAuth: []
        - BreakGlassAuth: []
      summary: Verify the operator audit hash chain
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuditVerification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/admin/alerts/alertmanager:
    post:
      operationId: receiveAlertmanagerAlerts
      tags: [Operator]
      security:
        - OpsAlertAuth: []
      summary: Operations alerts of Alertmanager into the notification channels (OPS-05)
      description: |
        Webhook receiver of Alertmanager (payload version 4, E-75). Each
        notification of an alert group becomes one notification (category
        `ops_alert`) of the operator organization RETICORA_OPS_ALERT_ORG_ID
        on its enabled notification channels, addressed to its users who hold
        monitoring:write organization-wide. A firing group with an alert of
        severity `critical` ignores quiet hours and muted categories. The
        deduplication key is derived from the group key, the status and the
        latest `startsAt` of the group's alerts: a repeated notification
        queues nothing, a resolved group or a new alert in it notifies again.
        A queued notification is recorded in the audit log of the operator
        organization (`notification.ops_alert_queued`, without the token).

        Only the bearer token RETICORA_OPS_ALERT_TOKEN authenticates: user
        sessions, API keys and operator credentials are refused with 401,
        which is recorded in operator_audit. Without an operator organization
        the endpoint answers 404 (also with a valid token) and Alertmanager
        keeps delivering by e-mail. A request carries at most 1 MiB and 100
        alerts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertmanagerWebhook'
      responses:
        '202':
          description: The notification is queued, or was queued by an earlier identical request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsAlertReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Body larger than 1 MiB
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: Not an Alertmanager payload of version 4 (status, group key, alerts, startsAt), or more than 100 alerts
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      tags: [Auth]
      security: []
      summary: Public OIDC parameters for browser clients
      description: >-
        Returns the issuer, client ID, redirect URI and endpoints a single-page
        application needs to start an authorization code flow with PKCE. The
        client secret is never returned.
      responses:
        '200':
          description: Public OIDC configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/signup/challenge:
    get:
      operationId: getSignupChallenge
      tags: [Auth]
      security: []
      summary: ALTCHA challenge for the signup form (TLC-01, E-33)
      description: >-
        A signed proof-of-work challenge of the self-hosted ALTCHA. The
        solution is sent as `altcha` with the signup request; it is valid
        for ten minutes and accepted once.
      responses:
        '200':
          description: Challenge
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AltchaChallenge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/signup:
    post:
      operationId: submitSignup
      tags: [Auth]
      security: []
      summary: Request a self-signup (TLC-01)
      description: >-
        Stores a signup request and sends a verification link to the
        address. The answer is 202 whether or not the address already has an
        account. The request passes the pre-auth limit (AUT-10), at most five
        signups per client IP and hour (429), the ALTCHA solution (400,
        `field` = `altcha`) and the disposable-domain blocklist (422,
        `field` = `email`). 503 while no e-mail channel, IdP administration
        or protection store is available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          description: Verification link sent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [verification_sent] }
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/signup/verify:
    post:
      operationId: verifySignup
      tags: [Auth]
      security: []
      summary: Verify a self-signup and create the organization (TLC-01)
      description: >-
        The token of the verification link is the credential. Creates, in
        one transaction, the organization with a slug derived from its name,
        the default VRF, the first user as org_admin and the trial
        entitlements (ENT-07), sets the password in the IdP (it is never
        stored by Reticora) and records the signup in operator_audit. 404
        for an unknown or used token, 410 for an expired one, 409 when the
        address already has an IdP account, 422 when the IdP rejects the
        password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupVerification'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The verification link has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/callback:
    post:
      operationId: authCallback
      tags: [Auth]
      security: []
      summary: Complete the OIDC callback flow and issue a session token
      description: |
        Issues a 15-minute access token (AUT-02) and sets the refresh token as
        an HttpOnly, Secure, SameSite=Strict cookie for /api/v1/auth.
        A first login that makes the user org_admin (a pending org_admin
        invitation, or an account an administrator made org_admin) binds the
        IdP account to MFA (Keycloak realm role mfa_required, AUT-09); when
        that fails, the login answers 503 and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: Session token and resolved user info
          headers:
            Set-Cookie:
              description: Refresh cookie `reticora_refresh`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      security: []
      summary: Refresh the session with the refresh cookie
      description: |
        Uses up the refresh cookie and sets a new one (rotation). A cookie
        presented a second time revokes the whole session; a revoked session
        (logout, deactivation) or a deactivated user gets 401. Roles and
        scopes are read again (AUT-02).
      parameters:
        - name: reticora_refresh
          in: cookie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Refreshed session token issued
          headers:
            Set-Cookie:
              description: Rotated refresh cookie `reticora_refresh`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      security: []
      summary: End the session
      description: |
        Revokes the refresh cookie's session, blacklists the presented access
        token in Redis until it expires and clears the cookie (AUT-02). It
        needs no valid access token.
      parameters:
        - name: reticora_refresh
          in: cookie
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Session ended; the refresh cookie is cleared
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/me:
    get:
      operationId: getCurrentSessionLegacy
      deprecated: true
      x-deprecated-at: '2026-10-13'
      x-sunset: '2027-10-14'
      x-successor: '/api/v1/me'
      tags: [Auth]
      security:
        - BearerAuth: []
      summary: Get the currently authenticated session claims
      responses:
        '200':
          description: Current session claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionClaims'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/me:
    get:
      operationId: getCurrentSession
      tags: [Auth]
      security:
        - BearerAuth: []
      summary: Get the currently authenticated session claims
      responses:
        '200':
          description: Current session claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionClaims'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cis:
    get:
      operationId: listCIs
      tags: [CIs]
      summary: List configuration items
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - $ref: '#/components/parameters/CIStatus'
        - $ref: '#/components/parameters/CITypeID'
        - $ref: '#/components/parameters/ClientID'
        - $ref: '#/components/parameters/SiteID'
        - $ref: '#/components/parameters/RoomID'
        - $ref: '#/components/parameters/ListFilter'
        - $ref: '#/components/parameters/ListSort'
        - $ref: '#/components/parameters/ListFields'
        - $ref: '#/components/parameters/ListQ'
      responses:
        '200':
          description: Paginated list of configuration items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: An unknown field in filter, sort or fields (API-02).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCI
      tags: [CIs]
      summary: Create a configuration item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCIRequest'
      responses:
        '201':
          description: Configuration item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            Another active CI holds the value of a unique attribute (MET-15);
            `violations` names the attributes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: >-
            A field value is not allowed; `violations` names the field, e.g.
            ci_type_id that is no UUID ("not the ID (UUID) of a CI type"),
            names no system type and no type of the organization ("CI type
            not found", the same for an unknown ID and a type of another
            organization) or a deactivated type ("the CI type is
            deactivated").
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ViolationProblem' }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cis/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getCI
      tags: [CIs]
      summary: Get a configuration item
      parameters:
        - name: include
          in: query
          schema: { type: string }
          description: >-
            Comma-separated related collections to embed (API-05):
            `relationships`, `contacts`, `asset`. An unknown name yields 422.
      responses:
        '200':
          description: Configuration item details
          headers:
            ETag:
              description: The CI version (API-07); send it as If-Match with a PATCH.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '301':
          description: The CI was merged into another; Location names the survivor (12 months, CI-12).
          headers:
            Location:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unknown include name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    patch:
      operationId: updateCI
      tags: [CIs]
      summary: Update a configuration item
      description: >-
        Optimistic concurrency (API-07): If-Match names the version the editor
        read. A stale version is refused with 409 only when a field of the
        request was changed since by a write of rank >= 92 (manual, import,
        workflow); observed discovery updates do not change the version.
        An organization can require If-Match (settings.require_if_match);
        then a request without it is 412, like an unknown version.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: ETag of the version the change is based on, or "*".
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCIRequest'
      responses:
        '200':
          description: Configuration item updated
          headers:
            ETag:
              description: The new CI version.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Fields of the request changed since the If-Match version, or
            another active CI holds the value of a unique attribute (MET-15,
            `violations` names the attributes)
          content:
            application/problem+json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/VersionConflictProblem' }
                  - { $ref: '#/components/schemas/ProblemDetail' }
        '412':
          description: If-Match missing although required, or not a version of the CI
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
    delete:
      operationId: deleteCI
      tags: [CIs]
      summary: Delete a configuration item
      description: >-
        Soft delete (CI-05): sets deleted_at and the operative status
        decommissioned (the lifecycle state stays, LCY-01) and releases the
        asset link; relationships stay, traversal and impact skip the CI.
        POST /cis/{id}/restore brings it back within 90 days, afterwards the
        retention run deletes it with its interfaces and IP addresses.
      responses:
        '204':
          description: Configuration item deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cis/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: restoreCI
      tags: [CIs]
      summary: Restore a deleted CI within the retention (CI-05, API-05)
      description: >-
        Clears the deletion of a CI deleted less than 90 days ago; the change
        history and the audit trail record the restore (ci.restored).
        Requires ci:delete.
      responses:
        '200':
          description: The restored CI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: The CI was deleted longer ago than the retention.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/cis/{id}/type:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: changeCIType
      tags: [CIs]
      summary: Change the type of a CI (CI-11)
      description: >-
        Manual reclassification. The CI keeps its id, relationships, mounts,
        asset link and history; required attributes of the target type the
        CI does not carry are returned as findings and do not block. The
        change is recorded as ci_change type_change, audit ci.type_changed
        and event ci.changed (changed_fields ci_type_id). Discovery uses the
        same service but may only raise generic_device to a specific type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ci_type_id]
              properties:
                ci_type_id:
                  type: string
                  format: uuid
                  description: >-
                    ID of an active system type or an active type of the
                    organization (CI-01, TEN-09).
      responses:
        '200':
          description: The type change and its findings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CITypeChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >-
            The target type is not allowed, `violations` names ci_type_id: no
            UUID ("not the ID (UUID) of a CI type"), no system type and no
            type of the organization ("CI type not found", the same for an
            unknown ID and a type of another organization) or deactivated
            ("the CI type is deactivated").
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ViolationProblem' }

  /api/v1/cis/{id}/merge:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: mergeCI
      tags: [CIs]
      summary: Merge a victim CI into this CI (CI-12)
      description: >-
        Moves relationships, interfaces with their IP addresses, contacts,
        history, document links and the asset link of the victim to this CI
        (the survivor). Attributes follow the provenance rank of the
        discovery sources, tags are united; field values and overrides of
        both CIs stay, contradicting overrides open an override_conflict
        review. The victim is soft-deleted with merged_into_id; GET on it
        answers 301 to the survivor for 12 months. A snapshot allows the
        unmerge within 30 days. The merge runs as a job of kind ci.merge
        (reference ci_merge/merge_id). Requires ci:delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [victim_id]
              properties:
                victim_id: { type: string, format: uuid }
      responses:
        '200':
          description: The merge result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIMergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One of the CIs is part of another merge.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '422':
          description: Survivor and victim are the same CI.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/cis/{id}/unmerge:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: unmergeCI
      tags: [CIs]
      summary: Revert the merge of this (merged) CI within 30 days (CI-12)
      description: >-
        Restores the merged CI of the path and its survivor from the merge
        snapshot: both CI rows, the moved relationships, interfaces,
        contacts, history, document links, field values and the asset link,
        and the rows the merge removed. After 30 days the snapshot is gone
        (410). Requires ci:delete.
      responses:
        '200':
          description: Both CIs after the unmerge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIUnmergeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One of the CIs is locked by another write.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '410':
          description: The merge snapshot is older than 30 days.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/cis/bulk:
    post:
      operationId: bulkCIs
      tags: [CIs]
      summary: Bulk status change of up to 500 CIs (API-08, BLK-01)
      description: >-
        Sets the status of every CI in ids. Below 100 ids the answer is the
        partial failure report (200): every id with ok or its error and the
        HTTP status the single change would have answered. From 100 ids on
        the change runs as a job of kind ci.bulk (JOB-04): 202 with the job,
        whose result is the report (GET /api/v1/jobs/{id}). More than 500
        ids is 422. Requires ci:write.
        Every change is a manual change like a PATCH of status (CI-04,
        OVR-01): the status is set also over an existing override and gets
        a protected override with the requesting user (for a job its
        creator) as author; the CI version rises (API-07), so a later PATCH
        of status with an older If-Match is 409. The bulk change names no
        version per id and overwrites deliberately, like If-Match "*", also
        where the organization requires If-Match (E-66). An id is ok only
        when the CI stores the requested status afterwards, otherwise it is
        an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, status]
              additionalProperties: false
              properties:
                action:
                  type: string
                  enum: [set_status]
                  default: set_status
                ids:
                  type: array
                  minItems: 1
                  items: { type: string }
                status:
                  type: string
                  enum: [active, inactive, maintenance, decommissioned, unknown]
      responses:
        '200':
          description: The report per id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIBulkResult'
        '202':
          description: The bulk change runs as a job
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [job_id, status, kind]
                properties:
                  job_id: { type: string }
                  status: { type: string }
                  kind: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: More than 500 ids, an unknown action or status.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /api/v1/cis/{id}/provenance:
    get:
      operationId: getCIProvenance
      tags: [CIs]
      summary: Provenance of every typed field of a CI (REC-10)
      description: >-
        One entry per typed field and attribute of the CI with a value: the
        shown value, its source, the REC-03 rank of the source, when it was
        recorded and observed, and why it is shown (override, source_rank,
        asset or record). An override also names its author and reason and
        the observed value it covers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Field provenance, sorted by field
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  next_cursor:
                    type: string
                    description: Opaque signed cursor for the next page (API-02); absent on the last page.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CIFieldProvenance'
                  total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cis/{id}/changes:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    get:
      operationId: listCIChanges
      tags: [CIs]
      summary: List the change history of a CI
      description: >-
        Returns the `ci_change` rows recorded for the CI. Entries are written in
        the same transaction as the mutation itself, so the history can never
        diverge from the current state.
      responses:
        '200':
          description: Paginated change history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIChangeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/audit:
    parameters:
