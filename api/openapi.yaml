    DiscoveryScope:
      type: object
      description: A discovery scope (DIS-09).
      required: [id, organization_id, collector_id, name, kind, target, schedule, credential_ids, plugins, enabled, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        client_id:
          type: string
        site_id:
          type: string
        collector_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [cidr, host, range]
        target:
          type: string
          description: CIDR, IP address or host name, or "first-last" address range.
        vrf_id:
          type: string
        schedule:
          type: string
          description: Interval (e.g. 24h, at least 5m) or five-field cron expression.
        credential_ids:
          type: array
          description: >-
            The bound credentials. Empty: the collector uses the
            organization-wide credentials and those of the scope's client
            for this scope (E-67).
          items:
            type: string
        plugins:
          type: array
          items:
            type: string
            enum: [sweep, snmp, ssh, wmi, ipmi, redfish, power, nas]
        enabled:
          type: boolean
        last_run_at:
          type: string
          format: date-time
        next_run_at:
          type: string
          format: date-time
        last_result:
          type: object
          additionalProperties: true
        health:
          $ref: '#/components/schemas/DiscoveryScopeHealth'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DiscoveryScopeHealth:
      type: object
      description: State of the last run with the causes of its errors (DIS-08).
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, partial, failed, never_run]
        errors:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryErrorState'

    DiscoveryErrorState:
      type: object
      required: [cause]
      properties:
        cause:
          type: string
          enum: [unreachable, timeout, refused, auth_failed, tls, protocol_error, config_error, upload_failed, unknown]
        message:
          type: string
        protocol:
          type: string
        target:
          type: string

    DiscoveryScopeInput:
      type: object
      additionalProperties: false
      required: [collector_id, kind, target]
      properties:
        collector_id:
          type: string
        name:
          type: string
          description: Defaults to the target.
        kind:
          type: string
          enum: [cidr, host, range]
        target:
          type: string
          description: CIDR, IP address or host name, or "first-last" address range. IPv6 addresses carry no zone; a target with one (fe80::1%eth0) is refused with 422 on the field target.
        client_id:
          type: string
        site_id:
          type: string
        vrf_id:
          type: string
        schedule:
          type: string
          description: Defaults to 24h.
        credential_ids:
          type: array
          description: >-
            Credentials of the organization that are organization-wide or of
            the scope's client (decided by the site or the collector), else
            422 on credential_ids. Empty: the scope uses the
            organization-wide credentials and those of its client (E-67).
          items:
            type: string
        plugins:
          type: array
          description: Defaults to sweep and snmp.
          items:
            type: string
            enum: [sweep, snmp, ssh, wmi, ipmi, redfish, power, nas]
        enabled:
          type: boolean

    DiscoveryScopePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [cidr, host, range]
        target:
          type: string
          description: CIDR, IP address or host name, or "first-last" address range. IPv6 addresses carry no zone; a target with one (fe80::1%eth0) is refused with 422 on the field target.
        site_id:
          type: string
        vrf_id:
          type: string
        schedule:
          type: string
        credential_ids:
          type: array
          description: >-
            Replaces the list; organization-wide credentials or those of the
            scope's client, else 422 on credential_ids.
          items:
            type: string
        plugins:
          type: array
          items:
            type: string
            enum: [sweep, snmp, ssh, wmi, ipmi, redfish, power, nas]
        enabled:
          type: boolean

    DiscoveryScopeListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DiscoveryScope'

