          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteNetworkInterface
      tags: [IPAM]
      summary: Delete a network interface
      description: >-
        Deletes the interface (REL-05). An edge that names it as its source
        or target interface and is not an unverified discovery edge – a
        manual or verified edge, or an edge of another source – keeps it:
        409, `relationship_ids` lists those edges the caller can see. The
        unverified discovery edges at the interface are removed with it and
        recorded in the history of its CI (ci_change relationship_change).
        Addresses bound to the interface are unbound; one whose address is
        also present unbound in the same VRF is deleted with the interface.
      responses:
        '204':
          description: Network interface deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Edges keep the interface; `relationship_ids` names those the
            caller can see (empty when only edges outside its scope do).
            Without `relationship_ids`: an address of the interface collides
            with an unbound address the caller cannot see.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InterfaceInUseProblem'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/assignments/{id}/return:
    x-phase: P2
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: returnAssignment
      tags: [Assignments]
      summary: Return an assigned asset or CI
      description: >-
        Marks the assignment as returned, recording the return condition and
        timestamp. The optional `notes` field overwrites the assignment notes
        when non-empty.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnAssignmentRequest'
      responses:
        '200':
          description: Assignment returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/assignments/{id}/transfer:
    x-phase: P2
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: transferAssignment
      tags: [Assignments]
      summary: Transfer an assignment to a new assignee
      description: >-
        Marks the existing assignment as transferred and creates a new active
        assignment of the same asset/CI for the new assignee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferAssignmentRequest'
      responses:
        '201':
          description: New assignment created for the new assignee
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cis/{id}/relationships:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listCIRelationships
      tags: [Relationships]
