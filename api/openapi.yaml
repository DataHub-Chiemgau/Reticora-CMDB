    patch:
      operationId: updateRelationship
      tags: [Relationships]
      summary: Edit or verify a relationship
      description: >-
        Updates the provenance and verification metadata of an existing
        relationship. The edge endpoints and rel_type are immutable; rewiring is
        expressed by deleting and recreating the relationship so the graph
        history stays truthful.
      requestBody:
        required: true
        content:
          application/json:
            schema:
