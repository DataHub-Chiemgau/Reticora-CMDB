  /api/v1/discovery/review-items/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: resolveDiscoveryReviewItem
      deprecated: true
      tags: [Discovery]
      summary: Resolve a reconciliation review item (deprecated, use /api/v1/review-items/{id}/resolve)
      description: >-
        An unlicensed_ci item (a discovered device held because max_cis is
        reached, ENT-03) is resolved with create, which adopts the device as a
        CI within max_cis (403 entitlement-limit otherwise), or with dismiss,
        which discards it; both are audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewItemResolveRequest'
      responses:
        '200':
          description: The resolved review item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

