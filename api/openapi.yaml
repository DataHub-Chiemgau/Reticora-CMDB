openapi: 3.1.0
info:
  title: Reticora CMDB API
  version: 1.0.0
  description: |
    Multi-tenant Configuration Management Database API for MSPs and ISPs.
    Endpoints require tenant-scoped authentication unless explicitly marked otherwise.
  contact:
    name: DataHub Chiemgau
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Health
    description: Health and readiness endpoints
  - name: Auth
    description: Authentication and session endpoints
  - name: CIs
    description: Configuration item management
  - name: Relationships
    description: CI relationship management
  - name: Webhooks
    description: Webhook subscription management
  - name: Discovery
    description: Discovery ingest and job tracking
  - name: Export
    description: Data export operations
  - name: Entitlements
    description: Subscription features and usage
  - name: Assets
    description: Asset inventory management
  - name: Assignments
    description: Asset and CI assignment workflows
  - name: Documents
    description: Document metadata management
  - name: Stocktake
    description: Inventory stocktake operations
  - name: Tickets
    description: Ticket and comment management
  - name: Users
    description: User management
  - name: Audit
    description: Hash-chained audit trail
  - name: Monitoring
    description: Metrics and alert rules
  - name: GraphQL
    description: GraphQL backend-for-frontend endpoint

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      security: []
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      summary: Exchange an authorization code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/callback:
    post:
      operationId: authCallback
      tags: [Auth]
      security: []
      summary: Complete the OIDC callback flow and issue a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
      responses:
        '200':
          description: Session token and resolved user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      security: []
      summary: Refresh an existing session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/me:
    get:
      operationId: getCurrentSession
      tags: [Auth]
      security:
        - BearerAuth: []
      summary: Get the currently authenticated session claims
      responses:
        '200':
          description: Current session claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionClaims'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cis:
    get:
      operationId: listCIs
      tags: [CIs]
      summary: List configuration items
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - $ref: '#/components/parameters/CIStatus'
        - $ref: '#/components/parameters/CITypeID'
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Paginated list of configuration items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createCI
      tags: [CIs]
      summary: Create a configuration item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCIRequest'
      responses:
        '201':
          description: Configuration item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/cis/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getCI
      tags: [CIs]
      summary: Get a configuration item
      responses:
        '200':
          description: Configuration item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCI
      tags: [CIs]
      summary: Update a configuration item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCIRequest'
      responses:
        '200':
          description: Configuration item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CI'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCI
      tags: [CIs]
      summary: Delete a configuration item
      responses:
        '204':
          description: Configuration item deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/cis/{id}/changes:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    get:
      operationId: listCIChanges
      tags: [CIs]
      summary: List the change history of a CI
      description: >-
        Returns the `ci_change` rows recorded for the CI. Entries are written in
        the same transaction as the mutation itself, so the history can never
        diverge from the current state.
      responses:
        '200':
          description: Paginated change history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIChangeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/audit:
    parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
    get:
      operationId: listAuditEntries
      tags: [Audit]
      summary: List audit log entries
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/audit/verify:
    post:
      operationId: verifyAuditChain
      tags: [Audit]
      summary: Verify the audit hash chain
      description: >-
        Walks the organization's audit log in chain order and reports whether the
        `previous_hash`/`hash` linkage is intact.
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/relationships:
    get:
      operationId: listRelationships
      tags: [Relationships]
      summary: List relationships
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: ci_id
          in: query
          schema:
            type: string
          description: Return relationships where the CI is either the source or target.
        - name: source_ci_id
          in: query
          schema:
            type: string
        - name: target_ci_id
          in: query
          schema:
            type: string
        - name: rel_type
          in: query
          schema:
            $ref: '#/components/schemas/RelationshipType'
      responses:
        '200':
          description: Paginated list of relationships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createRelationship
      tags: [Relationships]
      summary: Create a relationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationshipRequest'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/relationships/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    delete:
      operationId: deleteRelationship
      tags: [Relationships]
      summary: Delete a relationship
      responses:
        '204':
          description: Relationship deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks:
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhook subscriptions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: event
          in: query
          schema:
            $ref: '#/components/schemas/WebhookEvent'
      responses:
        '200':
          description: Paginated list of webhook subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Create a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Webhook subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/webhooks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getWebhook
      tags: [Webhooks]
      summary: Get a webhook subscription
      responses:
        '200':
          description: Webhook subscription details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Update a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Webhook subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook subscription
      responses:
        '204':
          description: Webhook subscription deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Send a test delivery to a webhook subscription
      description: >-
        Sends a single signed `webhook.test` payload to the subscription URL and
        returns the delivery attempt. The endpoint responds with 200 even when the
        receiver rejected the request; inspect `success` and `status_code`.
      responses:
        '200':
          description: Test delivery attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/discovery/ingest:
    post:
      operationId: ingestDiscoveryData
      tags: [Discovery]
      summary: Ingest discovery results in bulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryIngestRequest'
      responses:
        '202':
          description: Discovery payload accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryIngestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/discovery/jobs:
    get:
      operationId: listDiscoveryJobs
      tags: [Discovery]
      summary: List discovery ingest jobs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DiscoveryJobStatus'
        - name: collector_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of discovery jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryJobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/discovery/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getDiscoveryJob
      tags: [Discovery]
      summary: Get a discovery ingest job
      responses:
        '200':
          description: Discovery job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/export/cis:
    get:
      operationId: exportCIs
      tags: [Export]
      summary: Export configuration items
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json, datev]
            default: json
        - $ref: '#/components/parameters/CIStatus'
        - $ref: '#/components/parameters/CITypeID'
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CIExportJSONResponse'
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/entitlements:
    get:
      operationId: listEntitlements
      tags: [Entitlements]
      summary: List tenant entitlements
      responses:
        '200':
          description: Entitlements for the current tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: grantEntitlement
      tags: [Entitlements]
      summary: Grant or update an entitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantEntitlementRequest'
      responses:
        '201':
          description: Entitlement granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/entitlements/usage:
    get:
      operationId: getEntitlementUsage
      tags: [Entitlements]
      summary: Get current entitlement usage metrics
      responses:
        '200':
          description: Usage metrics grouped by feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementUsageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assets:
    get:
      operationId: listAssets
      tags: [Assets]
      summary: List assets
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/ClientID'
      responses:
        '200':
          description: Paginated list of assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAsset
      tags: [Assets]
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/assets/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getAsset
      tags: [Assets]
      summary: Get an asset
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAsset
      tags: [Assets]
      summary: Update an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAsset
      tags: [Assets]
      summary: Delete an asset
      responses:
        '204':
          description: Asset deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assignments:
    get:
      operationId: listAssignments
      tags: [Assignments]
      summary: List assignments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: status
          in: query
          schema:
            type: string
        - name: assigned_to
          in: query
          schema:
            type: string
        - name: asset_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createAssignment
      tags: [Assignments]
      summary: Create an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/assignments/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getAssignment
      tags: [Assignments]
      summary: Get an assignment
      responses:
        '200':
          description: Assignment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateAssignment
      tags: [Assignments]
      summary: Update an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAssignment
      tags: [Assignments]
      summary: Delete an assignment
      responses:
        '204':
          description: Assignment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/documents:
    get:
      operationId: listDocuments
      tags: [Documents]
      summary: List documents
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createDocument
      tags: [Documents]
      summary: Create a document metadata record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
