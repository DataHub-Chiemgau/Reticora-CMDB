        icon: { type: string }
        description: { type: string }
        category: { type: string }
        is_logical: { type: boolean }
        is_observable: { type: boolean }
        template_key: { type: string }
        lifecycle_definition_id: { type: string }
        capabilities: { type: object, additionalProperties: true }
        allowed_relationship_types:
          type: array
          items: { type: string }
        ui_schema: { type: object, additionalProperties: true }
        compliance_rules:
          type: array
          items: {}
        discovery_mappings:
          type: array
          items: {}
        fields:
          type: array
          items: { type: object, additionalProperties: true }
    CITypeUpdateRequest:
      type: object
      properties:
        name: { type: string }
        display_name:
          oneOf:
            - $ref: '#/components/schemas/LocalizedText'
            - type: string
        icon: { type: string }
        description: { type: string }
        category: { type: string }
        is_logical: { type: boolean }
        is_observable: { type: boolean }
        lifecycle_definition_id: { type: string }
        capabilities: { type: object, additionalProperties: true }
        allowed_relationship_types:
          type: array
          items: { type: string }
        ui_schema: { type: object, additionalProperties: true }
        compliance_rules:
          type: array
          items: {}
        discovery_mappings:
          type: array
          items: {}
    InvitationRequest:
      type: object
      required: [email, role_id]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        role_id: { type: string, format: uuid }
        scope_type: { type: string, enum: [org, client, site], default: org }
