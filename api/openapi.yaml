        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/IGAObject' } } } }
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/IGAObject' } } } }
        '204': { description: Deleted }
