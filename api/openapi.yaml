  /api/v1/attribute-definitions:
    get:
      operationId: listAttributeDefinitions
      summary: List attribute definitions (MET-10)
      description: >-
        The single source of attribute validation and indexing (DB-03): the
        organization's definitions and the read-only system definitions
        (`is_system`). Filters: `ci_type_id`, `scope` (type, global).
      parameters:
        - { name: ci_type_id, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [type, global] } }
      responses:
        '200':
          description: Attribute definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinitionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAttributeDefinition
      summary: Create an attribute definition (MET-10)
      description: >-
        Without `ci_type_id` the definition is global (every type of the
        organization). Creating, changing or deleting a type's definition
        regenerates the type's `attribute_schema` and raises its
        `schema_version`. Requires ci_attribute:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeDefinitionCreate'
      responses:
        '201':
          description: Attribute definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/attribute-definitions/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getAttributeDefinition
      summary: Read an attribute definition
      responses:
        '200':
          description: Attribute definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateAttributeDefinition
      summary: Update an attribute definition
      description: >-
        Key, CI type and scope are immutable; system definitions are
        read-only (403). Changing `searchable`, `unique` or `unique_scope`
        queues an `attribute.index` job that builds the index concurrently
        (DB-04); making an attribute unique while active CIs share a value is
        409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeDefinitionPatch'
      responses:
        '200':
          description: Attribute definition updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAttributeDefinition
      summary: Delete an attribute definition
      responses:
        '204':
          description: Attribute definition deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

