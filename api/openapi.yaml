  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: getUser
      tags: [Users]
      summary: Get a user
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateUser
      tags: [Users]
      summary: Update a user
      description: >-
        A non-active status deactivates the user (TLC-04): in the same
        transaction the user's sessions and refresh cookies are revoked and
        every active API key the user created for themself is revoked. Keys
        the user created for service accounts belong to the service account
        and stay valid (decision E-64, option 2): the audit entry of the
        deactivation lists them (id, prefix, name, service account; never the
        secret), and the org_admins of the organization receive a
        notification to rotate them. The sessions are revoked only after the user was found in the
        caller's organization; an unknown user or a user of another
        organization answers 404 without any effect. If the sessions cannot
        be revoked, nothing is changed and the answer is 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete a user
      description: >-
        A user who owns open objects (open tickets, active assignments, keys
        not returned) or is referenced by closed records cannot be deleted;
        hand the objects over, or deactivate or anonymize the user (TLC-04).
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
