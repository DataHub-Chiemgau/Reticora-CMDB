      type: object
      required: [certificate_pem, ca_bundle_pem, serial, fingerprint, not_before, not_after]
      properties:
        certificate_pem: { type: string }
        ca_bundle_pem: { type: string, description: Active and, during a roll-over, previous CA }
        serial: { type: string }
        fingerprint: { type: string, description: SHA-256 of the certificate (hex) }
