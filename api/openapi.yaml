    InvitationRequest:
      type: object
      required: [email, role_id]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
        role_id: { type: string, format: uuid }
        scope_type: { type: string, enum: [org, client, site], default: org }
        scope_id:
          type: string
          format: uuid
          description: The client or site of a scoped invitation; omitted for org.
    Invitation:
      type: object
      required: [id, organization_id, email, role_id, scope_type, invited_by, status, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string }
        role_id: { type: string, format: uuid }
        scope_type: { type: string, enum: [org, client, site] }
        scope_id: { type: string, format: uuid }
        invited_by: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, expired] }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        token:
          type: string
          description: Only in the response of issue and renewal; shown once.
    InvitationListResponse:
      type: object
      required: [data, total, limit]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
    InvitationAcceptance:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1 }
        password:
          type: string
          description: Required (at least 12 characters) when the IdP admin client is configured; set directly in the IdP.
        display_name: { type: string, maxLength: 200 }
    AcceptedInvitation:
      type: object
      required: [user_id, organization_id, email, account_created]
      properties:
        user_id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email: { type: string }
        account_created: { type: boolean }
    OperatorCreateOrganizationRequest:
      type: object
      required: [name, plan, admin_email]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          maxLength: 48
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Optional; derived from the name (with -2, -3 … on collision) when omitted. A given, taken slug is 409.
        plan: { type: string, enum: [essential, standard, pro, enterprise] }
        limits:
          type: object
          description: Quotas stored in the limits of their feature's entitlement (max_cis and max_users on cmdb_core, max_collectors on discovery, max_api_keys on api_access).
          additionalProperties: false
          properties:
            max_cis: { type: integer, format: int64, minimum: 0 }
            max_collectors: { type: integer, format: int64, minimum: 0 }
            max_users: { type: integer, format: int64, minimum: 0 }
            max_api_keys: { type: integer, format: int64, minimum: 0 }
        admin_email: { type: string, maxLength: 254 }
        admin_display_name: { type: string, maxLength: 200 }
    OperatorCreatedOrganization:
      type: object
      required: [id, name, slug, plan, admin_invited, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        plan: { type: string, enum: [essential, standard, pro, enterprise] }
        admin_invited:
          type: boolean
          description: The first org_admin received an IdP account and an invitation mail; otherwise the account is provisioned in the IdP by hand and linked on first login.
        created_at: { type: string, format: date-time }
    SignupRequest:
      type: object
      required: [organization_name, email, altcha]
      additionalProperties: false
      properties:
        organization_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        display_name: { type: string, maxLength: 200 }
        altcha:
          type: string
          description: Base64-encoded JSON solution of a challenge from GET /api/v1/signup/challenge.
    AltchaChallenge:
      type: object
      required: [algorithm, challenge, maxnumber, salt, signature]
      properties:
        algorithm: { type: string, enum: [SHA-256] }
        challenge: { type: string }
        maxnumber: { type: integer }
        salt: { type: string }
        signature: { type: string }
    SignupVerification:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string, minLength: 1 }
        password:
          type: string
          description: Set directly in the IdP; at least 12 characters, the IdP's password policy applies.
    SignupResult:
      type: object
      required: [organization_id, organization_slug, plan, trial_ends_at]
      properties:
        organization_id: { type: string, format: uuid }
        organization_slug: { type: string }
        plan: { type: string, enum: [essential, standard, pro, enterprise] }
        trial_ends_at: { type: string, format: date-time }
    CollectorHeartbeatRequest:
      type: object
      additionalProperties: false
      properties:
        spool:
          $ref: '#/components/schemas/CollectorSpoolReport'
    CollectorSpoolReport:
      type: object
      additionalProperties: false
      description: Offline spool state of a collector; dropped counters only grow while the collector runs.
      properties:
        messages: { type: integer }
        bytes: { type: integer, format: int64 }
        oldest_age_seconds: { type: integer, format: int64 }
        dropped_messages: { type: integer, format: int64 }
        dropped_bytes: { type: integer, format: int64 }
        backpressure: { type: boolean }
    IGAObject:
      type: object
      additionalProperties: true
    IGAArray:
      type: array
      items:
        $ref: '#/components/schemas/IGAObject'
    IGAListResponse:
      type: object
      properties:
