components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Maximum number of items to return.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip before returning data.
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Free-text search term.
    SortBy:
      name: sort_by
      in: query
      schema:
        type: string
      description: Sort field name.
    SortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction.
    CIStatus:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/CIStatus'
    CITypeID:
      name: ci_type_id
      in: query
      schema:
        type: string
    ClientID:
      name: client_id
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: Upstream delivery failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: A required subsystem is not configured or temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details object.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        trace_id:
          type: string

    PaginationEnvelope:
      type: object
      required: [total, limit, offset, has_more]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    LoginRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string

    CallbackRequest:
      type: object
      required: [code, state]
      properties:
        code:
          type: string
        state:
          type: string

    RefreshRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string

    AuthTokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    AuthCallbackUser:
      type: object
      required: [sub, org_id, permissions]
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        groups:
          type: array
          items:
            type: string
        org_id:
          type: string
        permissions:
          type: array
          items:
            type: string

    AuthCallbackResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokenResponse'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AuthCallbackUser'

    SessionClaims:
      type: object
      required: [sub, org_id, permissions, iat, exp]
      properties:
        sub:
          type: string
        org_id:
          type: string
        client_scope:
          type: string
        permissions:
          type: array
          items:
            type: string
        iat:
          type: string
          format: date-time
        exp:
          type: string
          format: date-time

    CIStatus:
      type: string
      enum: [active, inactive, maintenance, decommissioned, unknown]

    CIDiscoverySource:
      type: string
      enum: [manual, sweep, snmp, ssh, redfish, ipmi, wmi, api, agent, discovery]

    CI:
      type: object
      required: [id, organization_id, ci_type_id, name, status, attributes, is_manual, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        client_id:
          type: string
        site_id:
          type: string
        room_id:
          type: string
        ci_type_id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/CIStatus'
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
        hardware_uuid:
          type: string
        management_ip:
          type: string
        primary_mac:
          type: string
        hostname:
          type: string
        fqdn:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        firmware_version:
          type: string
        sys_object_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        discovery_source:
          $ref: '#/components/schemas/CIDiscoverySource'
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_manual:
          type: boolean
        deleted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCIRequest:
      type: object
      required: [ci_type_id, name]
      properties:
        ci_type_id:
          type: string
        client_id:
          type: string
        site_id:
          type: string
        room_id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/CIStatus'
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
        hardware_uuid:
          type: string
        management_ip:
          type: string
        primary_mac:
          type: string
        hostname:
          type: string
        fqdn:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        firmware_version:
          type: string
        sys_object_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        discovery_source:
          $ref: '#/components/schemas/CIDiscoverySource'

    UpdateCIRequest:
      type: object
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/CIStatus'
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
        hardware_uuid:
          type: string
        management_ip:
          type: string
        primary_mac:
          type: string
        hostname:
          type: string
        fqdn:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        firmware_version:
          type: string
        sys_object_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
        discovery_source:
          $ref: '#/components/schemas/CIDiscoverySource'
        last_seen_at:
          type: string
          format: date-time

    CIListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CI'

