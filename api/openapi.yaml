      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ReviewItem'

    ReviewItemResolveRequest:
      type: object
      required: [action]
      additionalProperties: false
      description: >-
        The resolver is always the authenticated principal (user or service
        account) and is stored as resolved_by; a body naming resolved_by, or
        any other unknown field, is refused with 400.
      properties:
        action:
          type: string
          enum: [merge, new, dismiss, accept, create]
          description: >-
            merge folds the observation into a candidate CI (requires ci_id);
            new creates a CI from the observation; accept applies what the item
            proposes; dismiss closes the item with no change. create is the
            deprecated name of new.
        ci_id:
          type: string
          description: Target candidate CI id, required when action is merge.
        resolution:
          type: string
          description: Optional human-readable resolution note.

