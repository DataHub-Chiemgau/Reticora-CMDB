  /api/v1/webhooks/{id}/rotate-secret:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: >-
        A new secret (generated, or the one given) replaces the current one;
        for 24 hours deliveries are signed with both
        (X-Webhook-Signature, X-Webhook-Signature-Previous), so the receiver
        can switch without losing deliveries (SEC-06). The new secret is
        returned only here.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                secret: {type: string, minLength: 16}
      responses:
        '200':
          description: The new secret
          content:
            application/json:
              schema:
                type: object
                required: [id, secret, previous_secret_expires_at]
                properties:
                  id: {type: string}
                  secret: {type: string}
                  previous_secret_expires_at: {type: string, format: date-time}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/webhooks/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: testWebhook
      tags: [Webhooks]
      summary: Send a test delivery to a webhook subscription
      description: >-
        Sends a single signed `webhook.test` payload to the subscription URL and
        returns the delivery attempt. The endpoint responds with 200 even when the
        receiver rejected the request; inspect `success` and `status_code`.
      responses:
        '200':
          description: Test delivery attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/webhooks/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    get:
      operationId: listWebhookDeliveries
      tags: [Webhooks]
      summary: List the durable delivery history of a webhook subscription
      description: >-
        Returns the persisted deliveries including their retry state. Failed
        deliveries are retried with exponential backoff until `max_attempts` is
        reached.
      parameters:
