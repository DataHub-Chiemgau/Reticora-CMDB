          description: Go duration string.
        severity:
          type: string
          enum: [critical, warning, info]
        enabled:
          type: boolean
          default: true

    GraphQLRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        variables:
          type: object
          additionalProperties: true
        operationName:
          type: string

    GraphQLError:
      type: object
      required: [message]
      properties:
        message:
          type: string

    GraphQLResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/GraphQLError'
