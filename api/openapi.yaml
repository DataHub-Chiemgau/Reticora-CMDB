  /api/v1/locations:
    get:
      operationId: listLocations
      tags: [Locations]
      summary: List nodes of the location tree
      description: >-
        Nodes of the canonical location tree (LOC-10) visible in the caller's
        scope, parents first.
      parameters:
        - { name: parent_id, in: query, schema: { type: string }, description: Only direct children of this node }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/LocationKind' } }
        - { name: root_only, in: query, schema: { type: boolean }, description: Only sites }
        - { name: search, in: query, schema: { type: string }, description: Case-insensitive part of the name }
      responses:
        '200':
          description: Location nodes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/LocationViolation' }
    post:
      operationId: createLocation
      tags: [Locations]
      summary: Create a node of the location tree
      description: >-
        The parent must be of the kind the parent matrix allows (site >
        building > room > rack, site > warehouse > zone > shelf > bin). A site
        is a root and needs client_id; every other node inherits client and
        site from its parent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationCreateRequest' }
      responses:
        '201':
          description: Created node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/LocationViolation' }

  /api/v1/locations/tree:
    get:
      operationId: getLocationTree
      tags: [Locations]
      summary: Read the location tree
      description: >-
        All visible nodes as a forest; a node whose parent is outside the
        caller's scope is a root.
      responses:
        '200':
          description: Location forest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationTreeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/locations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLocation
      tags: [Locations]
      summary: Read a node of the location tree
      responses:
        '200':
          description: Location node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLocation
      tags: [Locations]
      summary: Rename and/or move a node
      description: >-
        Moving re-derives path, site and client of the node and its subtree.
        Sites cannot be moved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdateRequest' }
      responses:
        '200':
          description: Updated node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/LocationViolation' }
    delete:
      operationId: deleteLocation
      tags: [Locations]
      summary: Delete a leaf node
      description: >-
        Refused with 409 while the node has child locations or CIs, assets,
        stock items, movements, rack mounts or role assignments reference it
        (LOC-11). Deleting a site, building, room or rack through its own
        endpoint checks the whole subtree.
      responses:
        '204':
          description: Deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/LocationInUse' }

