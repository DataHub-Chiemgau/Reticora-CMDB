  /api/v1/collectors:
    get:
      operationId: listCollectors
      tags: [Collectors]
      summary: List discovery collectors
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated list of collectors
          content:
            application/json:
