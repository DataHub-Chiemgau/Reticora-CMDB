        startIndex: { type: integer }
        itemsPerPage: { type: integer }
        Resources:
          type: array
          items: { $ref: '#/components/schemas/SCIMResource' }
    CIMergeResult:
      type: object
      required: [merge_id, survivor, victim_id, moved, override_conflicts, tombstone_until, snapshot_until]
      properties:
        merge_id: { type: string, format: uuid }
        survivor: { $ref: '#/components/schemas/CI' }
        victim_id: { type: string, format: uuid }
        moved:
          type: object
          description: Moved rows per reference kind.
          additionalProperties: { type: integer }
        override_conflicts:
          type: array
          description: Fields whose overrides contradict; each opened an override_conflict review.
          items: { type: string }
        tombstone_until: { type: string, format: date-time }
        snapshot_until: { type: string, format: date-time }
    CIUnmergeResult:
      type: object
      required: [merge_id, survivor, victim]
      properties:
        merge_id: { type: string, format: uuid }
        survivor: { $ref: '#/components/schemas/CI' }
        victim: { $ref: '#/components/schemas/CI' }
    RackLayout:
      type: object
      required: [rack, mounts, free]
      properties:
        rack: { $ref: '#/components/schemas/Rack' }
        mounts:
          type: array
          items: { $ref: '#/components/schemas/RackMount' }
        free:
          type: object
          description: Free units per face (front, rear).
          additionalProperties:
            type: array
            items: { type: integer }
    PutRackMountRequest:
      type: object
      required: [position_u]
      properties:
        position_u: { type: integer, minimum: 1 }
        height_u: { type: integer, minimum: 1, default: 1 }
        face:
          type: string
          enum: [front, rear, both]
          default: front
    FilterExpr:
      type: object
      description: >-
        One node of the filter AST (SRC-03): exactly one of and, or, not or
        a comparison (field, op, value).
      properties:
        and:
          type: array
          items: { $ref: '#/components/schemas/FilterExpr' }
        or:
          type: array
          items: { $ref: '#/components/schemas/FilterExpr' }
        not: { $ref: '#/components/schemas/FilterExpr' }
        field:
          type: string
          description: A column of the entity kind, attributes.<key> or (CIs) asset.<field>.
        op:
          type: string
          enum: [eq, ne, lt, lte, gt, gte, like, in, exists]
        value:
          description: >-
            A value of the field's kind (UUID, RFC 3339 time or date, number,
            boolean or string); a non-empty list of them for in; true, false
            or nothing for exists.
    SavedViewSortKey:
      type: object
      required: [field]
      properties:
        field: { type: string }
        dir: { type: string, enum: [asc, desc], default: asc }
    SavedView:
      type: object
      required: [id, organization_id, name, entity_kind, filter_spec, sort, columns, shared, shared_with_roles]
      properties:
        id: { type: string }
        organization_id: { type: string }
        owner_id: { type: string }
        name: { type: string }
        entity_kind: { type: string, enum: [ci, asset] }
        filter_spec:
          type: object
          additionalProperties: true
          description: The filter spec; where holds the filter AST (FilterExpr).
        sort:
          type: array
          items: { $ref: '#/components/schemas/SavedViewSortKey' }
        columns:
          type: array
          items: { type: string }
        shared: { type: boolean }
        shared_with_roles:
          type: array
          description: Role or custom role ids whose holders may read the view.
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SavedViewRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        entity_kind: { type: string, enum: [ci, asset] }
        filter_spec:
          type: object
          additionalProperties: true
        sort:
          type: array
          items: { $ref: '#/components/schemas/SavedViewSortKey' }
        columns:
          type: array
          items: { type: string }
        shared: { type: boolean }
        shared_with_roles:
          type: array
          items: { type: string }
    ImpactAnalysis:
      type: object
      required: [failed_cis, impacted, count, summary]
      properties:
        failed_ci_id:
          type: string
          description: The failed CI (single-CI short form only).
        failed_ci:
          $ref: '#/components/schemas/TopologyNode'
        failed_cis:
          type: array
          items: { $ref: '#/components/schemas/TopologyNode' }
        rel_type: { type: string }
        categories:
          type: array
          items: { type: string }
        depth: { type: integer }
        impacted:
          type: array
          description: >-
            The impacted CIs with every field, certain ones first, then by
            name. The answer with fields (API-02) is an ImpactAnalysisFields.
          items: { $ref: '#/components/schemas/ImpactNode' }
        count: { type: integer }
        summary:
          $ref: '#/components/schemas/ImpactSummary'
    ImpactAnalysisFields:
      type: object
      description: >-
        The answer of /api/v1/impact and /api/v1/impact/{ci_id} with fields
        (API-02): the properties of ImpactAnalysis, but each impacted CI
        carries its id and the selected fields only (ImpactNodeFields).
      required: [failed_cis, impacted, count, summary]
      properties:
        failed_ci_id:
          type: string
          description: The failed CI (single-CI short form only).
        failed_ci:
          $ref: '#/components/schemas/TopologyNode'
        failed_cis:
          type: array
          items: { $ref: '#/components/schemas/TopologyNode' }
        rel_type: { type: string }
        categories:
          type: array
          items: { type: string }
        depth: { type: integer }
        impacted:
          type: array
          description: The impacted CIs, certain ones first, then by name.
          items: { $ref: '#/components/schemas/ImpactNodeFields' }
        count: { type: integer }
        summary:
          $ref: '#/components/schemas/ImpactSummary'
    ImpactSummary:
      type: object
      required: [failed, impacted, certain, heuristic, by_category]
      properties:
        failed: { type: integer }
        impacted: { type: integer }
        certain: { type: integer }
        heuristic: { type: integer }
        by_category:
          type: object
          description: Impacted CIs per category of the last hop of their path.
          additionalProperties: { type: integer }
    ImpactNode:
      allOf:
        - $ref: '#/components/schemas/TopologyNode'
        - type: object
          required: [heuristic, hops, via, path]
          properties:
            heuristic:
              type: boolean
              description: Reached only over an undirected network edge (connected_to), a second-class path (IMP-03).
            hops: { type: integer, description: Length of the shortest path from the failed CI. }
            via:
              $ref: '#/components/schemas/ImpactVia'
            relay:
              $ref: '#/components/schemas/ImpactRelay'
            path:
              type: array
              description: >-
                Shortest path from the failed CI with its relationship types
                (IMP-02). It equals the path rebuilt from via: from the CI
                back along via to a failed CI; on the path of a heuristic CI
                a certain CI on the way continues over its relay where it has
                one. Each step's category and heuristic flag follow from the
                relationship type.
              items: { $ref: '#/components/schemas/ImpactPathStep' }
    ImpactNodeFields:
      type: object
      required: [id]
      description: >-
        An impacted CI in the answer with fields (API-02): its id and the
        selected properties of ImpactNode; a property that is not selected
        is absent. A selected property has the meaning and the omission
        rule it has in ImpactNode (client_id, site_id, management_ip and
        relay are absent when empty).
      properties:
        id: { type: string }
        name: { type: string }
        ci_type: { type: string }
        status: { type: string }
        client_id: { type: string }
        site_id: { type: string }
        management_ip: { type: string }
        heuristic: { type: boolean }
        hops: { type: integer }
        via:
          $ref: '#/components/schemas/ImpactVia'
        relay:
          $ref: '#/components/schemas/ImpactRelay'
        path:
          type: array
          items: { $ref: '#/components/schemas/ImpactPathStep' }
    ImpactVia:
      type: object
      required: [ci_id, rel_type]
      description: >-
        The last step of the shortest path (IMP-02): the CI the failure comes
        from and the relationship type it passes.
      properties:
        ci_id: { type: string }
        rel_type: { type: string }
    ImpactRelay:
      allOf:
        - $ref: '#/components/schemas/ImpactVia'
      description: >-
        Only on a certain CI that the shortest path over all relationships
        (connected_to included) reaches over another step than via: the step
        the paths of heuristic CIs behind it take.
    ImpactPathStep:
      type: object
      required: [from_ci_id, to_ci_id, rel_type, category]
      properties:
        from_ci_id: { type: string }
        to_ci_id: { type: string }
        rel_type: { type: string }
        category: { type: string }
        heuristic: { type: boolean }
    CIBulkResult:
      type: object
      required: [action, total, succeeded, failed, items]
      properties:
        action: { type: string }
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, result, code]
            properties:
              id: { type: string }
              result: { type: string, enum: [ok, error] }
              code: { type: integer }
              error: { type: string }
    CITypeChangeResult:
      type: object
      required: [ci, findings, changed]
      properties:
        ci: { $ref: '#/components/schemas/CI' }
        changed:
          type: boolean
          description: False when the CI already had the type.
        findings:
          type: array
          description: Required attributes of the target type the CI does not carry.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    HistoryChange:
      type: object
      required: [id, entity_type, entity_id, change_type, created_at]
      properties:
        id: { type: string }
        organization_id: { type: string, format: uuid }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        actor_id: { type: string }
        change_type:
          type: string
          description: The change type, or the audit action for source audit.
        field_name: { type: string }
        old_value: {}
        new_value: {}
        comment: { type: string }
        created_at: { type: string, format: date-time }
        source:
          type: string
          enum: [ci_change, entity_change, audit]
          description: The trail of the entry (CI history only).
        site_id:
          type: string
          format: uuid
          description: The site of the CI when the change was made.
    HistoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/HistoryChange' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        has_more: { type: boolean }
        next_cursor:
          type: string
          description: Opaque signed cursor for the next page (API-02); absent on the last page.
    ProblemDetail:
      type: object
      description: >-
        RFC 7807 Problem Details object (API-03). Every error response
        (4xx/5xx) is `application/problem+json` and carries `trace_id`, the
        request id also returned in the `X-Request-ID` header.
      required: [type, title, status, trace_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        trace_id:
          type: string
          description: Request id of the failed request (equals the X-Request-ID response header).
        field:
          type: string
          description: Request field a 400 or 409 refers to (e.g. the unique `name` of a client).

    PaginationEnvelope:
      type: object
      required: [total, limit, offset, has_more]
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type: string
          description: |
            Opaque cursor for the next page. Absent when no further rows follow.

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: >-
            Result per configured dependency; a dependency the instance is
            not configured for has no key.
          properties:
            database:
              type: string
              enum: [ok, unavailable]
              description: PostgreSQL with the required extensions and the DDL event trigger.
            redis:
              type: string
              enum: [ok, unavailable]
            object_storage:
              type: string
              enum: [ok, unavailable]
              description: >-
                S3 endpoint (RETICORA_S3_ENDPOINT) at the host:port its client
                connects to.
            nats:
              type: string
              enum: [ok, unavailable]
            smtp:
              type: string
              enum: [ok, unavailable]
              description: >-
                Central SMTP server, only with RETICORA_SMTP_HOST: connection,
                220 greeting and EHLO in the configured TLS mode (WP-442).
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          example:
            database: ok
            redis: ok
            smtp: unavailable
        details:
          type: object
          description: >-
            Informational figures per subsystem; they never change the
            status. A detail that cannot be read is `{"error": "unavailable"}`.
          properties:
            ingest:
              oneOf:
                - $ref: '#/components/schemas/IngestBacklog'
                - $ref: '#/components/schemas/ReadinessDetailUnavailable'
          additionalProperties: true

    ReadinessDetailUnavailable:
      type: object
      description: >-
        A readiness detail that could not be read, or has no sample yet; the
        cause is logged.
      required: [error]
      properties:
        error:
          type: string
          enum: [unavailable]

    IngestBacklog:
      type: object
      description: >-
        Backlog of the ingest consumers (WP-334, NFR-03): per lane the
        messages not yet delivered plus those delivered but unacknowledged,
        summed over all organizations. `legacy` is the consumer of the
        releases before the lanes; lanes beyond `lanes` are being drained.
        The figures are the last sample the ingest worker takes every 30
        seconds (`sampled_at`); a request never reads them from NATS. Only
        an instance that runs the ingest worker reports the detail; before
        its first sample it reports the detail as unavailable.
      required: [lanes, backlog, total, sampled_at]
      properties:
        lanes:
          type: integer
          minimum: 1
          maximum: 16
          description: RETICORA_INGEST_LANES of this instance.
        backlog:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          example:
            '0': 12
            '1': 0
            '2': 7
            '3': 0
            legacy: 0
        total:
          type: integer
          minimum: 0
          example: 19
        sampled_at:
          type: string
          format: date-time
          description: When the backlog was read (UTC).
          example: '2026-10-15T08:30:00.125Z'

    CallbackRequest:
      type: object
      required: [code, state, code_verifier]
      properties:
        code:
          type: string
        state:
          type: string
        code_verifier:
          type: string
          description: PKCE code verifier generated by the browser client.

    AuthConfigResponse:
      type: object
      required: [issuer, client_id, scopes, authorization_endpoint, token_endpoint, pkce_required]
      properties:
        issuer:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
        scopes:
          type: array
          items:
            type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        end_session_endpoint:
          type: string
        pkce_required:
          type: boolean

    AuthTokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    AuthCallbackUser:
      type: object
      required: [sub, org_id, permissions]
      properties:
        sub:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        groups:
          type: array
          items:
            type: string
        org_id:
          type: string
        permissions:
          type: array
          items:
            type: string

    AuthCallbackResponse:
      allOf:
        - $ref: '#/components/schemas/AuthTokenResponse'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AuthCallbackUser'

    SessionClaims:
      type: object
      description: |
        Session JWT claims (AUT-02). cls, sts and tms are the client, site and
        team scope: null for the whole organization, a list otherwise (an
        empty list grants none).
      required: [sub, org, scopes, iat, exp]
      properties:
        sub:
          type: string
        org:
          type: string
        scopes:
          type: array
          items:
            type: string
        cls:
          type: [array, 'null']
          items:
            type: string
        sts:
          type: [array, 'null']
          items:
            type: string
        tms:
          type: [array, 'null']
          items:
            type: string
        name:
          type: string
        email:
          type: string
        sid:
          type: string
          description: |
            Session id: the refresh family started at login. Every refresh
            keeps it; the per-session rate limit counts it (API-04).
        jti:
          type: string
        groups:
          type: array
          items:
            type: string
        iat:
          type: integer
          format: int64
          description: Issued at (NumericDate)
        exp:
          type: integer
          format: int64
          description: Expires at (NumericDate)

    CIStatus:
      type: string
      enum: [active, inactive, maintenance, decommissioned, unknown]

    CIDiscoverySource:
      type: string
      description: >-
        Source of the CI (CI-01): a protocol or agent of discovery, api,
        manual entry or a user's import.
      enum: [snmp, ssh, redfish, ipmi, wmi, api, agent, sweep, manual, import]

    CI:
      type: object
      required: [id, organization_id, ci_type_id, name, status, attributes, is_manual, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        client_id:
          type: string
        version:
          type: integer
          format: int64
          readOnly: true
          description: CI version, also the ETag (API-07).
        location_id:
          type: string
          description: >-
            Node of the canonical location tree (DB-05); site_id and room_id
            are derived from it. For a CI linked to an asset it mirrors the
            asset's location and cannot be written (422).
        asset_id:
          type: string
          description: >-
            Asset the CI is linked to (DB-05, AST-04). The asset is canonical
            for serial number, location, physical lifecycle and inventory
            data; they appear read-only under asset.
        asset:
          $ref: '#/components/schemas/CIAssetFacts'
        parent_ci_id:
          type: string
          description: >-
            CI this one is physically part of (chassis → blade, AST-05); the
            relationship contains is projected from it. Cycles are rejected
            (422). The parent is a CI of the same client or an org-wide CI
            (TEN-05).
        lifecycle_state:
          type: string
          readOnly: true
          description: >-
            Software lifecycle; only CI types with a lifecycle model have one,
            and it changes through lifecycle transitions (DB-05).
        health:
          type: string
          readOnly: true
          enum: [ok, warning, critical, unknown]
          description: >-
            Computed from the monitoring state: critical or warning when the
            latest sample of a metric breaches an enabled alert rule of that
            severity, ok with samples and no breach, unknown without recent
            samples (DB-05).
        health_updated_at:
          type: string
          format: date-time
          readOnly: true
        schema_version:
          type: integer
          readOnly: true
          description: >-
            Version of the materialized attribute schema of the CI type
            (ci_type.schema_version) the CI was last written against: the
            system base composed with the type's attributes (MET-16). Set by
            the server when the CI is created or its type or attributes
            change.
        site_id:
          type: string
          readOnly: true
          description: Site of location_id, derived by the server.
        room_id:
          type: string
          readOnly: true
          description: Room of location_id (the location or its nearest room ancestor), derived by the server.
        ci_type_id:
          type: string
          description: >-
            A system type or a type of the CI's organization; the database
            refuses a type of another organization on every write path
            (CI-01, TEN-09).
        name:
          type: string
        status:
          $ref: '#/components/schemas/CIStatus'
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
          description: >-
            Observed serial number used for identity resolution. For a linked
            CI the canonical serial number is asset.serial_number; a
            difference opens a review item serial_mismatch, a manual write is
            rejected (422).
        rfid_tag:
          type: string
          description: RFID tag for direct-access labels and scan flows.
        barcode:
          type: string
          description: Barcode for scan flows.
        hardware_uuid:
          type: string
        management_ip:
          type: string
        primary_mac:
          type: string
        hostname:
          type: string
        fqdn:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        firmware_version:
          type: string
        sys_object_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
          description: >-
            Business attributes, instance attributes under their names (stored in _instance). The namespaces _overrides, _observed, _provenance and _instance are not part of this view (CI-10); the per-field view is GET /api/v1/cis/{id}/fields.
        discovery_source:
          $ref: '#/components/schemas/CIDiscoverySource'
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        is_manual:
          type: boolean
          readOnly: true
          description: >-
            True for a CI a person created — by hand or by import
            (discovery_source manual or import).
        merged_into_id:
          type: string
          readOnly: true
          description: The CI this one was merged into; only the merge sets it.
        deleted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CIAssetFacts:
      type: object
      readOnly: true
      description: Canonical data of the linked asset, shown read-only on the CI (DB-05).
      required: [id, asset_tag, name, status]
      properties:
        id: { type: string }
        asset_tag: { type: string }
        name: { type: string }
        serial_number: { type: string }
        location_id: { type: string }
        lifecycle_state: { type: string, description: Physical lifecycle of the asset. }
        status: { type: string }
        barcode: { type: string }
        rfid_tag: { type: string }
        purchase_date: { type: string, format: date }
        warranty_end: { type: string, format: date }
        supplier: { type: string }
        invoice_number: { type: string }

    CreateCIRequest:
      type: object
      required: [ci_type_id, name]
      properties:
        ci_type_id:
          type: string
          description: >-
            ID (UUID) of an active system type or an active type of the
            organization (GET /api/v1/ci-types; CI-01, TEN-09), not its key.
            Any other value is rejected (422 on ci_type_id); an unknown ID
            and a type of another organization get the same answer.
        client_id:
          type: string
        location_id:
          type: string
          description: Node of the location tree; site and room of the CI follow from it.
        asset_id:
          type: string
          description: >-
            Links the CI to an asset (empty string unlinks on update); the CI
            then takes the asset's location, a location in the same request
            is rejected (422).
        parent_ci_id:
          type: string
          description: >-
            Containing CI: a visible CI of the CI's client or an org-wide CI
            (TEN-05). A CI the principal cannot see, a deleted or unknown CI
            is rejected (422 "parent CI not found"), so is a CI of another
            client (422) and a cycle (422).
        name:
          type: string
        status:
          $ref: '#/components/schemas/CIStatus'
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
        hardware_uuid:
          type: string
        management_ip:
          type: string
        primary_mac:
          type: string
        hostname:
          type: string
        fqdn:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        firmware_version:
          type: string
        sys_object_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
          description: >-
            The keys _overrides, _observed, _provenance and _instance are reserved (GLO-13): 400 with the field.
        discovery_source:
          allOf:
            - $ref: '#/components/schemas/CIDiscoverySource'
          description: >-
            Defaults to manual. With manual or import the CI is manual
            (is_manual); an unknown source is rejected (400 with the field).

    UpdateCIRequest:
      description: >-
        A manual change. attributes is an RFC 7396 merge patch (nested objects
        merge, null removes a member). Every changed field gets a protected
        override that discovery does not overwrite.
      type: object
      properties:
        change_reason:
          type: string
          description: Reason stored with the overrides of this change.
        name:
          type: string
        status:
          $ref: '#/components/schemas/CIStatus'
        client_id:
          type: string
          description: >-
            A CI that moves to a client cannot contain CIs of another client
            or org-wide CIs (422 on client_id, TEN-05); an org-wide CI (empty
            string) can.
        location_id:
          type: string
          description: Node of the location tree; site and room of the CI follow from it.
        asset_id:
          type: string
          description: >-
            Links the CI to an asset (empty string unlinks on update); the CI
            then takes the asset's location, a location in the same request
            is rejected (422).
        parent_ci_id:
          type: string
          description: >-
            Containing CI (empty string clears it): a visible CI of the CI's
            client or an org-wide CI (TEN-05). A CI the principal cannot see,
            a deleted or unknown CI is rejected (422 "parent CI not found"),
            so is a CI of another client (422) and a cycle (422); the parent
            is checked again when client_id changes.
        manufacturer:
          type: string
        model:
          type: string
        serial_number:
          type: string
        hardware_uuid:
          type: string
        management_ip:
          type: string
        primary_mac:
          type: string
        hostname:
          type: string
        fqdn:
          type: string
        os_name:
          type: string
        os_version:
          type: string
        firmware_version:
          type: string
        sys_object_id:
          type: string
        attributes:
          type: object
          additionalProperties: true
          description: >-
            RFC 7396 merge patch. The keys _overrides, _observed, _provenance and _instance are reserved (GLO-13): 400 with the field.
        discovery_source:
          $ref: '#/components/schemas/CIDiscoverySource'
        last_seen_at:
          type: string
          format: date-time

    CIListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CI'

    CIChange:
      type: object
      required: [id, organization_id, ci_id, change_type, created_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        ci_id:
          type: string
        actor_id:
          type: string
        change_type:
          type: string
          enum: [create, update, delete, status_change, relationship_change, attribute_change]
        field_name:
          type: string
        old_value: {}
        new_value: {}
        comment:
          type: string
        created_at:
          type: string
          format: date-time

    CIChangeListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CIChange'

    AuditEntry:
      type: object
      required: [id, organization_id, seq, timestamp, action, resource_type, source, hash]
      properties:
        id:
          type: string
        organization_id:
          type: string
        seq:
          type: integer
          format: int64
          description: Position in the organization's audit chain, without gaps from 1 (AUD-04).
        timestamp:
          type: string
          format: date-time
        actor_id:
          type: string
        actor_type:
          type: string
          enum: [user, system, collector, api_key]
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        changes:
          type: object
          additionalProperties: true
          description: >-
            What changed. Domain entries carry old and new values; the entry
            of a write request names the route, the response status, the
            written fields and, for resources without a UUID, resource_key.
        source:
          $ref: '#/components/schemas/AuditSource'
        request_id:
          type: string
          description: The X-Request-ID of the request that made the change.
        correlation_id:
          type: string
          description: The X-Correlation-ID of the operation (the request id when the caller sent none).
        previous_hash:
          type: string
        hash:
          type: string

    AuditSource:
      type: string
      enum: [ui, api, collector, import, system]
      description: Where a change came from (AUD-07).

    AuditEntryListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AuditEntry'

    AuditVerifyResult:
      type: object
      required: [intact, checked]
      properties:
        intact:
          type: boolean
        checked:
          type: integer
          description: Number of entries verified before the chain broke, or the total when intact.
        broken_id:
          type: string
        broken_at:
          type: integer
          description: Chain position (seq) where the first violation was found.
        broken_reason:
          type: string
          description: '`sequence gap`, `previous_hash mismatch` or `hash mismatch`.'

    RelationshipTypeCategory:
      type: string
      enum: [network, power, hosting, logical, physical]

    RelationshipImpactDirection:
      type: string
      enum: [source_depends_on_target, target_depends_on_source, none, undirected]
      description: >-
        Which end of an edge depends on the other (REL-01, CH27): the
        source on the target (powered_by, hosted_on, depends_on), the
        target on the source (powers, contains), none (no impact) or
        undirected (connected_to, a heuristic both ways).

    RelationshipTypeDefinition:
      type: object
      description: Relationship type metadata (REL-01). contains, mounted_in and located_in are projected, not stored (CH27).
      required: [id, key, display_name, reverse_name, directed, category, impact_direction, redundant,
        allowed_source_types, allowed_target_types, cardinality, is_system, created_at, updated_at]
      properties:
        id: { type: string }
        organization_id: { type: string, description: Empty for a system type. }
        key: { type: string }
        display_name: { type: string }
        reverse_name: { type: string }
        directed: { type: boolean }
        category: { $ref: '#/components/schemas/RelationshipTypeCategory' }
        impact_direction: { $ref: '#/components/schemas/RelationshipImpactDirection' }
        redundant:
          type: boolean
          description: Edges of the type are redundant feeds (powered_by, member_of_cluster); impact needs all of them to fail.
        allowed_source_types: { type: array, items: { type: string } }
        allowed_target_types: { type: array, items: { type: string } }
        cardinality: { type: string }
        is_system: { type: boolean, readOnly: true }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RelationshipTypeUpsert:
      type: object
      description: >-
        Create (key, display_name, reverse_name required; defaults directed,
        logical, source_depends_on_target) or change a relationship type.
        impact_direction undirected belongs to undirected types only.
      properties:
        key: { type: string }
        display_name: { type: string }
        reverse_name: { type: string }
        directed: { type: boolean }
        category: { $ref: '#/components/schemas/RelationshipTypeCategory' }
        impact_direction: { $ref: '#/components/schemas/RelationshipImpactDirection' }
        redundant: { type: boolean }
        allowed_source_types: { type: array, items: { type: string } }
        allowed_target_types: { type: array, items: { type: string } }
        cardinality: { type: string }
        description: { type: string }

    RelationshipType:
      type: string
      enum: [connected_to, hosted_on, depends_on, member_of, powers, powered_by, stores, monitors, backs_up]

    Relationship:
      type: object
      required: [id, organization_id, source_ci_id, target_ci_id, rel_type, attributes, source, created_at, updated_at]
      properties:
        id:
          type: string
        organization_id:
          type: string
        source_ci_id:
          type: string
        target_ci_id:
          type: string
          description: Empty for mounted_in and located_in, whose target is target_location_id.
        projected:
          type: boolean
          readOnly: true
          description: >-
            Structural relationship derived from parent_ci_id (contains),
            rack_mount (mounted_in) or the CI's location (located_in); it
            cannot be changed through this API (DB-05, CH27).
        target_location_id:
          type: string
          readOnly: true
          description: Rack (mounted_in) or location (located_in) of a projected relationship.
        rel_type:
          $ref: '#/components/schemas/RelationshipType'
        attributes:
          type: object
          additionalProperties: true
        source:
          type: string
          description: >-
            Provenance (REL-08) – manual, discovery, agent, import, api, integration, workflow
            ("rule" is accepted as workflow). attributes.provenance records actor, actor type and
            time of the edge. Discovery edges are re-confirmed when seen again (last_seen_at,
            last_confirmed_at) and removed with relationship.removed after max(7 days, 5 × the scope
            interval) without confirmation or when a suppression covers them (TOP-02).
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_interface_id:
          type: string
          description: Port of the source CI the edge starts at (REL-02).
        target_interface_id:
          type: string
          description: Port of the target CI the edge ends at (REL-02).
        verification_state:
          type: string
          enum: [unverified, verified, disputed, stale]
        last_confirmed_at:
          type: string
          format: date-time
          readOnly: true
          description: Last time the source of the edge confirmed it.
        verified_by:
          type: string
          readOnly: true
          description: User who verified the edge; cleared when it leaves the verified state.
        verified_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRelationshipRequest:
      type: object
      required: [source_ci_id, target_ci_id, rel_type]
      properties:
        source_ci_id:
          type: string
        target_ci_id:
          type: string
        rel_type:
          $ref: '#/components/schemas/RelationshipType'
        attributes:
          type: object
          additionalProperties: true
