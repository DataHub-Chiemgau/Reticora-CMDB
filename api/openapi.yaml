    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: confirmAgentSite
      tags: [Agents]
      summary: Confirm the site of a roaming agent
      description: The site must belong to the agent's client; the suggestion is cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAgentSiteRequest'
      responses:
        '200':
          description: Agent with confirmed site
