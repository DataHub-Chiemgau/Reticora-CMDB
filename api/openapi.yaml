  /api/v1/topology/cis/{id}/impact:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
      - name: depth
        in: query
        schema: { type: integer, default: 20, maximum: 20 }
        description: Maximum hops of the impact paths (IMP-02); defaults to 20.
      - name: rel_type
        in: query
        schema: { type: string }
        description: Restrict the simulation to one dependency class (e.g. powered_by, connected_to, hosted_on).
      - name: categories
        in: query
        schema: { type: string }
        description: >-
          Comma-separated relationship categories to follow (network, power,
          hosting, logical, physical); physical includes the containment
          projected from parent_ci_id. An unknown category is 422.
    get:
      operationId: getCIImpactLegacy
      deprecated: true
      x-deprecated-at: '2026-10-13'
      x-sunset: '2027-10-14'
      x-successor: '/api/v1/impact/{ci_id}'
      tags: [Topology]
      summary: Failure simulation — CIs that lose connectivity/power/hosting when this CI fails
      description: >-
        Follows the impact_direction of each relationship type (IMP-01,
        CH27): over source_depends_on_target the failure of the target
        reaches the source, over target_depends_on_source the other way,
        none does not propagate. connected_to is undirected and only a
        network heuristic: CIs reached only through it carry heuristic true
        (IMP-03). Powers the Ausfallsimulation in the topology view. Answers
        with every field of the impacted CIs until its sunset; the sparse
        fieldset (fields) is only offered by the successor.
      responses:
        '200':
          description: Impact analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactAnalysis'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Unknown category.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/impact:
    get:
      operationId: getMultiImpact
      tags: [Topology]
      summary: Joint impact of several CIs failing at once (IMP-05)
      description: >-
        Redundancy analysis and maintenance windows: the CIs in ci_ids fail
        together; a CI behind a redundant type (powered_by,
        member_of_cluster) is impacted only when all its providers are among
        the failed or impacted CIs (IMP-04). The answer lists the failed
        CIs, the impacted CIs with their shortest paths and a summary.
      parameters:
        - name: ci_ids
          in: query
          required: true
          schema: { type: string }
          description: Comma-separated ids of the failing CIs (at most 100).
        - name: categories
          in: query
          schema: { type: string }
          description: Comma-separated relationship categories to follow (network, power, hosting, logical, physical).
        - name: rel_type
          in: query
          schema: { type: string }
          description: Restrict the analysis to one relationship type.
        - name: depth
          in: query
          schema: { type: integer, default: 20, maximum: 20 }
          description: Maximum hops of the impact paths.
        - $ref: '#/components/parameters/ImpactFields'
      responses:
        '200':
          description: >-
            Impact analysis result: an ImpactAnalysis without fields, an
            ImpactAnalysisFields with fields (API-02).
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/ImpactAnalysis' }
                  - { $ref: '#/components/schemas/ImpactAnalysisFields' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Unknown category, unknown field in fields or more than 100 CIs.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

