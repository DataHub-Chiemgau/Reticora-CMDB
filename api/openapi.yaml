              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleAssignment'
                  tickets:
                    type: object
                    properties:
                      reported:
                        type: array
                        items:
                          $ref: '#/components/schemas/Ticket'
                      assigned:
                        type: array
                        items:
