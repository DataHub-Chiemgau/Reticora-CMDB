    DeviceRecord:
      type: object
      description: >-
        One device observation (DIS-05). Mirrors api/devicerecord.schema.json,
        the normative schema; observed_at is the source time (GLO-12).
      required: [record_id, observed_at, source, target_ip, identity, classification, system]
      additionalProperties: false
      properties:
        record_id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        source:
          type: string
          enum: [redfish, ipmi, agent, snmp, api, integration, wmi, ssh, nas, sweep]
        target_ip: { type: string }
        vrf_id: { type: string, format: uuid }
        scope_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        identity:
          type: object
          additionalProperties: false
          properties:
            serial_number: { type: string }
            hardware_uuid: { type: string, format: uuid }
            primary_mac: { type: string }
            hostname: { type: string }
            fqdn: { type: string }
        classification:
          type: object
          required: [ci_type]
          additionalProperties: false
          properties:
            ci_type: { type: string, minLength: 1 }
            manufacturer: { type: string }
            model: { type: string }
            sys_object_id: { type: string }
            profile: { type: string }
        system:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
            description: { type: string }
            os_name: { type: string }
            os_version: { type: string }
            firmware_version: { type: string }
            uptime_seconds: { type: integer, minimum: 0 }
        attributes:
          type: object
          additionalProperties: true
        interfaces:
          type: array
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1 }
              if_index: { type: integer }
              mac: { type: string }
              speed_mbps: { type: integer }
              mtu: { type: integer }
              admin_status: { type: string, enum: [up, down, unknown] }
              oper_status: { type: string, enum: [up, down, unknown] }
              vlan_id: { type: integer, minimum: 1, maximum: 4094 }
              ips:
                type: array
                items:
                  type: object
                  required: [address]
                  additionalProperties: false
                  properties:
                    address: { type: string }
                    prefix_length: { type: integer, minimum: 0, maximum: 128 }
        neighbors:
          type: array
          items:
            type: object
            required: [protocol]
            additionalProperties: false
            properties:
              protocol: { type: string, enum: [lldp, cdp, arp, fdb] }
              local_interface: { type: string }
              remote_mac: { type: string }
              remote_ip: { type: string }
              remote_hostname: { type: string }
              remote_interface: { type: string }
        power:
          type: object
          additionalProperties: false
          properties:
            device_type: { type: string }
            draw_watts: { type: number, minimum: 0 }
            outlets:
              type: array
              items:
                type: object
                required: [name]
                additionalProperties: false
                properties:
                  name: { type: string, minLength: 1 }
                  state: { type: string }

