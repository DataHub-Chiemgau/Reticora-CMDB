    get:
      operationId: listRelationships
      tags: [Relationships]
      summary: List relationships
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: ci_id
          in: query
          schema:
            type: string
          description: Return relationships where the CI is either the source or target.
        - name: source_ci_id
          in: query
          schema:
            type: string
        - name: target_ci_id
          in: query
          schema:
            type: string
        - name: rel_type
          in: query
          schema:
            $ref: '#/components/schemas/RelationshipType'
      responses:
        '200':
          description: Paginated list of relationships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createRelationship
      tags: [Relationships]
      summary: Create a relationship
      description: >-
        contains, contained_by, parent_of, child_of, mounted_in and located_in
        are projected and cannot be stored (422, REL-01, CH27): containment is
        the CI's parent_ci_id, mounted_in follows from the rack mount,
        located_in from the CI's location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationshipRequest'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Structural relationship type, which is projected and cannot be stored
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500':
          $ref: '#/components/responses/InternalServerError'

