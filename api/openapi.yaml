        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentLinkRequest'
      responses:
        '201':
          description: Document linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/invitations:
    get:
      operationId: listInvitations
      tags: [Users]
      summary: List the organization's invitations (TLC-03)
      description: Status is derived from acceptance and expiry (pending, accepted, expired). Requires user:manage.
      responses:
        '200':
          description: Invitations, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: issueInvitation
      tags: [Users]
      summary: Invite an address with a predefined role and scope (TLC-03)
      description: >-
        The invitation is valid for seven days. The response carries the
        token once; only its hash is stored. Role and scope must exist in
        the organization (422 otherwise); a client role (scope client) is
        invited with scope_type client only, a site role with scope_type
        site only, an organization role with any scope_type (422 field
        scope_type otherwise, F-305). Grant ceiling (RBA-03, F-015): the
        issuer must hold user:manage and every permission of the role in a
        scope covering the invitation's scope (a client covers its sites,
        site.client_id); otherwise 403, nothing is stored or audited. A
        pending invitation for the same address is a conflict (renew it
        instead). In the same transaction the event invitation.created
        (NTF-05) mails the invitee the organization name, the expiry and
        the link RETICORA_INVITATION_ACCEPT_URL?token=<token>; a refused
        issue (403, 409, 422) creates no event. Webhook deliveries of the
        event leave out the link. Without RETICORA_INVITATION_ACCEPT_URL
        the server answers 503 (invitations not configured), like the
        signup without verification page. Requires user:manage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
      responses:
        '201':
          description: Invitation issued, with its token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Users]
      security: []
      summary: Accept an invitation (TLC-03)
      description: >-
        The token is the credential; the request passes the pre-auth limit
        (AUT-10). The invitation is consumed atomically and once: it creates
        the user with the invited role and scope. With the IdP admin client
        the password creates the IdP account (never stored by Reticora);
        otherwise the user signs in with an existing IdP account of the
        address, which the first login links. 404 for an unknown, revoked
        or used token, 410 for an expired one, 409 when the organization
        already has a user with the address. An org_admin account is bound
        to MFA (Keycloak realm role mfa_required, AUT-09); when that fails,
        the account is deleted again, the acceptance answers 503 and the
        invitation stays open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptance'
      responses:
        '201':
          description: Invitation accepted, user created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: The invitation has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/invitations/{id}/renew:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    post:
      operationId: renewInvitation
      tags: [Users]
      summary: Renew a pending or expired invitation (TLC-03)
      description: >-
        A new token and seven more days; the old token stops working. An
        accepted invitation is 409. The grant ceiling of the issue applies
        to the renewing principal, not to the original issuer: it must hold
        user:manage and every permission of the invited role in a scope
        covering the invitation's scope (403 otherwise, nothing changes).
        Like the issue, the renewal mails the invitee the new link and
        expiry (invitation.created); without RETICORA_INVITATION_ACCEPT_URL
        it answers 503 (invitations not configured). Requires user:manage.
      responses:
        '200':
          description: Invitation renewed, with its new token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/invitations/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceID'
    delete:
      operationId: revokeInvitation
      tags: [Users]
      summary: Revoke a pending or expired invitation (TLC-03)
      description: An accepted invitation stays as a record (409). Requires user:manage.
      responses:
        '204':
          description: Invitation revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
