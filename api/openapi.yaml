  /api/v1/agents/enroll:
    post:
      operationId: enrollAgent
      tags: [Agents]
      summary: Register an endpoint agent with a single-use enrollment token
      description: >-
        The enrollment token is consumed in the same transaction and binds the
        agent to the token's client and, unless it is a roaming token, its site
        (AGT-06). For roaming agents a site is suggested from `ip_address`
        (subnet of the client) and must be confirmed manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEnrollRequest'
      responses:
        '201':
          description: Agent registered; returns the agent with its central policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/agents/enrollment-tokens:
    post:
      operationId: createAgentEnrollmentToken
      tags: [Agents]
      summary: Create a single-use agent enrollment token for a client and site
      description: >-
        The secret (`token`) is returned once and stored only as a hash.
        Without `site_id` the token enrolls roaming devices: they keep the
        client, their site is suggested from the network fingerprint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentEnrollmentTokenRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEnrollmentToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

