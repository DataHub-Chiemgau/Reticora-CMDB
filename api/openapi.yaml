        is_system: { type: boolean }
        is_active: { type: boolean }
        is_logical: { type: boolean }
        is_observable:
          type: boolean
          description: The offline detector watches CIs of the type (LCY-05); true for physical, false for logical types by default.
        schema_version:
          type: integer
          minimum: 1
          description: Version of the generated attribute schema.
        attribute_schema:
          type: object
          readOnly: true
          additionalProperties: true
          description: JSON Schema 2020-12 generated from the type's attribute definitions; read-only (DB-03).
        required_fields:
          type: array
          readOnly: true
          items: { type: string }
        version: { type: integer }
        cloned_from_id: { type: string }
        template_key: { type: string }
        lifecycle_definition_id: { type: string }
        capabilities: { type: object, additionalProperties: true }
        allowed_relationship_types:
          type: array
          items: { type: string }
        ui_schema: { type: object, additionalProperties: true }
        compliance_rules:
          type: array
          items: {}
        discovery_mappings:
          type: array
          items: {}
        fields:
          type: array
          items: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
