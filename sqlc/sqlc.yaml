version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "../backend/migrations/"
    gen:
      go:
        package: "sqlcgen"
        out: "../backend/internal/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "inet"
            go_type: "string"
          - db_type: "macaddr"
            go_type: "string"
          - db_type: "jsonb"
            go_type:
              type: "json.RawMessage"
              import: "encoding/json"
          - db_type: "timestamptz"
            go_type: "time.Time"
