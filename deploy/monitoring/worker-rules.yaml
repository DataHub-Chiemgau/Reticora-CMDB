# Alert rules for the background workers (WP-103, OPS-05). The workers
# export reticora_worker_{enabled,up,runs_total,errors_total,
# last_success_timestamp_seconds,backlog} per worker name of their operator
# switch (docs/ops/workers.md), the job queue reticora_job_* per job kind
# (backend/internal/jobs/metrics.go). Alerts route to the operators through
# deploy/monitoring/alertmanager.yaml, by e-mail and over the NTF bridge.
# Unit test: deploy/monitoring/tests/worker-rules.test.yaml
# (tests/monitoring-config.test.sh, CI job monitoring-config).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: reticora-workers
  labels:
    app.kubernetes.io/name: reticora-cmdb
spec:
  groups:
    - name: reticora.workers
      rules:
        - alert: ReticoraWorkerStopped
          # Switched on but its loop is not running in this instance.
          expr: reticora_worker_enabled == 1 and on (instance, worker) reticora_worker_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Worker {{ $labels.worker }} stopped on {{ $labels.instance }}"
            description: "The worker is switched on (RETICORA_WORKER_*_ENABLED) but its loop has stopped. Restart the instance and check its log for 'worker stopped unexpectedly'."
        - alert: ReticoraWorkerErrors
          expr: sum by (worker) (increase(reticora_worker_errors_total[15m])) > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Worker {{ $labels.worker }} keeps failing"
            description: "More than 5 failures in 15 minutes; the worker log names the failing step."
        - alert: ReticoraWorkerNoSuccess
          # Running, but no cycle without error in the last 5 minutes, for
          # 30 minutes: 35 minutes after the last success. A worker that has
          # not completed a cycle without error since its process started has
          # no last-success series and fires 30 minutes after the start
          # (F-295). Every worker records each cycle, an idle one as well
          # (observability.ObserveWorkerRun).
          expr: |
            max by (worker) (reticora_worker_up) == 1
              unless on (worker)
            (time() - max by (worker) (reticora_worker_last_success_timestamp_seconds) < 300)
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "Worker {{ $labels.worker }} has not completed a run for 30 minutes"
            description: "Every cycle of the worker failed for 30 minutes, or none has succeeded since the start (for example database, object storage or NATS unreachable)."
        - alert: ReticoraWorkerBacklog
          # Items keep waiting: queued exports, due webhook deliveries or
          # pending ingest messages.
          expr: max by (worker) (reticora_worker_backlog) > 1000
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Backlog of worker {{ $labels.worker }} above 1000"
            description: "{{ $value }} items are waiting. Check the worker's errors, or run more instances with the worker switched on."
        - alert: ReticoraWorkerBacklogGrowing
          expr: max by (worker) (deriv(reticora_worker_backlog[30m])) > 0 and max by (worker) (reticora_worker_backlog) > 100
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Backlog of worker {{ $labels.worker }} keeps growing"
            description: "The backlog has grown for 30 minutes; the worker does not keep up."
        - alert: ReticoraDocumentScanBacklog
          # Malware scan of document uploads (SEC-09, E-42, WP-735): the
          # oldest queued document.scan has waited for more than 15 minutes,
          # for 10 minutes. Uploads stay locked (pending_scan) meanwhile.
          # Every instance exports the same age from the job table; max
          # keeps one alert.
          expr: max by (kind) (reticora_job_oldest_queued_age_seconds{kind="document.scan"}) > 900
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Malware scan of uploads is backlogged"
            description: "The oldest queued document.scan job has waited {{ $value }} seconds. New document versions stay locked until they are scanned: check that the worker jobs runs and that clamd (RETICORA_CLAMD_ADDR) answers."
        - alert: ReticoraDocumentScanFailing
          # More than 5 failed attempts of document.scan in 15 minutes:
          # clamd unreachable, too slow or refusing the stream. Each instance
          # counts the attempts it ran; the sum covers all of them.
          expr: sum by (kind) (increase(reticora_job_failures_total{kind="document.scan"}[15m])) > 5
          labels:
            severity: warning
          annotations:
            summary: "Malware scan of uploads keeps failing"
            description: "More than 5 document.scan attempts failed in 15 minutes. The versions stay locked (fail-closed) and are rescanned by document.scan_sweep once clamd answers again; check clamd (RETICORA_CLAMD_ADDR) and its log."
