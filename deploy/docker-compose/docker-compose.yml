# Reticora CMDB — Full Deployment Stack
#
# This compose file runs the complete Reticora stack for staging and
# self-hosted production. For development, use the root docker-compose.yml
# instead.
#
# Recommended: run the interactive installer, which generates the .env file,
# builds the images, applies the database migrations and starts the stack:
#   ./install-cloud.sh
#
# Manual usage (from the deploy/docker-compose directory, so that
# docker-compose.override.yml with the source-build config is merged
# automatically):
#   cd deploy/docker-compose
#   docker compose --env-file .env up -d
# To run with prebuilt registry images instead, set RETICORA_SERVER_IMAGE /
# RETICORA_FRONTEND_IMAGE in .env and rename docker-compose.override.yml to
# docker-compose.override.yml.disabled (install-cloud.sh does this for you).

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reticora
      POSTGRES_USER: reticora
      POSTGRES_PASSWORD: ${RETICORA_DB_PASSWORD:?RETICORA_DB_PASSWORD must be set (see install-cloud.sh)}
    # Port is bound to localhost only; the API reaches the database via the
    # internal compose network. Remove the ports block entirely if no local
    # psql access is needed.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reticora"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      # Probe the client port — always bound, unlike the HTTP monitor.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8222/healthz 2>/dev/null || nc -z 127.0.0.1 4222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RETICORA_S3_ACCESS_KEY:?RETICORA_S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${RETICORA_S3_SECRET_KEY:?RETICORA_S3_SECRET_KEY must be set}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD must be set}
    volumes:
      - keycloakdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    # `start` with an imported realm: users created via the admin console are
    # persisted in keycloak-db (the previous `start-dev` used an in-memory
    # database, losing everything on restart). The realm is re-imported only
    # when the container is recreated.
    command: start --import-realm --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY: edge
    ports:
      - "${RETICORA_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # .generated/realm-reticora.json is written by install-cloud.sh with the
      # configured OIDC client secret substituted.
      - ./.generated:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  server:
    image: ${RETICORA_SERVER_IMAGE:-reticora-server:latest}
    # build: lives in docker-compose.override.yml so this file also works
    # standalone with prebuilt registry images.
    restart: unless-stopped
    environment:
      RETICORA_PORT: "8080"
      RETICORA_DATABASE_URL: "postgres://reticora:${RETICORA_DB_PASSWORD}@postgres:5432/reticora?sslmode=disable"
      RETICORA_NATS_URL: "nats://nats:4222"
      RETICORA_REDIS_URL: "redis://redis:6379"
      RETICORA_S3_ENDPOINT: "minio:9000"
      RETICORA_S3_BUCKET: "reticora"
      RETICORA_S3_ACCESS_KEY: "${RETICORA_S3_ACCESS_KEY}"
      RETICORA_S3_SECRET_KEY: "${RETICORA_S3_SECRET_KEY}"
      RETICORA_OIDC_ISSUER_URL: "${RETICORA_OIDC_ISSUER_URL:-http://localhost:8180/realms/reticora}"
      RETICORA_OIDC_CLIENT_ID: "${RETICORA_OIDC_CLIENT_ID:-reticora-app}"
      RETICORA_OIDC_CLIENT_SECRET: "${RETICORA_OIDC_CLIENT_SECRET:-}"
      RETICORA_OIDC_REDIRECT_URL: "${RETICORA_OIDC_REDIRECT_URL:-}"
      RETICORA_ENVIRONMENT: "production"
      # Session-token signature verification is mandatory in production; the
      # RS256 private key is mounted from ./secrets/session-private.pem
      # (generated by install-cloud.sh).
      RETICORA_SESSION_KEY_PATH: "/etc/reticora/session/private.pem"
      RETICORA_MASTER_KEY: ${RETICORA_MASTER_KEY:?RETICORA_MASTER_KEY must be set}
    volumes:
      - ./secrets/session-private.pem:/etc/reticora/session/private.pem:ro
    ports:
      - "${RETICORA_SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    image: ${RETICORA_FRONTEND_IMAGE:-reticora-frontend:latest}
    # build: lives in docker-compose.override.yml so this file also works
    # standalone with prebuilt registry images.
    restart: unless-stopped
    # The unprivileged nginx worker must be able to write its pid file and
    # temp directories. frontend/nginx.conf places all of them under /tmp
    # (a tmpfs is root-owned and therefore not writable for the nginx user),
    # so /tmp is backed by a writable tmpfs here.
    user: nginx
    tmpfs:
      - /tmp
    ports:
      - "${RETICORA_FRONTEND_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
  natsdata:
  redisdata:
  miniodata:
  keycloakdb:
