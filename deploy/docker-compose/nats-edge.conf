# Collector NATS endpoint (COL-08, PRI-07, WP-146).
#
# Collectors connect outbound to port 4222 with mutual TLS: the TLS
# handshake comes first (no plaintext INFO), and only clients whose
# certificate chains to the collector CA are accepted. The Reticora server
# (worker nats_edge) writes the CA bundle, this endpoint's server
# certificate and pki/edge.conf (TLS, accounts, authorization callout) into
# the shared PKI volume before the endpoint starts; the endpoint runs with
# /etc/nats as working directory, so the pki/ paths resolve there.
#
# Every connection is authorized by the callout of the server: it checks
# the certificate against the revocation list and the collector's status
# (disabled collectors are refused) and confines the collector to its own
# subjects collector.<org>.<collector>.> and its own reply inbox in the
# account COLLECTORS. A leaf node bridges that account to the internal NATS
# (RETICORA_NATS_EDGE_LEAF_URL, e.g. nats://nats:7422).
port: 4222
server_name: reticora-nats-edge

include ./pki/edge.conf

leafnodes {
  remotes: [
    { url: $RETICORA_NATS_EDGE_LEAF_URL, account: COLLECTORS }
  ]
}
