# pgBackRest configuration of the Reticora stack (WP-100, OPS-04, NFR-05/06).
#
# repo1 is the local repository on the "pgbackrest" volume. An offsite
# repository (repo2, S3 over HTTPS, versioned and replicated bucket) is
# added through RETICORA_BACKUP_S3_* (reticora-pgbackrest-env.sh); every
# WAL segment and backup then goes to both repositories.
#
# The repository is encrypted: PGBACKREST_REPO1_CIPHER_PASS comes from
# RETICORA_BACKUP_CIPHER_PASS in .env. Without that passphrase the backups
# cannot be read — keep it with the other secrets of the installation.

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# Backups are kept 35 days (NFR-06); WAL needed by the kept backups is
# kept with them.
repo1-retention-full-type=time
repo1-retention-full=35
compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-file=off
archive-timeout=120

[reticora]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=reticora
pg1-database=reticora
