# Compose overrides: build the images from source instead of pulling prebuilt
# ones. Merged automatically by `docker compose` only when it runs from this
# directory (or when the file is passed with an explicit -f; install-cloud.sh
# does exactly that). Rename it to docker-compose.override.yml.disabled when
# RETICORA_SERVER_IMAGE / RETICORA_FRONTEND_IMAGE point to a registry.
services:
  server:
    build:
      # The backend module replace-directs to the sibling collector/edgecore
      # modules, so the build context must be the repository root.
      context: ../../
      dockerfile: backend/Dockerfile

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
