# Internal NATS of the Reticora stack (jobs, ingest, events). It is not
# reachable from outside the host; the collector endpoint is nats-edge
# (nats-edge.conf), which bridges the collectors' account to this server
# over the leaf node port (internal network only).
port: 4222
http: 8222
jetstream {
  store_dir: "/data"
}
leafnodes {
  port: 7422
}
