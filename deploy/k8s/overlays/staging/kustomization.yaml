apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: reticora-staging

commonLabels:
  app.kubernetes.io/environment: staging

images:
  - name: reticora-cmdb/server
    newTag: staging

patches:
  # Single replica, no HPA and smaller resource footprint for staging. The
  # strategic merge patch sets only what differs from the base; env entries
  # merge by name, so every other variable of the base (runtime login
  # reticora-db-runtime (TEN-03), master key, OIDC, invitation accept URL,
  # worker switches) is inherited, and a new mandatory key of the base
  # reaches staging without repeating it here (OPS-03, F-036). The references
  # resolve in this namespace: the operator creates the secrets and the
  # ConfigMap reticora-config with the staging values (deploy/README.md).
  - target:
      kind: Deployment
      name: reticora-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: reticora-server
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: RETICORA_ENVIRONMENT
                    value: "staging"
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 250m
                    memory: 256Mi

  # Remove the HPA in staging; a single replica is sufficient.
  - target:
      kind: HorizontalPodAutoscaler
      name: reticora-server
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: reticora-server
