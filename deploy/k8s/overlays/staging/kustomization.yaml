apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: reticora-staging

commonLabels:
  app.kubernetes.io/environment: staging

images:
  - name: reticora-cmdb/server
    newTag: staging

patches:
  # Single replica, no HPA and smaller resource footprint for staging.
  - target:
      kind: Deployment
      name: reticora-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: RETICORA_PORT
            value: "8080"
          - name: RETICORA_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: reticora-secrets
                key: database-url
          - name: RETICORA_NATS_URL
            value: "nats://nats:4222"
          - name: RETICORA_REDIS_URL
            value: "redis://redis:6379"
          - name: RETICORA_ENVIRONMENT
            value: "staging"
          - name: RETICORA_OTEL_ENDPOINT
            value: ""
          - name: RETICORA_METRICS_TENANT_LABEL
            value: "false"
          - name: RETICORA_SESSION_KEY_PATH
            value: "/etc/reticora/session/private.pem"
          # The env list is replaced as a whole, so the mandatory master key
          # of the base deployment has to be repeated here (OPS-03).
          - name: RETICORA_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: reticora-secrets
                key: master-key
                optional: false
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

  # Remove the HPA in staging; a single replica is sufficient.
  - target:
      kind: HorizontalPodAutoscaler
      name: reticora-server
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: reticora-server
