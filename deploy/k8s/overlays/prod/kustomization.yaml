apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Production adds the optional OpenSearch search backend component (Epic G2),
# which also appends the RETICORA_OPENSEARCH_* / RETICORA_SEARCH_BACKEND env
# vars to the server deployment, the database reticora-db with WAL archiving
# (component postgres, OPS-04, E-74 transitional rule: option 1; secrets
# reticora-postgres and reticora-pgbackrest) and the backups (Epic H2: daily
# pgBackRest full backup and nightly pg_dump; secrets reticora-pgbackrest and
# reticora-backup). Point reticora-db-runtime and reticora-db-migrate at the
# host reticora-db (deploy/README.md).
components:
  - ../../base/components/opensearch
  - ../../base/components/postgres
  - ../../base/components/backup
  - ../../base/components/nats-edge

namespace: reticora

commonLabels:
  app.kubernetes.io/environment: production

# The signed release images: release.yml pushes
# ghcr.io/datahub-chiemgau/reticora-<name>:<tag> for every version tag v*
# (cosign keyless, F-293). Raise newTag with each release; CI (k8s-manifests)
# rejects any other origin of a Reticora image in this build.
images:
  - name: reticora-cmdb/server
    newName: ghcr.io/datahub-chiemgau/reticora-server
    newTag: v1.0.0
  - name: reticora-cmdb/postgres
    newName: ghcr.io/datahub-chiemgau/reticora-postgres
    newTag: v1.0.0

patches:
  # Scale out for production and raise the resource envelope. The base already
  # sets RETICORA_ENVIRONMENT=production, the observability env vars, the
  # mandatory RETICORA_MASTER_KEY and OIDC client secret from the
  # reticora-secrets secret and the OIDC settings and invitation accept URL
  # from the reticora-config ConfigMap.
  - target:
      kind: Deployment
      name: reticora-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
