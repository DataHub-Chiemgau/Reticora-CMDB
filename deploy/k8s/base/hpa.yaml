apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reticora-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reticora-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# The monitoring workers scale apart from the API (WP-869, E-162).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reticora-monitoring
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reticora-monitoring
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
