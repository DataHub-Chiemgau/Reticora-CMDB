apiVersion: apps/v1
kind: Deployment
metadata:
  name: reticora-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: reticora-server
      containers:
        - name: server
          image: reticora-cmdb/server:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: RETICORA_PORT
              value: "8080"
            - name: RETICORA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reticora-secrets
                  key: database-url
            - name: RETICORA_NATS_URL
              value: "nats://nats:4222"
            - name: RETICORA_REDIS_URL
              value: "redis://redis:6379"
            - name: RETICORA_ENVIRONMENT
              value: "production"
            # OTLP exporter endpoint (Epic H3). Empty disables export and the
            # server runs with no-op telemetry providers.
            - name: RETICORA_OTEL_ENDPOINT
              value: ""
            # Opt-in tenant label on HTTP metrics; multiplies series by the
            # tenant count. Enable only for bounded-tenant deployments.
            - name: RETICORA_METRICS_TENANT_LABEL
              value: "false"
            # Session-token signature verification is mandatory in
            # production; the pod refuses to start without the key.
            - name: RETICORA_SESSION_KEY_PATH
              value: "/etc/reticora/session/private.pem"
          volumeMounts:
            - name: session-key
              mountPath: /etc/reticora/session
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: session-key
          secret:
            secretName: reticora-session-key
