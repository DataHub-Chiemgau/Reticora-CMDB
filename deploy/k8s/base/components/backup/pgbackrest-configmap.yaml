# pgBackRest repository host (WP-100, OPS-04, E-29). The database runs
# outside the cluster (or in its own StatefulSet) with
#   archive_mode = on
#   archive_command = 'pgbackrest --stanza=reticora archive-push %p'
#   archive_timeout = 300
# and the pgBackRest TLS server (`pgbackrest server`, tls-server-* options),
# using this same repository configuration. The CronJob in
# pgbackrest-cronjob.yaml takes the daily full backup over that TLS
# connection. Runbook: docs/backup-dr.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: reticora-pgbackrest
data:
  pgbackrest.conf: |
    [global]
    # Offsite repository: S3 bucket in the backup region (NFR-09), with
    # versioning and replication (deploy/terraform, backup_policy).
    repo1-type=s3
    repo1-path=/reticora
    repo1-s3-bucket=reticora-backup
    repo1-s3-endpoint=s3.eu-central-1.amazonaws.com
    repo1-s3-region=eu-central-1
    repo1-cipher-type=aes-256-cbc
    # Backups and their WAL are kept 35 days (NFR-06).
    repo1-retention-full-type=time
    repo1-retention-full=35
    repo1-bundle=y
    compress-type=zst
    start-fast=y
    process-max=2
    log-level-console=info
    log-level-file=off

    [reticora]
    pg1-host=reticora-db.reticora.svc
    pg1-host-type=tls
    pg1-host-ca-file=/etc/pgbackrest/tls/ca.crt
    pg1-host-cert-file=/etc/pgbackrest/tls/tls.crt
    pg1-host-key-file=/etc/pgbackrest/tls/tls.key
    pg1-path=/var/lib/postgresql/data
