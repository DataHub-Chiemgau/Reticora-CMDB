apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Required secrets (not generated here, see deploy/README.md):
#   reticora-secrets      keys database-url, master-key
#   reticora-session-key  key private.pem
resources:
  - deployment.yaml
  - service.yaml
  - serviceaccount.yaml
  - hpa.yaml

namespace: reticora

commonLabels:
  app.kubernetes.io/name: reticora-cmdb
  app.kubernetes.io/part-of: reticora
