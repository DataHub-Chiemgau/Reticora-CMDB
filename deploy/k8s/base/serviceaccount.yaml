apiVersion: v1
kind: ServiceAccount
metadata:
  name: reticora-server
---
# The server reads its database DSN and session-signing key from secrets.
# Create them out-of-band (sealed-secrets, ExternalSecrets, SOPS) — they must
# never be committed with real values:
#   kubectl create secret generic reticora-secrets \
#     --from-literal=database-url='postgres://...'
#   kubectl create secret generic reticora-session-key \
#     --from-file=private.pem=./session-private.pem
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reticora-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
