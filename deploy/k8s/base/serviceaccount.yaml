apiVersion: v1
kind: ServiceAccount
metadata:
  name: reticora-server
---
# The server reads its database DSN (runtime login without SUPERUSER and
# BYPASSRLS, deploy/README.md) and session-signing key from secrets. Create
# them out-of-band (sealed-secrets, ExternalSecrets, SOPS) — they must never
# be committed with real values:
#   kubectl create secret generic reticora-db-runtime \
#     --from-literal=database-url='postgres://reticora_runtime:...'
#   kubectl create secret generic reticora-session-key \
#     --from-file=private.pem=./session-private.pem
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reticora-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
