services:
  postgres:
    image: timescale/timescaledb:2.32.0-pg16@sha256:2f87efeaec6fbdd3ba4a6993b921c05d069cd8e980792cb23c7c5f32a6fe68a7
    environment:
      POSTGRES_DB: reticora
      POSTGRES_USER: reticora
      POSTGRES_PASSWORD: reticora_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reticora"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # minio/minio is archived and no longer published on Docker Hub. Silo
    # (pgsty/silo, the former pgsty/minio, whose image name is frozen since
    # RELEASE.2026-08-04) is a community-maintained, drop-in fork of the MinIO
    # server (same S3 API, MINIO_* variables and data format, `mc` included,
    # AGPLv3), pinned by release tag and digest (E-246). The standard image,
    # not -distroless: the healthcheck and the test setups run `mc` and `sh`
    # inside the container.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: reticora
      MINIO_ROOT_PASSWORD: reticora_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Malware scan of document uploads (SEC-09, E-42, WP-735): the server's
  # development default RETICORA_CLAMD_ADDR=localhost:3310 reaches it. The
  # image ships a signature database and freshclam keeps it current; the
  # first start loads the signatures for about a minute (healthcheck).
  clamd:
    image: clamav/clamav:1.5.4@sha256:6d87c712e3391e13c1ba6e05dfb074d4b1ddb5a6834b23bb9da990d2a4ef042a
    environment:
      CLAMD_CONF_StreamMaxLength: "51M"
      CLAMD_CONF_MaxFileSize: "51M"
      CLAMD_CONF_MaxScanSize: "200M"
    ports:
      - "3310:3310"
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: dev-mem
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      # Development only: the dev realm adds the demo user to the production
      # realm (deploy/keycloak/README.md); production imports
      # realm-reticora.json without any user.
      - ./deploy/keycloak/realm-reticora-dev.json:/opt/keycloak/data/import/realm-reticora-dev.json:ro
    depends_on:
      - postgres

volumes:
  pgdata:
  natsdata:
  miniodata:
  clamdata:
